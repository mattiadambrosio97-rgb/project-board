            </div>`;
        });
        html += '</div></div>';
    }

    html += '</div>';
    return html;
}

function buildDonut(data, total) {
    const size = 140, cx = 70, cy = 70, r = 55, strokeW = 20;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    let paths = '';

    data.forEach(d => {
        if (d.count === 0) return;
        const len = (d.count / total) * circumference;
        const colorMap = { todo: '#6B7280', in_progress: '#CA8A04', review: '#8B5CF6', done: '#3D9A50', blocked: '#D94F4F' };
        paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[d.status]}" stroke-width="${strokeW}" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="-${offset}" transform="rotate(-90 ${cx} ${cy})" />`;
        offset += len;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeW}" />
        ${paths}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">${total}</text>
        <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">task</text>
    </svg>`;
}

// ========== DRAG & DROP ==========
// ========== GLOBAL BOARD DRAG (changes STATUS) ==========
let globalDragData = { taskId: null, projectId: null };

function onDragStartGlobal(e, taskId, projectId) {
    globalDragData = { taskId, projectId };
    e.dataTransfer.effectAllowed = 'move';
    e.target.classList.add('dragging');
}

function onDragOverGlobal(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function onDropGlobal(e, newStatus) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!globalDragData.taskId) return;
    const projects = getProjects();
    const p = projects.find(pr => pr.id === globalDragData.projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === globalDragData.taskId);
    if (task && task.status !== newStatus) {
        const wasDone = task.status === 'done';
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[newStatus] || newStatus) });
        task.status = newStatus;
        if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
        if (task.status !== 'done') task.completedAt = null;
        saveProjects(projects);
    }
    globalDragData = { taskId: null, projectId: null };
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    render();
}

// ========== PROJECT BOARD DRAG ==========
function onDragStart(e, taskId) {
    state.dragTask = taskId;
    e.dataTransfer.effectAllowed = 'move';
    e.target.classList.add('dragging');
}

function onDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

function onDrop(e, projectId, newStatus) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!state.dragTask) return;

    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === state.dragTask);
    if (task && task.status !== newStatus) {
        const oldStatus = task.status;
        task.status = newStatus;
        if (newStatus === 'done' && !task.completedAt) {
            task.completedAt = Date.now();
        }
        if (oldStatus === 'done' && newStatus !== 'done') {
            task.completedAt = null;
        }
        saveProjects(projects);
    }
    state.dragTask = null;
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    render();
}

// ========== STATUS CYCLING ==========
function cycleTaskStatus(taskId, projectId) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    const idx = STATUS_LIST.indexOf(task.status);
    const wasDone = task.status === 'done';
    const oldStatus = task.status;
    task.status = STATUS_LIST[(idx + 1) % STATUS_LIST.length];
    if (oldStatus !== task.status) {
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[task.status] || task.status) });
    }
    if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
    if (task.status !== 'done') task.completedAt = null;
    saveProjects(projects);
    render();
}

function changeTaskStatus(taskId, projectId, newStatus) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    const wasDone = task.status === 'done';
    if (task.status !== newStatus) {
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[newStatus] || newStatus) });
    }
    task.status = newStatus;
    if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
    if (task.status !== 'done') task.completedAt = null;
    saveProjects(projects);
    render();
}

function cycleProjectStatus(projectId) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const idx = PROJECT_STATUSES.indexOf(p.status);
    p.status = PROJECT_STATUSES[(idx + 1) % PROJECT_STATUSES.length];
    saveProjects(projects);
    render();
}

// ========== TASK MODAL ==========
function openTaskModal(taskId, projectId, unused, defaultStatus) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;

    const isNew = !taskId;
    const task = isNew ? {
        id: genId(), title: '',
        assignee: '', status: defaultStatus || 'todo', dependsOn: [],
        dueDate: '', estimateHours: 0, tags: [], comments: [],
        createdAt: Date.now(), completedAt: null, recurrence: null, note: '',
        nextCheck: '', doneWhen: '', dependsLabel: '', activityLog: []
    } : p.tasks.find(t => t.id === taskId);
    if (!task) return;

    const team = getTeam();
    const otherTasks = p.tasks.filter(t => t.id !== task.id);
    const modal = document.getElementById('taskModalInner');
    let html = '';

    // ── Header compatto: X + titolo sulla stessa riga ──
    html += `<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px">`;
    html += `<input class="modal-title-input" id="tmTitle" placeholder="Titolo task..." value="${esc(task.title)}" style="flex:1;margin:0;padding:8px 0">`;
    html += `<button onclick="closeTaskModal()" style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font)">&times;</button>`;
    html += `</div>`;

    // ── Status rapido: se non done, bottone "Fatto"; se done, badge + rimetti ──
    if (!isNew && task.status !== 'done') {
        html += `<button onclick="changeTaskStatus('${task.id}','${p.id}','done');closeTaskModal()" style="width:100%;padding:10px;font-size:14px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);margin-bottom:14px;touch-action:manipulation">Segna come FATTO</button>`;
    }
    if (task.status === 'done') {
        html += `<div style="background:var(--green-bg);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
            <span style="color:var(--green);font-weight:700;font-size:14px">Completata</span>
            <button style="padding:6px 14px;border-radius:8px;border:none;background:var(--yellow-bg);color:var(--yellow);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)" onclick="changeTaskStatus('${task.id}','${p.id}','in_progress');closeTaskModal();setTimeout(()=>openTaskModal('${task.id}','${p.id}'),150)">Rimetti in corso</button>
        </div>`;
    }

    // ── Campi principali: Stato + Assegnato + Scadenza ──
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">`;
    // Stato dropdown
    html += `<div class="modal-field"><span class="modal-label">Stato</span>
        <select class="modal-select" id="tmStatus" style="font-size:14px">
            ${STATUS_LIST.map(s => `<option value="${s}" ${task.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select></div>`;
    // Assegnato dropdown
    html += `<div class="modal-field"><span class="modal-label">Assegnato a</span>
        <select class="modal-select" id="tmAssignee" style="font-size:14px">
            <option value="">—</option>
            ${team.map(m => `<option value="${esc(m.name)}" ${task.assignee===m.name?'selected':''}>${esc(m.name)}</option>`).join('')}
        </select></div>`;
    html += `</div>`;

    // Scadenza
    html += `<div class="modal-field" style="margin-bottom:12px"><span class="modal-label">Scadenza</span>
        <input type="date" class="modal-input" id="tmDue" value="${task.dueDate||''}" style="cursor:pointer"></div>`;

    // Note
    html += `<div class="modal-field" style="margin-bottom:12px"><span class="modal-label">Note</span>

    // ── Istruzioni per Alberto — solo se assegnata a lui o ha ceoNote ──
    const showCeoNote = task.assignee === 'Alberto' || (task.ceoNote && task.ceoNote.trim());
    html += `<div id="tmCeoNoteWrap" style="margin-bottom:12px;${showCeoNote ? '' : 'display:none'}"><div class="modal-field"><span class="modal-label" style="color:var(--orange)">Istruzioni per Alberto</span>
        <textarea class="modal-textarea" id="tmCeoNote" rows="2" placeholder="Cosa deve fare Alberto?">${esc(task.ceoNote||'')}</textarea>
    </div></div>`;

    // ── Chat con Alberto (se esiste) ──
    var allTaskMsgs = [];
    (task.ceoUpdates || []).forEach(function(u) { allTaskMsgs.push({ from: 'ceo', note: u.note, type: u.type, at: u.at }); });
    (task.cooResponses || []).forEach(function(r) { allTaskMsgs.push({ from: 'coo', note: r.note, type: 'response', at: r.at }); });
    allTaskMsgs.sort(function(a, b) { return new Date(a.at) - new Date(b.at); });
    if (allTaskMsgs.length > 0) {
        html += '<div style="margin-bottom:12px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px">';
        html += '<div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase">Chat con Alberto</div>';
        allTaskMsgs.forEach(function(msg) {
            var mDate = new Date(msg.at).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            var isCeo = msg.from === 'ceo';
            var bgCol = isCeo ? 'var(--blue-bg,#EFF6FF)' : 'var(--accent-soft,#FFF1ED)';
            var nameCol = isCeo ? 'var(--blue)' : 'var(--accent)';
            var name = isCeo ? 'Alberto' : 'Tu';
            html += '<div style="padding:5px 8px;background:' + bgCol + ';border-radius:6px;margin-bottom:3px;font-size:12px">';
            html += '<span style="font-weight:700;color:' + nameCol + '">' + name + '</span>';
            html += ' <span style="font-size:10px;color:var(--text-muted)">' + mDate + '</span>';
            if (msg.note) html += '<div style="color:var(--text-secondary);margin-top:2px">' + esc(msg.note) + '</div>';
            html += '</div>';
        });
        html += '<div style="display:flex;gap:6px;margin-top:6px">';
        html += '<input id="cooTaskReplyInput_' + task.id + '" type="text" placeholder="Rispondi..." style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text)" onkeydown="if(event.key===\'Enter\')cooRespondToTask(\'' + task.id + '\',\'' + p.id + '\')">';
        html += '<button onclick="cooRespondToTask(\'' + task.id + '\',\'' + p.id + '\')" style="padding:8px 12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)">Invia</button>';
        html += '</div></div>';
    }

    // ── Sezione avanzata (collapsibile) ──
    const hasAdvanced = task.nextCheck || task.doneWhen || task.dependsLabel || (task.tags||[]).length > 0 || task.recurrence || (task.activityLog||[]).length > 0;
    html += `<button class="modal-section-toggle" onclick="toggleModalExtra()" style="margin-bottom:8px">
        <span class="toggle-arrow" id="extraArrow">&#9654;</span> Dettagli avanzati${hasAdvanced ? ' <span style="font-size:10px;color:var(--accent);margin-left:4px">●</span>' : ''}
    </button>`;
    html += `<div class="modal-extra collapsed" id="modalExtra" style="max-height:2000px">`;

    // Prossimo check + Fatto quando
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
    html += `<div class="modal-field"><span class="modal-label">Prossimo check</span><input type="date" class="modal-input" id="tmNextCheck" value="${task.nextCheck||''}" style="cursor:pointer"></div>`;
    html += `<div class="modal-field"><span class="modal-label">Fatto quando</span><input class="modal-input" id="tmDoneWhen" placeholder="es. bozza su WeTransfer" value="${esc(task.doneWhen||'')}"></div>`;
    html += '</div>';

    // Dipende da + Ricorrenza
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
    html += `<div class="modal-field"><span class="modal-label">Dipende da</span><input class="modal-input" id="tmDependsLabel" placeholder="es. aspetta Max" value="${esc(task.dependsLabel||'')}"></div>`;
    html += `<div class="modal-field"><span class="modal-label">Ricorrenza</span><select class="modal-select" id="tmRecurrence">
        <option value="" ${!task.recurrence?'selected':''}>Nessuna</option>
        <option value="daily" ${task.recurrence==='daily'?'selected':''}>Giornaliera</option>
        <option value="weekly" ${task.recurrence==='weekly'?'selected':''}>Settimanale</option>
        <option value="biweekly" ${task.recurrence==='biweekly'?'selected':''}>Bisettimanale</option>
        <option value="monthly" ${task.recurrence==='monthly'?'selected':''}>Mensile</option>
    </select></div>`;
    html += '</div>';
    html += `<input type="hidden" id="tmHours" value="0">`;

    // Tags
    html += `<div class="modal-field" style="margin-bottom:10px"><span class="modal-label">Tag</span>
        <div class="tags-input-wrap" id="tmTagsWrap" onclick="document.getElementById('tmTagInput').focus()">
            ${(task.tags||[]).map(tag=>`<span class="tag-pill">${esc(tag)}<span class="tag-pill-x" onclick="removeTag(this,'${esc(tag)}')">&times;</span></span>`).join('')}
            <input class="tags-input" id="tmTagInput" placeholder="Aggiungi tag..." onkeydown="if(event.key==='Enter'){event.preventDefault();addTag(this)}">
        </div>
    </div>`;

    // Dependencies
    if (otherTasks.length > 0) {
        html += `<div class="modal-field" style="margin-bottom:10px"><span class="modal-label">Dipende da (task)</span>
            <div class="deps-list">
                ${otherTasks.map(t=>`<div class="dep-item"><input type="checkbox" value="${t.id}" ${(task.dependsOn||[]).includes(t.id)?'checked':''}><span>${esc(t.title)}</span></div>`).join('')}
            </div>
        </div>`;
    }

    // Activity Log
    const actLog = task.activityLog || [];
    html += `<div style="border-top:1px solid var(--border-light);padding-top:10px;margin-top:4px">
        <div style="font-size:12px;font-weight:700;margin-bottom:8px">Registro attivita</div>
        <div class="activity-add-row">
            <input id="tmNewActivity" placeholder="Aggiungi aggiornamento..." onkeydown="if(event.key==='Enter'){event.preventDefault();addActivityEntry('${task.id}','${p.id}',${isNew})}">
            <button class="activity-add-btn" onclick="addActivityEntry('${task.id}','${p.id}',${isNew})">+</button>
        </div>
        <div class="task-activity-log">`;
    [...actLog].reverse().slice(0, 5).forEach(entry => {
        html += `<div class="task-activity-entry">
            <div class="task-activity-date">${entry.date || ''}</div>
            <div class="task-activity-text">${esc(entry.text)}</div>
        </div>`;
    });
    if (actLog.length === 0) html += '<div style="font-size:11px;color:var(--text-muted);padding:4px 0">Nessuna attivita</div>';
    if (actLog.length > 5) html += '<div style="font-size:11px;color:var(--text-muted)">...e altre ' + (actLog.length - 5) + '</div>';
    html += '</div></div>';

    html += '</div>'; // close modal-extra

    // ── Azioni: Salva grande, Elimina piccolo ──
    html += `<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">`;
    html += `<button class="btn-save" onclick="saveTask('${task.id}','${p.id}',${isNew})" style="width:100%;padding:14px;font-size:15px;border-radius:10px">Salva</button>`;
    if (!isNew) {
        html += `<div style="display:flex;justify-content:center;gap:16px;padding:4px 0">`;
        html += `<button onclick="closeTaskModal()" style="background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:var(--font);padding:4px 8px">Annulla</button>`;
        html += `<button onclick="if(confirm('Eliminare questa task?'))deleteTask('${task.id}','${p.id}')" style="background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;font-family:var(--font);padding:4px 8px">Elimina</button>`;
        html += `</div>`;
    }
    html += `</div>`;

    // Info
    if (!isNew) {
        html += `<div style="margin-top:8px;font-size:10px;color:var(--text-muted);text-align:center">
            Creata: ${formatTimestamp(task.createdAt)}${task.completedAt ? ' | Completata: ' + formatTimestamp(task.completedAt) : ''}
        </div>`;
    }

    modal.innerHTML = html;
    document.getElementById('taskModal').classList.add('open');
    document.getElementById('taskModal').onclick = (e) => { if (e.target === document.getElementById('taskModal')) closeTaskModal(); };
    // Mostra/nascondi ceoNote quando cambia assegnazione
    var _tmAssignee = document.getElementById('tmAssignee');
    if (_tmAssignee) _tmAssignee.addEventListener('change', function() { var w = document.getElementById('tmCeoNoteWrap'); if(w) w.style.display = this.value === 'Alberto' ? '' : 'none'; });
    if (isNew) setTimeout(() => document.getElementById('tmTitle').focus(), 100);
}

    el.classList.add('selected');

function toggleModalExtra() {
    const extra = document.getElementById('modalExtra');

    extra.classList.toggle('collapsed');
    arrow.classList.toggle('open');
}

function closeTaskModal() {
    document.getElementById('taskModal').classList.remove('open');
}

function saveTask(taskId, projectId, isNew) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;

    const title = document.getElementById('tmTitle').value.trim();
    if (!title) { document.getElementById('tmTitle').style.borderColor = 'var(--red)'; return; }

    const taskData = {
        id: taskId,
        title: title,
        status: document.getElementById('tmStatus').value || 'todo',
        assignee: document.getElementById('tmAssignee').value || '',
        dueDate: document.getElementById('tmDue').value,
        estimateHours: parseFloat(document.getElementById('tmHours').value) || 0,
        recurrence: document.getElementById('tmRecurrence').value || null,
        note: document.getElementById('tmNote').value,
        ceoNote: document.getElementById('tmCeoNote').value || '',
        nextCheck: document.getElementById('tmNextCheck').value || '',
        doneWhen: document.getElementById('tmDoneWhen').value || '',
        dependsLabel: document.getElementById('tmDependsLabel').value || '',
        tags: [...document.querySelectorAll('#tmTagsWrap .tag-pill')].map(el => el.textContent.replace('×','')),
        dependsOn: [...document.querySelectorAll('.deps-list input:checked')].map(el => el.value),
        comments: [],
        createdAt: Date.now(),
        completedAt: null,
        activityLog: [],
    };

    let justCompleted = false;
    if (isNew) {
        if (taskData.status === 'done') { taskData.completedAt = Date.now(); justCompleted = true; }
        p.tasks.push(taskData);
    } else {
        const existing = p.tasks.find(t => t.id === taskId);
        if (existing) {
            const wasDone = existing.status === 'done';
            taskData.comments = existing.comments;
            taskData.createdAt = existing.createdAt;
            taskData.completedAt = existing.completedAt;
            taskData.activityLog = existing.activityLog || [];
            // Auto-log status change
            if (existing.status !== taskData.status) {
                taskData.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[taskData.status] || taskData.status) });
            }
            if (taskData.status === 'done' && !taskData.completedAt) taskData.completedAt = Date.now();
            if (taskData.status !== 'done') taskData.completedAt = null;
            if (!wasDone && taskData.status === 'done') justCompleted = true;
            Object.assign(existing, taskData);
        }
    }

    saveProjects(projects);
    closeTaskModal();
    render();
}

function deleteTask(taskId, projectId) {
    if (!confirm('Eliminare questa task?')) return;
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    p.tasks = p.tasks.filter(t => t.id !== taskId);
    saveProjects(projects);
    closeTaskModal();
    render();
}

function addComment(taskId, projectId, isNew) {
    const text = document.getElementById('tmNewComment').value.trim();
    if (!text) return;
    if (isNew) {
        // Save task first
        saveTask(taskId, projectId, true);
        return;
    }
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!task.comments) task.comments = [];
    task.comments.push({ text, author: 'Mattia', createdAt: Date.now() });
    saveProjects(projects);
    openTaskModal(taskId, projectId); // refresh modal
}

function addTag(input) {
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const wrap = document.getElementById('tmTagsWrap');
    const existing = [...wrap.querySelectorAll('.tag-pill')].map(el => el.textContent.replace('×',''));
    if (existing.includes(val)) { input.value = ''; return; }
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${esc(val)}<span class="tag-pill-x" onclick="this.parentElement.remove()">&times;</span>`;
    wrap.insertBefore(pill, input);
    input.value = '';
}

function removeTag(el, tag) {
    el.parentElement.remove();
}

function addActivityEntry(taskId, projectId, isNew) {
    const text = document.getElementById('tmNewActivity').value.trim();
    if (!text) return;
    if (isNew) {
        // Task non ancora salvata — salva prima
        saveTask(taskId, projectId, true);
        return;
    }
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!task.activityLog) task.activityLog = [];
    task.activityLog.push({ date: today(), text: text });
    saveProjects(projects);
    openTaskModal(taskId, projectId); // refresh modal
}

function closeProjectModal() {
    document.getElementById('projectModal').classList.remove('open');
}


function saveProject(projectId, isNew) {
    const projects = getProjects();
    const name = document.getElementById('pmName').value.trim();
    if (!name) { document.getElementById('pmName').style.borderColor = 'var(--red)'; return; }

    const launchDate = document.getElementById('pmLaunchDate').value || null;

    if (isNew) {
        projects.push({
            id: projectId,
            name: name,
            description: document.getElementById('pmDesc').value.trim(),
            status: document.getElementById('pmStatus').value,
            launchDate: launchDate,
            tasks: []
        });
    } else {
        const p = projects.find(pr => pr.id === projectId);
        if (!p) return;
        p.name = name;
        p.description = document.getElementById('pmDesc').value.trim();
        p.status = document.getElementById('pmStatus').value;
        p.launchDate = launchDate;
    }

    saveProjects(projects);
    closeProjectModal();
    render();
}

function deleteProject(projectId) {
    if (!confirm('Eliminare questo progetto e tutte le sue task?')) return;
    let projects = getProjects();
    projects = projects.filter(p => p.id !== projectId);
    saveProjects(projects);
    closeProjectModal();
    goGlobal();
}

// ========== BACKUP MODAL ==========
function showTasksByStatus(projectId, status) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const items = (p.tasks||[]).filter(t => t.status === status);
    if (!items.length) return;
    const colorMap = { todo:'var(--slate)', in_progress:'var(--yellow)', review:'var(--purple)', done:'var(--green)', blocked:'var(--red)' };
    const bgMap = { todo:'var(--slate-bg)', in_progress:'var(--yellow-bg)', review:'var(--purple-bg)', done:'var(--green-bg)', blocked:'var(--red-bg)' };
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:${colorMap[status]}">${STATUS_LABELS[status]} (${items.length})</div>`;
    items.forEach(t => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div style="padding:12px 16px;background:${bgMap[status]};border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px" onclick="openTaskFromPopup('${t.id}','${p.id}')">
            <div style="flex:1">
                <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(t.title)}</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${t.assignee||'Non assegnata'}${t.dueDate ? ' — '+smartDate(t.dueDate) : ''}</div>
            </div>
            ${status !== 'done' ? `<button class="quick-done-btn" style="width:auto;margin:0;padding:4px 12px" onclick="event.stopPropagation();changeTaskStatus('${t.id}','${p.id}','done');showTasksByStatus('${p.id}','${status}')">&#10003; Fatto</button>` : ''}
        </div>`;
    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;
    document.getElementById('backupModal').classList.add('open');
}

function showBlockedTasks() {
    const projects = getProjects();
    let items = [];
    projects.forEach(p => {
        (p.tasks||[]).forEach(t => {
            if (t.status === 'blocked') items.push({task: t, project: p});
        });
    });
    if (!items.length) return;
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--red)">Task bloccate (${items.length})</div>`;
    items.forEach(({task: t, project: p}) => {
        html += `<div style="padding:12px 16px;background:var(--red-bg);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="openTaskFromPopup('${t.id}','${p.id}')">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(t.title)}</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${esc(p.name)} — ${t.assignee||'Non assegnata'} — Scadenza: ${t.dueDate ? smartDate(t.dueDate) : 'Nessuna'}</div>
            ${t.dependsLabel ? '<div style="font-size:12px;color:var(--orange);margin-top:4px">⛓️ '+esc(t.dependsLabel)+'</div>' : ''}
        </div>`;
    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;
    document.getElementById('backupModal').classList.add('open');
}

function showWeekTasks() {
    const projects = getProjects();
    const now = new Date(); now.setHours(0,0,0,0);
    const weekEnd = new Date(now); weekEnd.setDate(weekEnd.getDate() + 7);
    let items = [];
    projects.forEach(p => {
        (p.tasks||[]).forEach(t => {
            if (t.status === 'done' || !t.dueDate) return;
            const d = new Date(t.dueDate); d.setHours(0,0,0,0);
            if (d >= now && d <= weekEnd) items.push({task: t, project: p});
        });
    });
    if (!items.length) return;
    items.sort((a,b) => new Date(a.task.dueDate) - new Date(b.task.dueDate));
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--orange)">Scadenze questa settimana (${items.length})</div>`;
    items.forEach(({task: t, project: p}) => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div style="padding:12px 16px;background:var(--bg);border-radius:10px;margin-bottom:8px;cursor:pointer;border-left:3px solid ${dc==='overdue'?'var(--red)':dc==='today'?'var(--orange)':'var(--blue)'}" onclick="openTaskFromPopup('${t.id}','${p.id}')">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(t.title)}</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${esc(p.name)} — ${t.assignee||'Non assegnata'} — <span class="task-card-due ${dc}">${smartDate(t.dueDate)}</span></div>
        </div>`;
    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;
    document.getElementById('backupModal').classList.add('open');
}

function showUnblockPopup() {
    const actions = window._pmActions || [];
    if (!actions.length) return;
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--red)">Da sbloccare (${actions.length})</div>`;
    html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Task bloccate o scadute assegnate ai collaboratori. Contattali per sbloccare.</div>`;
    // Raggruppa per persona
    const byPerson = {};
    actions.forEach(a => { if (!byPerson[a.person]) byPerson[a.person] = []; byPerson[a.person].push(a); });
    Object.keys(byPerson).forEach(person => {
        html += `<div style="margin-bottom:12px;">`;
        html += `<div style="font-size:14px;font-weight:700;margin-bottom:6px;">${esc(person)}</div>`;
        byPerson[person].forEach(a => {
            const icon = a.isBlocked ? '&#9632;' : '&#9888;';
            const color = a.isBlocked ? 'var(--red)' : 'var(--orange)';
            const label = a.isBlocked ? 'Bloccata' : 'Scaduta';
            const days = a.isOverdue && a.dueDate ? Math.abs(daysDiff(a.dueDate)) + 'gg fa' : '';
            var clickHandler = a.taskId && a.projectId ? `onclick="openTaskFromPopup('${a.taskId}','${a.projectId}')"` : '';

function cooRespondFromPopup(taskId, projectId) {

function showCeoProjectNotes() {

        return;

        var notes = p.ceoProjectNotes || [];

        // Mostra ultimi messaggi come conversazione
        var convo = [];
        notes.forEach(function(n) { convo.push({ from: 'ceo', note: n.note, at: n.at }); });
        cooResps.forEach(function(r) { convo.push({ from: 'coo', note: r.note, at: r.at }); });
        convo.sort(function(a, b) { return new Date(a.at) - new Date(b.at); });
        var lastFew = convo.slice(-4);

        html += '<div style="padding:14px 16px;background:var(--purple-bg,#F5F3FF);border:1px solid var(--purple,#8B5CF6)33;border-radius:10px;margin-bottom:12px">';

                html += '<div style="font-size:13px;color:var(--text);margin-top:2px">' + esc(msg.note) + '</div>';
                html += '</div>';
            });
            html += '</div>';
        }

        html += '</div>';
    });
    html += '<div style="text-align:right;margin-top:12px"><button class="btn-cancel" onclick="document.getElementById(\'backupModal\').classList.remove(\'open\')">Chiudi</button></div>';
    modal.innerHTML = html;

function showOverdueTasks() {
    const projects = getProjects();
    const todayStr = today();
    let items = [];
    projects.forEach(p => {
        (p.tasks||[]).forEach(t => {
            if (t.status !== 'done' && t.dueDate && t.dueDate < todayStr) items.push({task: t, project: p});
        });
    });
    if (!items.length) return;
    items.sort((a,b) => a.task.dueDate.localeCompare(b.task.dueDate));
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--red)">In ritardo (${items.length})</div>`;
    items.forEach(({task: t, project: p}) => {
        const days = Math.abs(daysDiff(t.dueDate));
        html += `<div style="padding:12px 16px;background:var(--red-bg);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="openTaskFromPopup('${t.id}','${p.id}')">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(t.title)}</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${esc(p.name)} — ${t.assignee||'Non assegnata'} — <span style="font-weight:700;color:var(--red)">${days}g in ritardo</span></div>
        </div>`;
    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;
    document.getElementById('backupModal').classList.add('open');
}

    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    if (!items.length) return;
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--yellow)">Scade domani (${items.length})</div>`;
    items.forEach(({task: t, project: p}) => {
        html += `<div style="padding:12px 16px;background:var(--yellow-bg);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="openTaskFromPopup('${t.id}','${p.id}')">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(t.title)}</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${esc(p.name)} — ${t.assignee||'Non assegnata'}</div>

function showDueTodayTasks() {
    const projects = getProjects();
    const todayStr = today();
    let items = [];
    projects.forEach(p => {
        (p.tasks||[]).forEach(t => {

        });
    });
    if (!items.length) return;
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--orange)">Scadenze di oggi (${items.length})</div>`;

    document.getElementById('backupModal').classList.add('open');
}

function showNoDueTasks() {

    let items = [];
    projects.forEach(p => {

function openBackupModal() {
    const modal = document.getElementById('backupModalInner');
    const projects = getProjects();
    const totalTasks = projects.reduce((s,p)=>s+(p.tasks||[]).length, 0);
    const storageUsed = new Blob([JSON.stringify(projects)]).size;

    html += `<div class="backup-section">
        <button class="backup-btn" onclick="handleExport()">Esporta JSON</button>

    </div>`;

        <button class="backup-btn" onclick="document.getElementById('importFile').click()">Importa JSON</button>

    </div>`;
    html += `<div class="backup-section" style="border-top:2px solid var(--red);padding-top:16px;margin-top:16px">
        <button class="backup-btn" style="background:var(--red);color:#fff" onclick="if(confirm('ATTENZIONE: Cancellare TUTTI i dati? Progetti, task, team, risorse, tutto. Non recuperabile.')){localStorage.clear();location.reload();}">Reset completo</button>
        <div class="backup-info" style="color:var(--red)">Cancella tutti i dati locali e riparte da zero.</div>
    </div>`;
    html += `<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-secondary)">
        <div><strong>Progetti:</strong> ${projects.length}</div>
        <div><strong>Task totali:</strong> ${totalTasks}</div>

function closeBackupModal() {

function handleExport() {
    const data = {
        projects: getProjects(),
        team: getTeam(),
        exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `project-board-backup-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.projects) {
                saveProjects(data.projects);
                if (data.team) safeSetItem('pb_team', JSON.stringify(data.team));
                alert('Importazione completata!');
                goGlobal();
            } else {
                alert('File non valido.');
            }
        } catch(err) {
            alert('Errore nel parsing del file.');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ========== DYNAMIC COLORS ==========
function completionColor(pct) {
    // Red(0%) → Orange(25%) → Yellow(50%) → Green(100%) via HSL
    const hue = Math.round(pct * 1.2); // 0=red(0), 30=orange, 60=yellow, 120=green
    return `hsl(${hue}, 70%, 45%)`;
}

function completionColorSoft(pct) {
    const hue = Math.round(pct * 1.2);
    return `hsl(${hue}, 60%, 95%)`;
}

function projectHealthEmoji(p) {
    const tasks = p.tasks || [];
    if (tasks.length === 0) return '';
    const blocked = tasks.filter(t => t.status === 'blocked').length;
    const overdue = tasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0).length;
    const done = tasks.filter(t => t.status === 'done').length;
    const pct = Math.round(done / tasks.length * 100);
    if (blocked >= 3 || overdue >= 3) return '\u{1F525}'; // fire - critical
    if (blocked > 0 || overdue > 0) return '\u26A0\uFE0F'; // warning
    if (pct >= 80) return '\u{1F680}'; // rocket - on fire
    if (pct >= 50) return '\u2705'; // check - good
    return '\u{1F3AF}'; // target - in progress
}

// ========== UTILITIES ==========
function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Escape only — close modals/go back
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (document.getElementById('taskModal').classList.contains('open')) { closeTaskModal(); return; }
        if (document.getElementById('projectModal').classList.contains('open')) { closeProjectModal(); return; }
        if (document.getElementById('backupModal').classList.contains('open')) { closeBackupModal(); return; }
        if (document.getElementById('tutorialModal').classList.contains('open')) { closeTutorialModal(); return; }
        if (state.currentView === 'detail') { goGlobal(); return; }
    }
});
