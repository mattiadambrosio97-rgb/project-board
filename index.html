// ========== CALENDARIO GANTT LANCI ==========
function renderLaunchCalendar(allLaunches, editable) {
    if (allLaunches.length === 0) return '';

    var brandOrder = ['ADT', 'USR', 'GTF', 'ADM'];
    var brandHex = { ADT: '#DC2626', USR: '#CA8A04', GTF: '#38BDF8', ADM: '#7C3AED' };
    var brandBgHex = { ADT: '#FEF2F2', USR: '#FEFCE8', GTF: '#F0F9FF', ADM: '#F5F3FF' };
    var darkBrandBg = { ADT: '#1A0A0A', USR: '#1A1608', GTF: '#0A1420', ADM: '#120A1A' };

    // Date range
    var allDates = [];
    allLaunches.forEach(function(l) {
        if (l.startDate) allDates.push(l.startDate);
        if (l.endDate) allDates.push(l.endDate);
    });
    allDates.sort();

    var startD = new Date(allDates[0] + 'T00:00:00');
    var endD = new Date(allDates[allDates.length - 1] + 'T00:00:00');
    // Pad: start from Monday before, end at least 2 weeks after last date (+ to Sunday)
    var dayOff = startD.getDay() === 0 ? 6 : startD.getDay() - 1;
    startD.setDate(startD.getDate() - dayOff);
    endD.setDate(endD.getDate() + 14); // +2 settimane di visibilità extra
    var dayEnd = endD.getDay() === 0 ? 0 : 7 - endD.getDay();
    endD.setDate(endD.getDate() + dayEnd);

    var days = [];
    var d = new Date(startD);
    while (d <= endD) {
        days.push(d.toISOString().split('T')[0]);
        d.setDate(d.getDate() + 1);
    }

    var todayStr = today();
    var dayW = 38;
    var labelW = 54;
    var totalW = labelW + days.length * dayW;
    var isDark = document.body.classList.contains('dark');

    // Store for drag logic
    if (editable) {
        window._ganttDays = days;
        window._ganttDayW = dayW;
        window._ganttLabelW = labelW;
    }

    // Group by brand
    var grouped = {};
    allLaunches.forEach(function(l) {
        var b = l.brand || 'Altro';
        if (!grouped[b]) grouped[b] = [];
        grouped[b].push(l);
    });
    // Mostra TUTTI i brand sempre, anche se vuoti
    var brandKeys = brandOrder.slice();
    Object.keys(grouped).forEach(function(b) { if (brandKeys.indexOf(b) === -1) brandKeys.push(b); });
    brandKeys.forEach(function(b) {
        if (!grouped[b]) grouped[b] = [];
        grouped[b].sort(function(a, c) { return (a.startDate || '').localeCompare(c.startDate || ''); });
    });

    // Count total rows for today line height
    var totalRows = 0;
    brandKeys.forEach(function(b) { totalRows += grouped[b].length; });

    var rowH = 34;
    var headerH = 36;
    var brandGap = 6;
    var bodyH = totalRows * rowH + (brandKeys.length - 1) * brandGap;

    var html = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">';
    html += '<div style="position:relative;min-width:' + totalW + 'px">';

    // ---- HEADER: day numbers ----
    html += '<div style="display:flex;border-bottom:1px solid var(--border)">';
    html += '<div style="width:' + labelW + 'px;flex-shrink:0"></div>';
    var prevMonth = '';
    days.forEach(function(dayStr) {
        var dd = new Date(dayStr + 'T00:00:00');
        var dayNum = dd.getDate();
        var isT = dayStr === todayStr;
        var isWe = dd.getDay() === 0 || dd.getDay() === 6;
        var mon = dd.toLocaleDateString('it-IT', { month: 'short' }).toUpperCase();
        var showMon = mon !== prevMonth;
        if (showMon) prevMonth = mon;

        html += '<div style="width:' + dayW + 'px;flex-shrink:0;text-align:center;padding:4px 0;font-size:10px;line-height:1.2;';
        if (isT) html += 'font-weight:800;color:var(--accent);background:var(--accent-soft);';
        else if (isWe) html += 'color:var(--text-muted);opacity:0.5;';
        else html += 'color:var(--text-muted);';
        html += '">';
        if (showMon) html += '<div style="font-size:8px;font-weight:800;letter-spacing:0.5px;color:var(--text-secondary)">' + mon + '</div>';
        else html += '<div style="height:10px"></div>';
        html += dayNum;
        html += '</div>';
    });
    html += '</div>';

    // ---- BODY: bars ----
    html += '<div style="position:relative">';

    // Today vertical line
    var todayIdx = days.indexOf(todayStr);
    if (todayIdx >= 0) {
        var todayX = labelW + todayIdx * dayW + dayW / 2;
        html += '<div style="position:absolute;left:' + todayX + 'px;top:0;bottom:0;width:2px;background:var(--accent);opacity:0.4;z-index:0;pointer-events:none"></div>';
    }

    brandKeys.forEach(function(brand, bi) {
        var bColor = brandHex[brand] || '#78716C';
        var bBg = isDark ? (darkBrandBg[brand] || '#141414') : (brandBgHex[brand] || '#F5F5F4');
        var bLaunches = grouped[brand];

        // Packing: metti lanci non sovrapposti sulla stessa riga
        var rows = []; // array di array di launches
        bLaunches.forEach(function(l) {
            var si = days.indexOf(l.startDate); if (si < 0) si = 0;
            var ei = days.indexOf(l.endDate); if (ei < 0) ei = days.length - 1;
            var placed = false;
            for (var r = 0; r < rows.length; r++) {
                var lastInRow = rows[r][rows[r].length - 1];
                var lastEi = days.indexOf(lastInRow.endDate); if (lastEi < 0) lastEi = days.length - 1;
                if (si > lastEi + 1) { // +1 = almeno 1 giorno di gap
                    rows[r].push(l);
                    placed = true;
                    break;
                }
            }
            if (!placed) rows.push([l]);
        });

        // Se il brand non ha lanci, mostra una riga vuota
        if (rows.length === 0) rows.push([]);

        rows.forEach(function(rowLaunches, ri) {
            html += '<div class="gantt-row" data-brand="' + esc(brand) + '" style="display:flex;height:' + rowH + 'px;align-items:center;position:relative">';

            // Brand label solo sulla prima riga
            if (ri === 0) {
                html += '<div style="width:' + labelW + 'px;flex-shrink:0;font-size:11px;font-weight:800;color:' + bColor + ';padding:0 6px;text-align:right;white-space:nowrap;opacity:' + (rowLaunches.length === 0 ? '0.4' : '1') + '">' + esc(brand) + '</div>';
            } else {
                html += '<div style="width:' + labelW + 'px;flex-shrink:0"></div>';
            }

            // Bar area — contiene tutte le barre di questa riga
            html += '<div style="flex:1;position:relative;height:100%">';

            // Weekend shading (una volta per riga)
            if (ri === 0) {
                days.forEach(function(dayStr, di) {
                    var wd = new Date(dayStr + 'T00:00:00').getDay();
                    if (wd === 0 || wd === 6) {
                        html += '<div style="position:absolute;left:' + (di * dayW) + 'px;top:0;width:' + dayW + 'px;height:100%;background:var(--bg);opacity:0.5;pointer-events:none"></div>';
                    }
                });
            }

            // Render each bar in this row
            rowLaunches.forEach(function(l) {
                var si = days.indexOf(l.startDate); if (si < 0) si = 0;
                var ei = days.indexOf(l.endDate); if (ei < 0) ei = days.length - 1;

                var barL = si * dayW + 2;
                var barW = (ei - si + 1) * dayW - 4;

                var st = getLaunchStatus(l);
                var isLive = st === 'live';
                var borderStyle = isLive ? '2px solid ' + bColor : '1px solid ' + bColor + '80';
                var cursor = editable ? 'cursor:grab;' : 'pointer-events:none;';
                var cleanName = l.name;

                html += '<div class="gantt-bar" data-launch-id="' + l.id + '" style="position:absolute;left:' + barL + 'px;width:' + barW + 'px;top:5px;bottom:5px;background:' + bBg + ';border:' + borderStyle + ';border-radius:6px;display:flex;align-items:center;overflow:hidden;z-index:1;' + cursor + 'user-select:none;touch-action:none">';
                if (editable) html += '<div class="gantt-handle gantt-handle-l" style="position:absolute;left:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;border-radius:6px 0 0 6px" data-side="left"></div>';
                html += '<div style="flex:1;display:flex;align-items:center;gap:4px;padding:0 10px;overflow:hidden;min-width:0">';
                html += '<span style="font-size:11px;font-weight:700;color:' + bColor + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">' + esc(cleanName) + '</span>';
                if (isLive) html += '<span style="font-size:8px;font-weight:800;color:#fff;background:' + bColor + ';border-radius:3px;padding:1px 5px;flex-shrink:0">LIVE</span>';
                html += '</div>';
                if (editable) html += '<div class="gantt-handle gantt-handle-r" style="position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;border-radius:0 6px 6px 0" data-side="right"></div>';
                html += '</div>';
            });

            html += '</div>'; // close bar area
            html += '</div>'; // close row
        });

        // Brand separator
        if (bi < brandKeys.length - 1) {
            html += '<div style="height:1px;background:var(--border-light);margin:' + (brandGap / 2) + 'px ' + labelW + 'px"></div>';
        }
    });

    html += '</div>'; // close body
    html += '</div></div>'; // close containers
    return html;
}

// ========== GANTT DRAG & RESIZE ==========
(function() {
    var _drag = null;

    function findBrandAtY(y) {
        var rows = document.querySelectorAll('.gantt-row[data-brand]');
        var best = null, bestDist = 99999;
        rows.forEach(function(row) {
            var rect = row.getBoundingClientRect();
            var mid = rect.top + rect.height / 2;
            var dist = Math.abs(y - mid);
            if (dist < bestDist) { bestDist = dist; best = row.getAttribute('data-brand'); }
        });
        return best;
    }

    function ganttPointerDown(e) {
        var handle = e.target.closest('.gantt-handle');
        var bar = e.target.closest('.gantt-bar');
        if (!bar) return;
        var launchId = bar.getAttribute('data-launch-id');
        if (!launchId) return;

        var mode = 'move';
        if (handle) {
            mode = handle.getAttribute('data-side') === 'left' ? 'left' : 'right';
        }

        var dayW = window._ganttDayW || 38;
        var days = window._ganttDays || [];
        var launches = getLaunches();
        var launch = launches.find(function(l) { return l.id === launchId; });
        if (!launch) return;

        var si = days.indexOf(launch.startDate);
        var ei = days.indexOf(launch.endDate);
        if (si < 0) si = 0;
        if (ei < 0) ei = days.length - 1;

        e.preventDefault();
        bar.setPointerCapture(e.pointerId);
        bar.style.opacity = '0.85';
        bar.style.zIndex = '10';
        if (mode === 'move') bar.style.cursor = 'grabbing';

        _drag = {
            bar: bar,
            launchId: launchId,
            mode: mode,
            startX: e.clientX,
            startY: e.clientY,
            origLeft: parseFloat(bar.style.left),
            origWidth: parseFloat(bar.style.width),
            startSi: si,
            startEi: ei,
            startBrand: launch.brand || '',
            dayW: dayW,
            days: days,
            _newBrand: null
        };
    }

    function ganttPointerMove(e) {
        if (!_drag) return;
        var dx = e.clientX - _drag.startX;
        var dayShift = Math.round(dx / _drag.dayW);

        if (_drag.mode === 'move') {
            var newSi = _drag.startSi + dayShift;
            var newEi = _drag.startEi + dayShift;
            if (newSi < 0) { newEi -= newSi; newSi = 0; }
            if (newEi >= _drag.days.length) { newSi -= (newEi - _drag.days.length + 1); newEi = _drag.days.length - 1; }
            _drag.bar.style.left = (newSi * _drag.dayW + 2) + 'px';
            _drag._newSi = newSi;
            _drag._newEi = newEi;

            // Vertical: check brand under pointer
            var brandUnder = findBrandAtY(e.clientY);
            _drag._newBrand = brandUnder;
            // Visual feedback: dim if changing brand
            if (brandUnder && brandUnder !== _drag.startBrand) {
                _drag.bar.style.outline = '2px dashed rgba(0,0,0,0.3)';
                _drag.bar.style.outlineOffset = '2px';
            } else {
                _drag.bar.style.outline = '';
                _drag.bar.style.outlineOffset = '';
            }
        } else if (_drag.mode === 'left') {
            var newSi = _drag.startSi + dayShift;
            if (newSi < 0) newSi = 0;
            if (newSi > _drag.startEi) newSi = _drag.startEi;
            _drag.bar.style.left = (newSi * _drag.dayW + 2) + 'px';
            _drag.bar.style.width = ((_drag.startEi - newSi + 1) * _drag.dayW - 4) + 'px';
            _drag._newSi = newSi;
            _drag._newEi = _drag.startEi;
        } else if (_drag.mode === 'right') {
            var newEi = _drag.startEi + dayShift;
            if (newEi >= _drag.days.length) newEi = _drag.days.length - 1;
            if (newEi < _drag.startSi) newEi = _drag.startSi;
            _drag.bar.style.width = ((newEi - _drag.startSi + 1) * _drag.dayW - 4) + 'px';
            _drag._newSi = _drag.startSi;
            _drag._newEi = newEi;
        }
    }

    function ganttPointerUp(e) {
        if (!_drag) return;
        _drag.bar.style.opacity = '';
        _drag.bar.style.zIndex = '';
        _drag.bar.style.cursor = '';
        _drag.bar.style.outline = '';
        _drag.bar.style.outlineOffset = '';

        var newSi = _drag._newSi;
        var newEi = _drag._newEi;
        var newBrand = _drag._newBrand;
        var datesChanged = (newSi !== undefined && newEi !== undefined) && (newSi !== _drag.startSi || newEi !== _drag.startEi);
        var brandChanged = newBrand && newBrand !== _drag.startBrand;

        if (datesChanged || brandChanged) {
            var launches = getLaunches();
            var idx = launches.findIndex(function(l) { return l.id === _drag.launchId; });
            if (idx >= 0) {
                if (datesChanged && _drag.days[newSi] && _drag.days[newEi]) {
                    launches[idx].startDate = _drag.days[newSi];
                    launches[idx].endDate = _drag.days[newEi];
                }
                if (brandChanged) {
                    launches[idx].brand = newBrand;
                }
                saveLaunches(launches);
                render();
            }
        } else if (_drag.mode === 'move' && Math.abs(e.clientX - _drag.startX) < 5 && Math.abs(e.clientY - _drag.startY) < 5) {
            openLaunchModal(_drag.launchId);
        }

        _drag = null;
    }

    document.addEventListener('pointerdown', function(e) {
        if (CEO_MODE || _ceoPreview) return; // CEO: no drag/resize
        if (e.target.closest('.gantt-bar') || e.target.closest('.gantt-handle')) ganttPointerDown(e);
    });
    document.addEventListener('pointermove', ganttPointerMove);
    document.addEventListener('pointerup', ganttPointerUp);
})();

// ========== CEO TASK ACTIONS (modale + push to GitHub) ==========
function ceoOpenTask(taskId, projectId) {
    var projects = getProjects();
    var p = projects.find(function(pr) { return pr.id === projectId; });
    if (!p) return;
    var t = (p.tasks || []).find(function(tk) { return tk.id === taskId; });
    if (!t) return;

    var isBlocked = t.status === 'blocked';
    var isOverdue = t.dueDate && t.dueDate < today();
    var isDueToday = t.dueDate && t.dueDate === today();
    var hasCeoNote = t.ceoNote && t.ceoNote.trim();
    var statusColor = isBlocked ? 'var(--red)' : t.status === 'ceo_done' ? 'var(--green)' : isOverdue ? 'var(--red)' : isDueToday ? 'var(--orange)' : 'var(--blue)';
    var statusLabel = isBlocked ? 'BLOCCATA' : t.status === 'ceo_done' ? 'COMPLETATA (in attesa conferma COO)' : isOverdue ? 'IN RITARDO' : isDueToday ? 'SCADE OGGI' : t.status === 'in_progress' ? 'IN CORSO' : 'DA FARE';

    var modal = document.getElementById('taskModalInner');
    var html = '<div class="modal-close-bar"><button class="modal-close-x" onclick="closeTaskModal()" aria-label="Chiudi">&times;</button></div>';

    // Status badge
    html += '<div style="display:inline-block;padding:4px 12px;border-radius:6px;background:' + statusColor + ';color:#fff;font-size:11px;font-weight:800;margin-bottom:12px">' + statusLabel + '</div>';

    // Titolo
    html += '<div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px">' + esc(t.title) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">' + esc(p.name);
    if (t.dueDate) {
        var dLeft = daysUntil(t.dueDate);
        var dateF = new Date(t.dueDate + 'T00:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'long'});
        html += ' &middot; Scadenza: <strong>' + dateF + '</strong>';
        if (dLeft !== null && dLeft >= 0) html += ' (' + dLeft + ' giorni)';
    }
    html += '</div>';

    // Messaggio COO (ceoNote)
    if (hasCeoNote) {
        html += '<div style="padding:14px 16px;background:var(--accent-soft, #FFF1ED);border:1px solid var(--accent);border-radius:10px;margin-bottom:16px">';
        html += '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase">Istruzioni dal team operativo</div>';
        html += '<div style="font-size:14px;color:var(--text);line-height:1.6">' + esc(t.ceoNote) + '</div>';
        html += '</div>';
    } else if (t.note) {
        html += '<div style="padding:12px 14px;background:var(--bg);border-radius:8px;margin-bottom:16px;font-size:13px;color:var(--text-secondary);line-height:1.5">' + esc(t.note) + '</div>';
    }

    // Thread conversazione CEO ↔ COO (cronologico)
    var allMsgs = [];
    (t.ceoUpdates || []).forEach(function(u) { allMsgs.push({ from: 'ceo', note: u.note, type: u.type, at: u.at }); });
    (t.cooResponses || []).forEach(function(r) { allMsgs.push({ from: 'coo', note: r.note, type: 'response', at: r.at }); });
    allMsgs.sort(function(a, b) { return new Date(a.at) - new Date(b.at); });
    if (allMsgs.length > 0) {
        html += '<div style="margin-bottom:16px">';
        html += '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px">Conversazione</div>';
        allMsgs.forEach(function(msg) {
            var d = new Date(msg.at);
            var dateStr = d.toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            var isCeo = msg.from === 'ceo';
            var typeLabel = msg.type === 'complete' ? 'Completata' : msg.type === 'update' ? 'Aggiornamento' : 'Risposta';
            var bgCol = isCeo ? 'var(--bg)' : 'var(--accent-soft,#FFF1ED)';
            var nameCol = isCeo ? 'var(--blue)' : 'var(--accent)';
            var name = isCeo ? 'Tu' : 'Mattia (COO)';
            html += '<div style="padding:8px 12px;background:' + bgCol + ';border-radius:8px;margin-bottom:4px;font-size:12px">';
            html += '<span style="font-weight:700;color:' + nameCol + '">' + name + '</span>';
            html += ' <span style="font-size:10px;font-weight:600;color:var(--text-muted)">' + typeLabel + ' &middot; ' + dateStr + '</span>';
            if (msg.note) html += '<div style="color:var(--text-secondary);margin-top:4px">' + esc(msg.note) + '</div>';
            html += '</div>';
        });
        html += '</div>';
    }

    // Area input nota
    html += '<div style="margin-bottom:16px">';
    html += '<textarea id="ceoTaskNote" class="modal-textarea" rows="3" placeholder="Scrivi una nota, un aggiornamento, o il motivo per cui non hai potuto completarla..." style="font-size:16px"></textarea>';
    html += '</div>';

    // Bottoni azione
    if (t.status !== 'ceo_done' && t.status !== 'done') {
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
        html += '<button onclick="ceoTaskAction(\'' + taskId + '\',\'' + projectId + '\',\'complete\')" style="flex:1;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);min-width:120px">Completa</button>';
        html += '<button onclick="ceoTaskAction(\'' + taskId + '\',\'' + projectId + '\',\'update\')" style="flex:1;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);min-width:120px">Aggiorna il COO</button>';
        html += '</div>';
    } else if (t.status === 'ceo_done') {
        html += '<div style="padding:12px;background:var(--green-bg);border:1px solid var(--green);border-radius:10px;text-align:center;font-size:14px;font-weight:600;color:var(--green)">In attesa di conferma dal COO</div>';
    }

    modal.innerHTML = html;
    document.getElementById('taskModal').classList.add('open');
}

function ceoTaskAction(taskId, projectId, actionType) {
    var noteText = (document.getElementById('ceoTaskNote') || {}).value || '';
    if (actionType === 'update' && !noteText.trim()) {
        alert('Scrivi una nota per aggiornare il COO.');
        return;
    }

    // Update _ceoActions
    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {} };
    if (!_ceoActions.taskActions[taskId]) _ceoActions.taskActions[taskId] = { status: '', updates: [] };
    var ta = _ceoActions.taskActions[taskId];
    ta.updates.push({
        type: actionType,
        note: noteText.trim(),
        at: new Date().toISOString()
    });
    if (actionType === 'complete') {
        ta.status = 'complete';
    } else {
        ta.status = 'update';
    }

    // Also update local _ceoData for immediate rendering
    if (_ceoData) {
        var p = _ceoData.projects.find(function(pr) { return pr.id === projectId; });
        if (p) {
            var t = (p.tasks || []).find(function(tk) { return tk.id === taskId; });
            if (t) {
                t.ceoUpdates = ta.updates;
                if (actionType === 'complete') t.status = 'ceo_done';
            }
        }
    }

    // Push only ceo.json
    ceoPushActions(function(ok) {
        if (ok) {
            closeTaskModal();
            renderCEOView();
        } else {
            alert('Errore nel salvataggio. Riprova.');
        }
    });
}

function ceoPushActions(callback, retryCount) {
    var token = safeGetItem('pb_gh_token_ceo');
    if (!token) {
        _showCeoOnboarding();
        callback(false);
        return;
    }
    retryCount = retryCount || 0;

    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {}, projectActions: {} };
    if (!_ceoActions.projectActions) _ceoActions.projectActions = {};
    _ceoActions.lastUpdate = new Date().toISOString();

    var content = btoa(unescape(encodeURIComponent(JSON.stringify(_ceoActions, null, 2))));

    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(existing) {
        var body = { message: 'CEO actions ' + new Date().toISOString().split('T')[0], content: content };
        if (existing && existing.sha) body.sha = existing.sha;

        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    }).then(function(r) {
        if (r.ok) {
            callback(true);
        } else {
            return r.json().then(function(err) {
                if (err.message && err.message.indexOf('Bad credentials') !== -1) {
                    safeSetItem('pb_gh_token_ceo', '');
                    _showCeoOnboarding();
                    callback(false);
                } else if (err.message && err.message.indexOf('does not match') !== -1 && retryCount < 3) {
                    setTimeout(function() { ceoPushActions(callback, retryCount + 1); }, 1000);
                } else {
                    callback(false);
                }
            });
        }
    }).catch(function() { callback(false); });
}

        '<button onclick="_ceoOnboardSubmit()" style="margin-top:16px;width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background 0.2s" onmouseenter="this.style.background=\'var(--accent-strong)\'" onmouseleave="this.style.background=\'var(--accent)\'">Continua</button>' +

    // Allow Enter key
    setTimeout(function() {

function _ceoOnboardSubmit() {
    var inp = document.getElementById('ceoTokenInput');
    var errEl = document.getElementById('ceoOnboardError');
    if (!inp) return;
    var token = inp.value.trim();
    if (!token) {
        if (errEl) { errEl.textContent = 'Inserisci il codice per continuare.'; errEl.style.display = 'block'; }
        return;
    }
    // Validate token with a test API call
    if (errEl) { errEl.textContent = 'Verifica in corso...'; errEl.style.display = 'block'; errEl.style.color = 'var(--text-muted)'; }
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function(r) {
        if (r.ok || r.status === 404) {
            // 404 is fine — file may not exist yet
            safeSetItem('pb_gh_token_ceo', token);
            // Reload CEO view
            _ceoData = null;
            _ceoActions = null;
            render();
        } else if (r.status === 401) {
            if (errEl) { errEl.textContent = 'Codice non valido. Controlla e riprova.'; errEl.style.display = 'block'; errEl.style.color = 'var(--red)'; }
        } else {
            if (errEl) { errEl.textContent = 'Errore di connessione. Riprova.'; errEl.style.display = 'block'; errEl.style.color = 'var(--red)'; }
        }
    }).catch(function() {
        if (errEl) { errEl.textContent = 'Errore di rete. Controlla la connessione.'; errEl.style.display = 'block'; errEl.style.color = 'var(--red)'; }
    });
}

function daysUntil(dateStr) {
    if (!dateStr) return null;
    var diff = Math.ceil((new Date(dateStr) - new Date(today())) / 86400000);
    return diff;
}

    // ========== FEED CEO — sezioni separate per chiarezza ==========

                var lastCooResp = (t.cooResponses && t.cooResponses.length > 0) ? t.cooResponses[t.cooResponses.length - 1] : null;
                var cooHasReplied = lastCooResp && lastCeoUpd && new Date(lastCooResp.at) > new Date(lastCeoUpd.at);
                var awaitingCooReply = lastCeoUpd && lastCeoUpd.type === 'update' && (!lastCooResp || new Date(lastCooResp.at) > new Date(lastCooResp.at));
                _ceoTaskItems.push({ task: t, projectName: p.name, projectId: p.id, cooHasReplied: cooHasReplied, awaitingCooReply: awaitingCooReply });
            }

    // Categorizza risorse

    var secCeoDone = _ceoTaskItems.filter(function(i) { return i.task.status === 'ceo_done'; });

    // Ordina task attive: blocked/scadute prima, poi per scadenza
    function _ceoSortByUrgency(a, b) {

        var aOvr = (ta.dueDate && ta.dueDate < todayStr) ? 0 : 1, bOvr = (tb.dueDate && tb.dueDate < todayStr) ? 0 : 1;

            }
            html += '</div>';
        });
        html += '</div>';

    // Completate — solo conteggio, rassicurante
    if (done > 0) {

        html += '<span style="font-size:16px">&#9989;</span>';
        html += '<span style="font-size:14px;font-weight:600;color:var(--green)">' + done + ' task completate su ' + total + '</span>';
        html += '</div>';
    }

    // ========== CONVERSAZIONE PROGETTO (CEO ↔ COO) ==========
    var _pca = (_ceoActions && _ceoActions.projectActions && _ceoActions.projectActions[pid]) ? _ceoActions.projectActions[pid] : null;
    var pNotes = (_pca && _pca.notes) ? _pca.notes : [];
    var pCooResps = p.cooProjectResponses || [];
    // Unisci e ordina per data

            html += '<div style="font-size:14px;color:var(--text);line-height:1.5;white-space:pre-wrap">' + esc(msg.note) + '</div>';
            html += '</div></div>';
        });
        html += '</div>';
    } else {
        html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;font-style:italic">Nessuna nota ancora. Scrivi al COO per discutere di questo progetto.</div>';

// CEO invia nota su progetto
function ceoSendProjectNote(pid) {
    var input = document.getElementById('ceoProjectNote_' + pid);
    if (!input) return;
    var note = input.value.trim();
    if (!note) { input.focus(); return; }
    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {} };
    if (!_ceoActions.projectActions) _ceoActions.projectActions = {};
    if (!_ceoActions.projectActions[pid]) _ceoActions.projectActions[pid] = { notes: [] };
    _ceoActions.projectActions[pid].notes.push({ note: note, at: new Date().toISOString() });
    input.value = '';
    var btn = input.nextElementSibling;
    if (btn) { btn.textContent = 'Invio...'; btn.disabled = true; }
    ceoPushActions(function(ok) {
        if (ok) {
            _showToast('Nota inviata a Mattia!');
            renderCEOView();
        } else {
            _showToast('Errore invio nota', true);
            if (btn) { btn.textContent = 'Invia'; btn.disabled = false; }
        }
    });
}

function publishForCEO(retryCount) {
    var token = getGHToken();
    if (!token) {
        _showCooOnboarding(function() { publishForCEO(); });
        return;
    }
    retryCount = retryCount || 0;

    var data = {
        publishedAt: new Date().toISOString(),
        projects: getProjects(),
        team: getTeam(),
        launches: getLaunches(),
        ceoLinks: getCeoLinks(),
        resources: getResources()
    };
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

    _showToast('Pubblicazione in corso...');

    // Get current file SHA (needed for update)
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_DATA_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + getGHToken() }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(existing) {
        var body = {
            message: 'CEO data update ' + new Date().toISOString().split('T')[0],
            content: content
        };
        if (existing && existing.sha) body.sha = existing.sha;

        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_DATA_FILE, {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + getGHToken(),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
    }).then(function(r) {
        if (r.ok) {
            window._lastCooPublish = Date.now();
            _updateSyncIndicator();
            _showToast('Pubblicato per il CEO!');
        } else {
            return r.json().then(function(err) {
                if (err.message && err.message.indexOf('Bad credentials') !== -1) {
                    setGHToken('');
                    _showCooOnboarding(function() { publishForCEO(); });
                } else if (err.message && err.message.indexOf('does not match') !== -1 && retryCount < 3) {
                    // SHA conflict — retry with fresh SHA
                    _showToast('Conflitto SHA, riprovo...');
                    setTimeout(function() { publishForCEO(retryCount + 1); }, 1000);
                } else {
                    _showToast('Errore: ' + (err.message || 'sconosciuto'), true);
                }
            });
        }
    }).catch(function(e) { _showToast('Errore di rete: ' + e.message, true); });
}

var _ceoActions = null;

function _applyCeoActionsToData() {
    if (!_ceoData || !_ceoActions) return;
    // Apply task actions from ceo.json onto _ceoData for rendering
    if (_ceoActions.taskActions && _ceoData.projects) {
        _ceoData.projects.forEach(function(p) {
            (p.tasks || []).forEach(function(t) {
                var ta = _ceoActions.taskActions[t.id];
                if (ta) {
                    t.ceoUpdates = ta.updates || [];
                    if (ta.status === 'complete') {
                        // Controlla se il COO ha risposto DOPO l'ultima azione del CEO
                        var lastCeoAct = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1] : null;
                        var lastCooResp = (t.cooResponses && t.cooResponses.length > 0) ? t.cooResponses[t.cooResponses.length - 1] : null;
                        var cooRespondedAfter = lastCooResp && lastCeoAct && new Date(lastCooResp.at) > new Date(lastCeoAct.at);
                        if (cooRespondedAfter) {
                            // COO ha gia' gestito — rispetta lo status in data.json
                            // (done = confermata, todo = rimessa in lavorazione)
                        } else {
                            // COO non ha ancora gestito — mostra "in attesa di conferma"
                            t.status = 'ceo_done';
                        }
                    }
                }
            });
        });
    }
}

function _ghFetchJSON(file, token) {
    var url = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + file + '?t=' + Date.now();
    var opts = { cache: 'no-store', headers: {} };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, opts).then(function(r) {
        if (!r.ok) return null;
        return r.json();
    }).then(function(fileData) {
        if (!fileData || !fileData.content) return null;
        return JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
    });
}

function loadCEOData(callback, forceRefresh) {
    if (_ceoData && !forceRefresh) { callback(_ceoData); return; }
    var token = safeGetItem('pb_gh_token_ceo') || '';

    var dataPromise = _ghFetchJSON(GH_DATA_FILE, token).then(function(d) {
        if (!d) throw new Error('Nessun dato pubblicato');
        return d;
    });
    var ceoPromise = _ghFetchJSON(GH_CEO_FILE, token).then(function(d) {
        return d || { lastUpdate: '', taskActions: {}, resourceActions: {} };
    });

    Promise.all([dataPromise, ceoPromise]).then(function(results) {
        _ceoData = results[0];
        _ceoActions = results[1];
        _applyCeoActionsToData();
        window._lastCeoSync = Date.now();
        callback(_ceoData);
    }).catch(function(err) {
        document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:16px">Nessun dato pubblicato ancora.<br>Il COO deve prima pubblicare i dati.<br><small style="color:var(--red)">' + err.message + '</small></div>';
    });
}

// COO: fetch ceo.json from GitHub to display Alberto's responses
function _cooFetchCeoActions() {
    var ghToken = getGHToken();
    if (!ghToken) return;
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + ghToken }, cache: 'no-store'
    }).then(function(r) {
        if (!r.ok) return null;
        return r.json();
    }).then(function(fileData) {
        if (!fileData || !fileData.content) return;
        var decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
        var ceoActs = JSON.parse(decoded);
        // Update resource badges in DOM
        var ress = getResources();
        ress.forEach(function(r) {
            var ra = (ceoActs.resourceActions && ceoActs.resourceActions[r.id]) || {};
            var badgeEl = document.getElementById('cooResBadge_' + r.id);
            if (badgeEl) {
                if (ra.read) {
                    badgeEl.style.color = 'var(--green)';
                    badgeEl.style.background = 'var(--green-bg,#F0FDF4)';
                    badgeEl.textContent = 'LETTO';
                } else {
                    badgeEl.style.color = 'var(--orange)';
                    badgeEl.style.background = 'var(--orange-bg,#FFF7ED)';
                    badgeEl.textContent = 'NON LETTO';
                }
            }
            // Update badges in BOTH locations (top panoramica + bottom pannello CEO)
            ['cooResFeedback_', 'cooResTopFeedback_'].forEach(function(prefix) {
                var feedEl = document.getElementById(prefix + r.id);
                var feedback = ra.feedback || [];
                if (feedEl && feedback.length > 0) {
                    var fHtml = '<div style="padding:4px 10px 8px;border-top:1px solid var(--border-light)">';
                    feedback.slice(-2).forEach(function(fb) {
                        var fDate = new Date(fb.at).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                        fHtml += '<div style="font-size:11px;padding:4px 0"><span style="font-weight:700;color:var(--blue)">Alberto:</span> <span style="color:var(--text-secondary)">' + esc(fb.note) + '</span> <span style="color:var(--text-muted);font-size:10px">' + fDate + '</span></div>';
                    });
                    fHtml += '</div>';
                    feedEl.innerHTML = fHtml;
                }
            });
            // Top badge too
            var topBadgeEl = document.getElementById('cooResTopBadge_' + r.id);
            if (topBadgeEl) {
                if (ra.read) {
                    topBadgeEl.style.color = 'var(--green)';
                    topBadgeEl.style.background = 'var(--green-bg,#F0FDF4)';
                    topBadgeEl.textContent = 'LETTO';
                } else {
                    topBadgeEl.style.color = 'var(--orange)';
                    topBadgeEl.style.background = 'var(--orange-bg,#FFF7ED)';
                    topBadgeEl.textContent = 'NON LETTO';
                }
            }
            // Msg badge next to both badge elements
            var feedback = ra.feedback || [];
            [badgeEl, topBadgeEl].forEach(function(bEl) {
                if (bEl && feedback.length > 0 && !bEl.nextSibling?.classList?.contains('msg-count')) {
                    var msgBadge = document.createElement('span');
                    msgBadge.className = 'msg-count';
                    msgBadge.style.cssText = 'font-size:9px;font-weight:800;color:var(--blue);background:var(--blue-bg,#EFF6FF);border-radius:4px;padding:1px 5px;margin-left:4px';
                    msgBadge.textContent = feedback.length + ' msg';
                    bEl.parentNode.insertBefore(msgBadge, bEl.nextSibling);
                }
            });
        });
        // Aggiorna badge sommario sul rettangolo Bacheca
        var summaryEl = document.getElementById('cooResBadgeSummary');
        if (summaryEl) {
            var readCount = 0;
            var msgCount = 0;
            var taskDoneCount = 0;
            ress.forEach(function(r) {
                var ra = (ceoActs.resourceActions && ceoActs.resourceActions[r.id]) || {};
                if (ra.read) readCount++;
                if (ra.feedback) msgCount += ra.feedback.length;
            });
            if (ceoActs.taskActions) {
                Object.keys(ceoActs.taskActions).forEach(function(tid) {
                    var ta = ceoActs.taskActions[tid];
                    if (ta.updates && ta.updates.length > 0) taskDoneCount += ta.updates.length;
                });
            }
            var parts = [];
            if (msgCount > 0) parts.push(msgCount + ' rispost' + (msgCount === 1 ? 'a' : 'e'));
            if (readCount > 0) parts.push(readCount + '/' + ress.length + ' lette');
            if (taskDoneCount > 0) parts.push(taskDoneCount + ' aggiornament' + (taskDoneCount === 1 ? 'o' : 'i') + ' task');
            if (parts.length > 0) {
                summaryEl.innerHTML = '<span style="color:var(--blue);font-weight:700">' + parts.join(' &middot; ') + '</span>';
            }
        }

        // Task completate da CEO → status 'da_verificare' (COO conferma poi)
        // Task con update da CEO → ceoHasUpdate flag
        if (ceoActs.taskActions) {
            var projects = getProjects();
            var needSave = false;
            projects.forEach(function(p) {
                (p.tasks || []).forEach(function(t) {
                    var ta = ceoActs.taskActions[t.id];
                    if (!ta) return;
                    // Skip se il COO ha già gestito questa azione (confermata o rifiutata)
                    var _latestCeoAt = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1].at : null;
                    if (_isCooAcked(t.id, _latestCeoAt)) return;
                    // Completate → da_verificare
                    if (ta.status === 'complete' && t.status !== 'done' && t.status !== 'da_verificare') {
                        t.status = 'da_verificare';
                        t.ceoUpdates = ta.updates || [];
                        t.ceoCompletedAt = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1].at : new Date().toISOString();
                        needSave = true;
                    }
                    // Aggiornamenti → ceoHasUpdate
                    if (ta.updates && ta.updates.length > 0) {
                        var lastCeoUpdate = ta.updates[ta.updates.length - 1];
                        var lastCooResponse = (t.cooResponses && t.cooResponses.length > 0) ? t.cooResponses[t.cooResponses.length - 1] : null;
                        var ceoIsNewer = !lastCooResponse || new Date(lastCeoUpdate.at) > new Date(lastCooResponse.at);
                        if (ceoIsNewer && lastCeoUpdate.type === 'update' && !t.ceoHasUpdate) {
                            t.ceoHasUpdate = true;
                            t.ceoUpdates = ta.updates;
                            needSave = true;
                        }
                    }
                });
            });
            if (needSave) { saveProjects(projects); render(); }
        }

        // Note progetto da CEO → flag ceoHasProjectNote
        if (ceoActs.projectActions) {
            var projects2 = getProjects();
            var needSave2 = false;
            projects2.forEach(function(p) {
                var pa = ceoActs.projectActions[p.id];
                if (!pa || !pa.notes || pa.notes.length === 0) return;
                var lastCeoNote = pa.notes[pa.notes.length - 1];
                var lastCooResp = (p.cooProjectResponses && p.cooProjectResponses.length > 0) ? p.cooProjectResponses[p.cooProjectResponses.length - 1] : null;
                var ceoIsNewer = !lastCooResp || new Date(lastCeoNote.at) > new Date(lastCooResp.at);
                if (ceoIsNewer && !p.ceoHasProjectNote) {
                    p.ceoHasProjectNote = true;
                    p.ceoProjectNotes = pa.notes;
                    needSave2 = true;
                }
            });
            if (needSave2) { saveProjects(projects2); render(); }
        }
    }).catch(function() { /* silent fail — badges stay as '...' */ });
}

// ========== RADAR PM (rule-based) ==========
function generateRadarPM() {
    const projects = getProjects();
    const allTasks = projects.flatMap(p => (p.tasks||[]).map(t => ({...t, projectName: p.name, projectId: p.id})));
    const todayStr = today();
    const alerts = [];

    // a) Task scadute non completate
    const overdue = allTasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0);
    if (overdue.length > 0) {
        const details = overdue.slice(0, 5).map(t => {
            const days = Math.abs(daysDiff(t.dueDate));
            return `${esc(t.title)} <span class="radar-detail">(${esc(t.projectName)}, ${t.assignee ? 'assegnata a ' + esc(t.assignee) : 'non assegnata'}, scaduta da ${days} giorni)</span>`;
        }).join('<br>');
        const extra = overdue.length > 5 ? `<br><span class="radar-detail">...e altre ${overdue.length - 5}</span>` : '';
        alerts.push(`\u26A0\uFE0F <strong>${overdue.length} task scadute</strong>:<br>${details}${extra}`);
    }

    // b) Task in corso da troppo tempo (7+ giorni senza attivita nel log)
    const stale = allTasks.filter(t => {
        if (t.status !== 'in_progress') return false;
        const log = t.activityLog || [];
        if (log.length === 0) {
            // No log at all — check creation or just flag
            return true;
        }
        const lastEntry = log.reduce((latest, e) => e.date > latest ? e.date : latest, '');
        return lastEntry && daysDiff(lastEntry) < -7;
    });
    if (stale.length > 0) {
        const details = stale.slice(0, 5).map(t => {
            const log = t.activityLog || [];
            const lastDate = log.length > 0 ? log.reduce((l, e) => e.date > l ? e.date : l, '') : '';
            const daysAgo = lastDate ? Math.abs(daysDiff(lastDate)) : '?';
            return `${esc(t.title)} <span class="radar-detail">(${t.assignee ? 'assegnata a ' + esc(t.assignee) : 'non assegnata'}, ferma da ${daysAgo} giorni)</span>`;
        }).join('<br>');
        alerts.push(`\u23F0 <strong>${stale.length} task ferme da 7+ giorni</strong>:<br>${details}`);
    }

    // c) Task bloccate
    const blocked = allTasks.filter(t => t.status === 'blocked');
    if (blocked.length > 0) {
        const details = blocked.slice(0, 5).map(t =>
            `${esc(t.title)} <span class="radar-detail">(${esc(t.projectName)}, ${t.assignee ? 'assegnata a ' + esc(t.assignee) : 'non assegnata'})</span>`
        ).join('<br>');
        alerts.push(`\uD83D\uDD34 <strong>${blocked.length} task bloccate</strong>:<br>${details}`);
    }

    // d) Check scaduti
    const checksOverdue = allTasks.filter(t => t.status !== 'done' && t.nextCheck && t.nextCheck < todayStr);
    if (checksOverdue.length > 0) {
        const details = checksOverdue.slice(0, 5).map(t => {
            const checkDate = new Date(t.nextCheck).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'});
            return `${esc(t.title)} <span class="radar-detail">(dovevi chiedere${t.assignee ? ' a ' + esc(t.assignee) : ''} il ${checkDate})</span>`;
        }).join('<br>');
        alerts.push(`\uD83D\uDCCB <strong>${checksOverdue.length} check da fare</strong>:<br>${details}`);
    }

    // e) Squilibrio carico
    const activeTasks = allTasks.filter(t => t.status !== 'done' && t.assignee);
    const byPerson = {};
    activeTasks.forEach(t => { byPerson[t.assignee] = (byPerson[t.assignee] || 0) + 1; });
    const personCounts = Object.entries(byPerson);
    if (personCounts.length >= 2) {
        const maxP = personCounts.reduce((a, b) => a[1] > b[1] ? a : b);
        const minP = personCounts.reduce((a, b) => a[1] < b[1] ? a : b);
        if (maxP[1] >= 3 * minP[1] && minP[1] > 0) {
            alerts.push(`\u2696\uFE0F <strong>Squilibrio carico</strong>: ${esc(maxP[0])} ha <strong>${maxP[1]}</strong> task attive, ${esc(minP[0])} ne ha <strong>${minP[1]}</strong>`);
        }
    }

    // f) Progetti fermi (no activity log in 7+ days)
    projects.forEach(p => {
        if (p.status === 'completato') return;
        const tasks = p.tasks || [];
        let lastActivity = '';
        tasks.forEach(t => {
            (t.activityLog || []).forEach(e => {
                if (e.date > lastActivity) lastActivity = e.date;
            });
        });
        if (lastActivity && daysDiff(lastActivity) < -7) {
            const daysAgo = Math.abs(daysDiff(lastActivity));
            alerts.push(`\uD83D\uDCA4 Progetto <strong>${esc(p.name)}</strong> fermo da <strong>${daysAgo}</strong> giorni`);
        } else if (!lastActivity && tasks.length > 0) {
            alerts.push(`\uD83D\uDCA4 Progetto <strong>${esc(p.name)}</strong> <span class="radar-detail">(nessuna attivita registrata)</span>`);
        }
    });

    // g) Cluster deadline (5+ task nella stessa settimana futura)
    const nextWeekStart = new Date();
    nextWeekStart.setDate(nextWeekStart.getDate() + (7 - nextWeekStart.getDay()) + 1);
    const nextWeekEnd = new Date(nextWeekStart);
    nextWeekEnd.setDate(nextWeekEnd.getDate() + 6);
    const nextWeekTasks = allTasks.filter(t => {
        if (t.status === 'done' || !t.dueDate) return false;
        const d = new Date(t.dueDate);
        return d >= nextWeekStart && d <= nextWeekEnd;
    });
    if (nextWeekTasks.length >= 5) {
        alerts.push(`\uD83D\uDCC5 Settimana prossima: <strong>${nextWeekTasks.length} task</strong> in scadenza \u2014 attenzione al collo di bottiglia`);
    }

    // Build HTML
    let html = '<div class="radar-section">';
    html += '<div class="section-title">\uD83D\uDCE1 Radar PM</div>';
    if (alerts.length === 0) {
        html += '<div class="radar-card radar-ok"><div class="radar-ok-msg">\u2705 Tutto sotto controllo</div></div>';
    } else {
        html += '<div class="radar-card radar-alert">';
        alerts.forEach(a => {
            html += `<div class="radar-item">${a}</div>`;
        });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

// ========== COPY DATA FOR CLAUDE ==========
function copyDataForClaude() {
    const btn = document.querySelector('.copy-data-btn');
    const projects = getProjects();
    if (projects.length === 0) {
        const text = '=== PROJECT BOARD DATA \u2014 ' + today() + ' ===\n\nNessun progetto presente.\n';
        navigator.clipboard.writeText(text).then(() => {
            if (btn) { btn.textContent = '\u2705 Copiato!'; btn.classList.add('copied'); setTimeout(() => { btn.innerHTML = '&#128202; Copia dati'; btn.classList.remove('copied'); }, 2000); }
        });
        return;
    }

    const allTasks = projects.flatMap(p => (p.tasks || []).map(t => ({...t, projectName: p.name})));
    const doneTasks = allTasks.filter(t => t.status === 'done').length;
    const inProgress = allTasks.filter(t => t.status === 'in_progress').length;
    const blockedTasks = allTasks.filter(t => t.status === 'blocked').length;
    const overdueTasks = allTasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0).length;
    const activeProjects = projects.filter(p => p.status === 'attivo').length;
    const pausedProjects = projects.filter(p => p.status === 'in-pausa').length;

    // Per person
    const activeTasks = allTasks.filter(t => t.status !== 'done' && t.assignee);
    const byPerson = {};
    activeTasks.forEach(t => { byPerson[t.assignee] = (byPerson[t.assignee] || 0) + 1; });
    const personSummary = Object.entries(byPerson).map(([n, c]) => `${n} (${c} attive)`).join(', ');

    // Ore stimate aggregate
    const totalEstHours = allTasks.reduce((s,t) => s + (t.estimateHours || 0), 0);
    const remainEstHours = allTasks.filter(t => t.status !== 'done').reduce((s,t) => s + (t.estimateHours || 0), 0);

    // Velocity: task completate questa settimana vs precedente
    const nowMs = Date.now();
    const weekMs = 7 * 86400000;
    const thisWeekDone = allTasks.filter(t => t.completedAt && (nowMs - t.completedAt) < weekMs).length;
    const lastWeekDone = allTasks.filter(t => t.completedAt && (nowMs - t.completedAt) >= weekMs && (nowMs - t.completedAt) < weekMs * 2).length;
    const velocityTrend = thisWeekDone > lastWeekDone ? 'accelerando' : thisWeekDone < lastWeekDone ? 'rallentando' : 'stabile';

    // Task senza deadline
    const noDue = allTasks.filter(t => t.status !== 'done' && !t.dueDate).length;

    // Rischio per progetto (da generatePMAnalysis)
    const pmAnalysis = generatePMAnalysis();

    let text = `=== PROJECT BOARD DATA \u2014 ${today()} ===\n\n`;
    text += `RIEPILOGO:\n`;
    text += `- Progetti: ${projects.length} (${activeProjects} attivi, ${pausedProjects} in pausa)\n`;
    text += `- Task totali: ${allTasks.length} | Completate: ${doneTasks} | In corso: ${inProgress} | Bloccate: ${blockedTasks} | Scadute: ${overdueTasks} | Senza deadline: ${noDue}\n`;
    text += `- Ore stimate: ${totalEstHours}h totali, ${remainEstHours}h rimanenti\n`;
    text += `- Velocity: ${thisWeekDone} completate questa settimana, ${lastWeekDone} la scorsa (${velocityTrend})\n`;
    text += `- Per persona: ${personSummary || 'nessuna task assegnata'}\n\n`;

    text += `ANALISI RISCHIO:\n`;
    pmAnalysis.forEach(pm => {
        const levelLabel = pm.level === 'critical' ? 'CRITICO' : pm.level === 'warning' ? 'ATTENZIONE' : 'OK';
        text += `- ${pm.name}: ${levelLabel} (${pm.pct}%) — ${pm.context} — AZIONE: ${pm.action}\n`;
    });
    text += '\n';

    projects.forEach(p => {
        const tasks = p.tasks || [];
        const pDone = tasks.filter(t => t.status === 'done').length;
        const pct = tasks.length ? Math.round(pDone / tasks.length * 100) : 0;

        const estH = tasks.reduce((s,t) => s + (t.estimateHours || 0), 0);
        const remainH = tasks.filter(t => t.status !== 'done').reduce((s,t) => s + (t.estimateHours || 0), 0);
        text += `PROGETTO: ${p.name} \u2014 ${p.status} \u2014 ${pct}% \u2014 ${remainH}h rimanenti su ${estH}h totali\n`;
        text += `Deadline: ${p.launchDate || 'non definita'}\n\n`;

        tasks.forEach(t => {
            text += `  TASK: ${t.title}\n`;
            text += `  Stato: ${STATUS_LABELS[t.status] || t.status} | Assegnato: ${t.assignee || 'nessuno'} | Deadline: ${t.dueDate || 'nessuna'} | Stima: ${t.estimateHours ? t.estimateHours+'h' : '-'} | Prossimo check: ${t.nextCheck || 'nessuno'}\n`;
            text += `  Fatto quando: ${t.doneWhen || ''}\n`;
            text += `  Dipende da: ${t.dependsLabel || ''}\n`;
            const log = t.activityLog || [];
            if (log.length > 0) {
                const last = log[log.length - 1];
                text += `  Ultimo log: ${last.date || ''} \u2014 ${last.text || ''}\n`;
            } else {
                text += `  Ultimo log: nessuno\n`;
            }
            text += '\n';
        });
    });

    navigator.clipboard.writeText(text).then(() => {
        if (btn) { btn.textContent = '\u2705 Copiato!'; btn.classList.add('copied'); setTimeout(() => { btn.innerHTML = '&#128202; Copia dati'; btn.classList.remove('copied'); }, 2000); }
    }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (btn) { btn.textContent = '\u2705 Copiato!'; btn.classList.add('copied'); setTimeout(() => { btn.innerHTML = '&#128202; Copia dati'; btn.classList.remove('copied'); }, 2000); }
    });
}

// ========== GLOBAL DASHBOARD ==========
function renderGlobal() {
    const projects = getProjects();
    const allTasks = projects.flatMap(p => (p.tasks||[]).map(t => ({...t, projectName: p.name, projectId: p.id})));
    const active = projects.filter(p => p.status === 'attivo').length;
    const paused = projects.filter(p => p.status === 'in-pausa').length;
    const done = projects.filter(p => p.status === 'completato').length;
    const totalTasks = allTasks.length;
    const doneTasks = allTasks.filter(t => t.status === 'done').length;
    const blockedTasks = allTasks.filter(t => t.status === 'blocked');
    const overdueTasks = allTasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0);
    const completion = totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0;

    // This week
    const sow = startOfWeek(new Date());
    const eow = endOfWeek(new Date());
    const weekTasks = allTasks.filter(t => t.status !== 'done' && t.dueDate && new Date(t.dueDate) >= sow && new Date(t.dueDate) <= eow);
    weekTasks.sort((a,b) => a.dueDate.localeCompare(b.dueDate));

    // Group by day
    const weekByDay = {};
    weekTasks.forEach(t => {
        const key = t.dueDate;
        if (!weekByDay[key]) weekByDay[key] = [];
        weekByDay[key].push(t);
    });

    // Inbox: overdue + blocked
    const inbox = [...overdueTasks.map(t => ({...t, type:'overdue'})), ...blockedTasks.map(t => ({...t, type:'blocked'}))];
    inbox.sort((a,b) => {
        if (a.type === 'overdue' && b.type !== 'overdue') return -1;
        if (a.type !== 'overdue' && b.type === 'overdue') return 1;
        return (a.dueDate||'').localeCompare(b.dueDate||'');
    });

    let html = '<div class="global-view">';

    const todayStr = today();

    // ===== TOP ROW: BACHECA + LANCI =====
    html += '<div class="top-controls-row">';

    // BACHECA RISORSE — rettangolo unico cliccabile
    var topRes = getResources();
    var resCount = topRes.length;
    html += '<div style="display:inline-flex;align-items:center;gap:6px">';
    html += '<div onclick="openBachecaModal()" style="cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:all 0.15s;font-size:12px" onmouseenter="this.style.borderColor=\'var(--accent)\'" onmouseleave="this.style.borderColor=\'\'">';
    html += '<span style="font-size:14px">&#128218;</span>';
    html += '<span style="font-weight:700;color:var(--text)">Bacheca Alberto</span>';
    html += '<span style="color:var(--text-muted)">' + resCount + '</span>';
    html += '<span id="cooResBadgeSummary" style="color:var(--text-muted)"></span>';
    html += '<span style="color:var(--text-muted)">&#9654;</span>';
    html += '</div>';
    html += '<button onclick="openResourceModal()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);line-height:1">+</button>';
    html += '</div>';

    // LANCI MARKETING — affiancato
    html += '<div style="flex:1;min-width:200px">' + renderLaunchesSection() + '</div>';

    html += '</div>'; // close top-controls-row

    // ===== SBLOCCA (solo se serve) =====
    const pmData = generatePMAnalysis();
    const actions = [];
    pmData.forEach(p => {
        if (p.isPaused) return;
        (p.tasks || []).forEach(t => {
            if (t.status === 'done' || !t.assignee || t.assignee === 'Mattia') return;
            const isBlocked = t.status === 'blocked';
            const isOverdue = t.dueDate && t.dueDate < todayStr;
            if (!isBlocked && !isOverdue) return;
            const lastComment = (t.comments || []).slice(-1)[0];
            const reason = lastComment ? lastComment.text : '';
            actions.push({ person: t.assignee, task: t.title, project: p.name, taskId: t.id, projectId: p.id, isBlocked, isOverdue, dueDate: t.dueDate, reason });
        });
    });

    window._pmActions = actions;

    // Scadenze per giorno
    const noDueTasks = allTasks.filter(t => t.status !== 'done' && !t.dueDate);
    const daVerificare = allTasks.filter(t => t.status === 'da_verificare');
    const dueTodayAll = allTasks.filter(t => t.status !== 'done' && t.status !== 'da_verificare' && t.dueDate && t.dueDate === todayStr);
    const tomorrowStr = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; })();
    const dueTomorrowAll = allTasks.filter(t => t.status !== 'done' && t.status !== 'da_verificare' && t.dueDate && t.dueDate === tomorrowStr);
    const overdueAll = allTasks.filter(t => t.status !== 'done' && t.status !== 'da_verificare' && t.dueDate && t.dueDate < todayStr);

    // Task con aggiornamenti da Alberto
    const ceoUpdatedTasks = allTasks.filter(t => t.ceoHasUpdate);

    // Progetti con note da Alberto
    const ceoProjectNotes = projects.filter(p => p.ceoHasProjectNote);

    // Riga 1: ACTION CARDS — urgenti, visivamente distinte
    const hasActions = actions.length > 0 || daVerificare.length > 0 || ceoUpdatedTasks.length > 0 || ceoProjectNotes.length > 0 || dueTodayAll.length > 0 || dueTomorrowAll.length > 0 || overdueAll.length > 0;
    if (hasActions) {
        html += '<div class="action-bar">';
        if (ceoProjectNotes.length > 0) html += `<div class="action-card" style="border-color:var(--purple,#8B5CF6)" onclick="showCeoProjectNotes()"><span class="action-card-icon" style="color:var(--purple,#8B5CF6)">&#128172;</span><div class="action-card-body"><span class="action-card-num" style="color:var(--purple,#8B5CF6)">${ceoProjectNotes.length}</span><span class="action-card-label" style="color:var(--purple,#8B5CF6)">Note progetto</span></div></div>`;
        if (ceoUpdatedTasks.length > 0) html += `<div class="action-card" style="border-color:var(--blue)" onclick="showCeoUpdatedTasks()"><span class="action-card-icon" style="color:var(--blue)">&#128172;</span><div class="action-card-body"><span class="action-card-num" style="color:var(--blue)">${ceoUpdatedTasks.length}</span><span class="action-card-label" style="color:var(--blue)">Risposte Alberto</span></div></div>`;
        if (daVerificare.length > 0) html += `<div class="action-card" style="border-color:var(--teal)" onclick="showDaVerificareTasks()"><span class="action-card-icon" style="color:var(--teal)">&#9745;</span><div class="action-card-body"><span class="action-card-num" style="color:var(--teal)">${daVerificare.length}</span><span class="action-card-label" style="color:var(--teal)">Da verificare</span></div></div>`;
        if (actions.length > 0) html += `<div class="action-card danger" onclick="showUnblockPopup()"><span class="action-card-icon">&#9888;</span><div class="action-card-body"><span class="action-card-num">${actions.length}</span><span class="action-card-label">Da sbloccare</span></div></div>`;
        if (overdueAll.length > 0) html += `<div class="action-card danger" onclick="showOverdueTasks()"><span class="action-card-icon">&#128680;</span><div class="action-card-body"><span class="action-card-num">${overdueAll.length}</span><span class="action-card-label">In ritardo</span></div></div>`;
        if (dueTodayAll.length > 0) html += `<div class="action-card warning" onclick="showDueTodayTasks()"><span class="action-card-icon">&#9203;</span><div class="action-card-body"><span class="action-card-num">${dueTodayAll.length}</span><span class="action-card-label">Scade oggi</span></div></div>`;
        if (dueTomorrowAll.length > 0) html += `<div class="action-card caution" onclick="showDueTomorrowTasks()"><span class="action-card-icon">&#128197;</span><div class="action-card-body"><span class="action-card-num">${dueTomorrowAll.length}</span><span class="action-card-label">Scade domani</span></div></div>`;
        html += '</div>';
    }
    // Riga 2: STATS LINE — contesto leggero, testo piatto
    html += '<div class="stats-line">';
    html += `<span>${active} progetti attivi &middot; ${completion}% completamento</span>`;
    html += '<span class="stats-line-sep">&bull;</span>';
    html += `<span>${doneTasks}/${totalTasks} task completate</span>`;
    if (weekTasks.length > 0) {
        html += '<span class="stats-line-sep">&bull;</span>';
        html += `<span class="stats-line-link" onclick="showWeekTasks()">${weekTasks.length} questa settimana</span>`;
    }
    if (noDueTasks.length > 0) {
        html += '<span class="stats-line-sep">&bull;</span>';
        html += `<span class="stats-line-link stats-line-warn" onclick="showNoDueTasks()">${noDueTasks.length} senza scadenza</span>`;
    }
    html += '</div>';

    // Projects grid FIRST — ordinati per scadenza (launchDate) più vicina
    projects.sort((a, b) => {
        if (a.launchDate && b.launchDate) return a.launchDate.localeCompare(b.launchDate);
        if (a.launchDate) return -1;
        if (b.launchDate) return 1;
        return 0;
    });
    html += `<div><div class="section-title">Progetti</div><div class="projects-grid">`;
    projects.forEach(p => {
        const tasks = p.tasks || [];
        const doneCount = tasks.filter(t => t.status === 'done').length;
        const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
        const blocked = tasks.filter(t => t.status === 'blocked').length;
        const nextDue = tasks.filter(t => t.status !== 'done' && t.dueDate).sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0];
        const assignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];

        html += `<div class="project-card" onclick="goProject('${p.id}')">`;
        if (blocked > 0) html += `<div class="project-card-alert">${blocked}</div>`;
        html += `<div class="project-card-header">
            <span class="project-card-name">${esc(p.name)} <span class="health-emoji">${projectHealthEmoji(p)}</span></span>
            <span class="status-badge status-${p.status||'draft'}" style="font-size:10px;padding:2px 8px;">${(p.status||'draft').replace('-',' ')}</span>
        </div>`;
        // Scadenza progetto — prominente
        if (p.launchDate) {
            const dLeft = daysDiff(p.launchDate);
            const isOverdue = dLeft < 0;
            const isUrgent = dLeft >= 0 && dLeft <= 14;
            const dlColor = isOverdue ? 'var(--red)' : (isUrgent ? 'var(--orange)' : 'var(--green)');
            const dlBg = isOverdue ? 'var(--red-bg)' : (isUrgent ? 'var(--orange-bg)' : 'var(--green-bg)');
            const dlDateFmt = new Date(p.launchDate + 'T00:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'long'});
            const dlLabel = isOverdue ? `Scaduto da ${Math.abs(dLeft)}g` : (dLeft === 0 ? 'OGGI' : `${dLeft}g`);
            html += `<div style="display:flex;align-items:center;gap:8px;margin:8px 0;padding:6px 10px;background:${dlBg};border-radius:8px;border:1px solid ${dlColor}20">
                <span style="font-size:16px">&#127937;</span>
                <span style="font-size:14px;font-weight:700;color:${dlColor}">${dlDateFmt}</span>
                <span style="font-size:11px;font-weight:800;color:${dlColor};margin-left:auto;background:var(--surface);border:1px solid ${dlColor};border-radius:5px;padding:1px 7px">${dlLabel}</span>
            </div>`;
        }
        html += `<div class="project-card-stats">
            <div class="project-card-stat"><span class="project-card-stat-label">Task</span><span class="project-card-stat-value">${tasks.length}</span></div>
            <div class="project-card-stat"><span class="project-card-stat-label">Completate</span><span class="project-card-stat-value" style="color:${completionColor(pct)}">${doneCount}</span></div>
            <div class="project-card-stat"><span class="project-card-stat-label">Avanzamento</span><span class="project-card-stat-value" style="color:${completionColor(pct)}">${pct}%</span></div>
        </div>`;
        // Mini-timeline
        html += renderMiniTimeline(p, tasks);
        html += `<div class="project-card-progress"><div class="project-card-progress-bar" style="width:${pct}%;background:${completionColor(pct)}"></div></div>`;
        html += `<div class="project-card-footer">
            <div class="project-card-avatars">${assignees.slice(0,5).map(a => {
                const m = getTeamMember(a);
                return `<div class="avatar-sm" style="background:${m?m.color:'var(--slate)'}" title="${esc(a)}">${initials(a)}</div>`;
            }).join('')}</div>
            <span class="project-card-deadline">${nextDue ? smartDate(nextDue.dueDate) : ''}</span>
        </div>`;
        html += '</div>';
    });
    html += '</div></div>';

    // Sezione "Attenzione richiesta" rimossa — le action card (da sbloccare, in ritardo)
    // coprono gia' questa funzione con popup al click

    // ===== LE MIE TASK (Mattia) =====
    const myTasks = allTasks.filter(t => t.assignee === 'Mattia' && t.status !== 'done');
    const myOverdue = myTasks.filter(t => t.dueDate && daysDiff(t.dueDate) < 0);
    const myToday = myTasks.filter(t => t.dueDate && daysDiff(t.dueDate) === 0);
    const myThisWeek = myTasks.filter(t => t.dueDate && daysDiff(t.dueDate) > 0 && daysDiff(t.dueDate) <= 7);
    const myNext = myTasks.filter(t => t.dueDate && daysDiff(t.dueDate) > 7).slice(0, 3);
    const myNoDue = myTasks.filter(t => !t.dueDate).slice(0, 3);
    const myDisplay = [...myOverdue, ...myToday, ...myThisWeek, ...myNext, ...myNoDue];

    if (myDisplay.length > 0) {
        html += '<div class="my-global-section">';
        html += `<div class="section-title">Le mie task <span class="count-badge" style="background:var(--accent-soft);color:var(--accent)">${myTasks.length}</span></div>`;
        myDisplay.slice(0, 12).forEach(t => {
            const diff = daysDiff(t.dueDate);
            const isOverdue = t.dueDate && diff < 0;
            const isToday = t.dueDate && diff === 0;
            const cls = isOverdue ? 'overdue-glow' : isToday ? 'today-glow' : '';
            const dc = dateClass(t.dueDate, t.status);
            html += `<div class="my-global-task ${cls}" onclick="openTaskModal('${t.id}','${t.projectId}')">
                <span style="font-weight:600;flex:1">${esc(t.title)}</span>
                <span style="font-size:11px;color:var(--text-muted);min-width:120px">${esc(t.projectName)}</span>
                ${t.dueDate ? `<span class="task-card-due ${dc}" style="font-size:11px;min-width:60px;text-align:right">${smartDate(t.dueDate)}</span>` : ''}
                <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${STATUS_COLORS[t.status]}22;color:${STATUS_COLORS[t.status]};font-weight:600">${STATUS_LABELS[t.status]}</span>
                <button class="quick-done-btn" style="width:auto;margin:0;padding:3px 10px" onclick="event.stopPropagation();changeTaskStatus('${t.id}','${t.projectId}','done')">&#10003; Fatto</button>
            </div>`;
        });
        html += '</div>';
    }

    // ===== CALENDARIO LANCI =====
    const projectsWithLaunch = projects.filter(p => p.launchDate && p.status !== 'completato');
    if (projectsWithLaunch.length > 0) {
        projectsWithLaunch.sort((a,b) => a.launchDate.localeCompare(b.launchDate));
        html += '<div><div class="section-title">Calendario Lanci</div><div class="launch-timeline">';
        projectsWithLaunch.forEach(p => {
            const diff = daysDiff(p.launchDate);
            const tasks = p.tasks || [];
            const doneCount = tasks.filter(t => t.status === 'done').length;
            const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
            const cls = diff < 0 ? 'past-due' : diff <= 7 ? 'soon' : diff <= 21 ? 'on-track' : 'far';
            const countdownColor = diff < 0 ? 'var(--red)' : diff <= 7 ? 'var(--orange)' : diff <= 21 ? 'var(--green)' : 'var(--blue)';
            const countdownText = diff < 0 ? `${Math.abs(diff)}` : `${diff}`;
            const countdownLabel = diff < 0 ? 'GIORNI FA' : diff === 0 ? 'OGGI!' : 'GIORNI';
            const launchDateFmt = new Date(p.launchDate).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'long' });
            // Next incomplete task (milestone)
            const nextTask = tasks.filter(t => t.status !== 'done' && t.dueDate).sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0];
            const blockedCount = tasks.filter(t => t.status === 'blocked').length;

            html += `<div class="launch-item ${cls}" onclick="goProject('${p.id}')">
                <div class="launch-countdown">
                    <span class="launch-countdown-num" style="color:${countdownColor}">${diff === 0 ? '!' : countdownText}</span>
                    <span class="launch-countdown-label">${countdownLabel}</span>
                </div>
                <div class="launch-info">
                    <span class="launch-name">${esc(p.name)}</span>
                    <span class="launch-date">Lancio: ${launchDateFmt}</span>
                    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
                        <div class="launch-progress-bar"><div class="launch-progress-fill" style="width:${pct}%;background:${countdownColor}"></div></div>
                        <span style="font-size:11px;font-weight:700;color:var(--text-secondary)">${pct}%</span>
                        ${blockedCount > 0 ? `<span style="font-size:11px;font-weight:700;color:var(--red)">${blockedCount} bloccate</span>` : ''}
                    </div>
                    ${nextTask ? `<span class="launch-milestone">Prossimo: ${esc(nextTask.title)} (${smartDate(nextTask.dueDate)})</span>` : ''}
                </div>
            </div>`;
        });
        html += '</div></div>';
    }

    // This Week
    if (Object.keys(weekByDay).length > 0) {
        html += '<div class="week-section"><div class="section-title">Questa settimana</div>';
        Object.keys(weekByDay).sort().forEach(day => {
            const dayLabel = weekDayName(day).charAt(0).toUpperCase() + weekDayName(day).slice(1) + ' ' + new Date(day).getDate();
            html += `<div class="week-day-group"><div class="week-day-label">${dayLabel}</div>`;
            weekByDay[day].forEach(t => {
                const m = getTeamMember(t.assignee);
                html += `<div class="week-task-item" onclick="openTaskModal('${t.id}','${t.projectId}')">
                    <span style="font-weight:600;flex:1">${esc(t.title)}</span>
                    <span style="font-size:11px;color:var(--text-muted)">${esc(t.projectName)}</span>
                    <span style="font-size:11px;color:${m?m.color:'var(--text-muted)'};font-weight:600">${esc(t.assignee||'')}</span>
                </div>`;
            });
            html += '</div>';
        });
        html += '</div>';
    }

    // ========== CEO TOOLS (Quick Links) — gestione COO ==========
    html += '<div style="border-top:2px solid var(--border);padding-top:20px;margin-top:8px">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
    html += '<div style="font-size:15px;font-weight:800;color:var(--text)">Pannello CEO</div>';
    html += '<div style="font-size:11px;color:var(--text-muted)">Quick Links visibili al CEO</div>';
    html += '</div>';

    // Quick Links management
    html += '<div style="margin-bottom:18px">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
    html += '<span style="font-size:13px;font-weight:700;color:var(--text-secondary)">Quick Links</span>';
    html += '<button onclick="openCeoLinkModal()" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font)">+ Nuovo</button>';
    html += '</div>';
    var cLinks = getCeoLinks();
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    cLinks.forEach(function(lk) {
        html += '<div onclick="openCeoLinkModal(\'' + lk.id + '\')" style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px" title="Clicca per modificare">';
        html += '<span>' + lk.icon + '</span>';
        html += '<span style="font-weight:600;color:var(--text)">' + esc(lk.label) + '</span>';
        if (!lk.url || !lk.url.trim()) html += '<span style="color:var(--red);font-size:10px">no url</span>';
        html += '</div>';
    });
    html += '</div></div>';

    html += '</div>'; // close CEO tools section

    html += '</div>';
    return html;
}

// ========== GLOBAL VIEWS ==========
function getAllTasksFlat() {
    return getProjects().flatMap(p => (p.tasks||[]).map(t => ({...t, projectName: p.name, projectId: p.id})));
}

function getGlobalFilteredTasks() {
    let tasks = getAllTasksFlat();
    const f = state.filters;
    if (f.search) { const s = f.search.toLowerCase(); tasks = tasks.filter(t => t.title.toLowerCase().includes(s) || (t.projectName||'').toLowerCase().includes(s)); }
    if (f.assignee) tasks = tasks.filter(t => t.assignee === f.assignee);
    if (f.status) tasks = tasks.filter(t => t.status === f.status);
    if (f.project) tasks = tasks.filter(t => t.projectId === f.project);
    return tasks;
}

function renderGlobalFilters() {
    const team = getTeam();
    const projects = getProjects();
    const active = state.filters.search || state.filters.assignee || state.filters.status || state.filters.project;
    return `<div class="filters-bar">

        </select>

        </select>
