// Global List — all tasks in sortable table
function renderGlobalList() {
    let tasks = getGlobalFilteredTasks();
    if (state.sort.column) {
        tasks.sort((a,b) => {
            let va = a[state.sort.column] || '';
            let vb = b[state.sort.column] || '';
            if (state.sort.column === 'status') { va = STATUS_LIST.indexOf(a.status); vb = STATUS_LIST.indexOf(b.status); }
            if (state.sort.column === 'projectName') { va = a.projectName||''; vb = b.projectName||''; }
            if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
            if (va < vb) return state.sort.dir === 'asc' ? -1 : 1;
            if (va > vb) return state.sort.dir === 'asc' ? 1 : -1;
            return 0;
        });
    }
    const sortArrow = (col) => {
        if (state.sort.column !== col) return '';
        return `<span class="sort-arrow">${state.sort.dir==='asc'?'&#9650;':'&#9660;'}</span>`;
    };

    let html = '<table class="list-table"><thead><tr>';
    html += `<th onclick="toggleSort('title')">Titolo ${sortArrow('title')}</th>`;
    html += `<th onclick="toggleSort('projectName')">Progetto ${sortArrow('projectName')}</th>`;
    html += `<th onclick="toggleSort('assignee')">Assegnato ${sortArrow('assignee')}</th>`;
    html += `<th onclick="toggleSort('status')">Stato ${sortArrow('status')}</th>`;
    html += `<th onclick="toggleSort('dueDate')">Scadenza ${sortArrow('dueDate')}</th>`;
    html += '</tr></thead><tbody>';

    tasks.forEach(t => {
        const m = getTeamMember(t.assignee);
        const dc = dateClass(t.dueDate, t.status);
        html += `<tr onclick="openTaskModal('${t.id}','${t.projectId}')">`;
        html += `<td style="font-weight:600">${esc(t.title)}</td>`;
        html += `<td style="font-size:12px;color:var(--text-muted)">${esc(t.projectName)}</td>`;
        html += `<td>${t.assignee?`<span style="display:flex;align-items:center;gap:4px"><span class="avatar-xs" style="background:${m?m.color:'var(--slate)'}">${initials(t.assignee)}</span>${esc(t.assignee)}</span>`:''}</td>`;
        html += `<td><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:${STATUS_COLORS[t.status]}22;color:${STATUS_COLORS[t.status]}">${STATUS_LABELS[t.status]}</span></td>`;
        html += `<td><span class="task-card-due ${dc}">${smartDate(t.dueDate)}</span></td>`;
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

// Global Calendar — all tasks on calendar
function renderGlobalCalendar() {
    const now = new Date();
    if (!calYear) { calYear = now.getFullYear(); calMonth = now.getMonth(); }

    const tasks = getAllTasksFlat().filter(t => t.dueDate);
    const tasksByDate = {};
    tasks.forEach(t => { if (!tasksByDate[t.dueDate]) tasksByDate[t.dueDate] = []; tasksByDate[t.dueDate].push(t); });

    const firstDay = new Date(calYear, calMonth, 1);
    const lastDay = new Date(calYear, calMonth + 1, 0);
    let startDay = firstDay.getDay();
    startDay = startDay === 0 ? 6 : startDay - 1;

    const monthName = firstDay.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
    const todayStr = today();

    // Also show launch dates
    const projects = getProjects();
    const launches = projects.filter(p => p.launchDate).reduce((acc, p) => { acc[p.launchDate] = p.name; return acc; }, {});

    // For project mode: build project deadline map
    const projectsByDate = {};
    if (calMode === 'project') {
        projects.forEach(p => {
            const pTasks = p.tasks || [];
            if (p.launchDate) {
                if (!projectsByDate[p.launchDate]) projectsByDate[p.launchDate] = [];
                const total = pTasks.length;
                const done = pTasks.filter(t => t.status === 'done').length;
                const pct = total > 0 ? Math.round(done/total*100) : 0;
                const blocked = pTasks.filter(t => t.status === 'blocked').length;
                projectsByDate[p.launchDate].push({ name: p.name, pct, status: p.status, blocked, total, done });
            }
            // Also show earliest undone task deadline per project
            const nextTask = pTasks.filter(t => t.status !== 'done' && t.dueDate).sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0];
            if (nextTask) {
                if (!projectsByDate[nextTask.dueDate]) projectsByDate[nextTask.dueDate] = [];
                const existing = projectsByDate[nextTask.dueDate].find(x => x.name === p.name);
                if (!existing) {
                    const total = pTasks.length;
                    const done = pTasks.filter(t => t.status === 'done').length;
                    const pct = total > 0 ? Math.round(done/total*100) : 0;
                    projectsByDate[nextTask.dueDate].push({ name: p.name, pct, isNext: true, taskTitle: nextTask.title });
                }
            }
        });
    }

    // Nav label depends on view
    let navLabel = '';
    if (calView === 'year') {
        navLabel = String(calYear);
    } else if (calView === 'week') {
        const weekStart = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
        navLabel = weekStart.toLocaleDateString('it-IT',{day:'numeric',month:'short'}) + ' — ' + weekEnd.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    } else {
        navLabel = monthName.charAt(0).toUpperCase()+monthName.slice(1);
    }

    var _mob = isMobile();
    if (_mob && calView === 'month') { calView = 'week'; }
    if (_mob && calView === 'year') { calMode = 'project'; }
    // Ricalcola navLabel se settimana
    if (calView === 'week') {
        const _ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        const _we = new Date(_ws); _we.setDate(_we.getDate() + 6);
        navLabel = _ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'}) + ' — ' + _we.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    }
    if (_mob && calView === 'year') { navLabel = String(calYear); }
    let html = `<div class="calendar-nav">
        <button class="calendar-nav-btn" onclick="calNavPrev();render()">&#8249;</button>
        <span class="calendar-month-label">${navLabel}</span>
        <button class="calendar-nav-btn" onclick="calNavNext();render()">&#8250;</button>
        ${_mob ? `<div class="cal-mode-toggle">
            <button class="cal-mode-btn ${calView==='week'?'active':''}" onclick="calView='week';render()">Sett</button>
            <button class="cal-mode-btn ${calView==='year'?'active':''}" onclick="calView='year';render()">Anno</button>
        </div>` : `<div class="cal-mode-toggle">
            <button class="cal-mode-btn ${calView==='week'?'active':''}" onclick="calView='week';render()">Settimana</button>
            <button class="cal-mode-btn ${calView==='month'?'active':''}" onclick="calView='month';render()">Mese</button>
            <button class="cal-mode-btn ${calView==='year'?'active':''}" onclick="calView='year';render()">Anno</button>
        </div>
        <div class="cal-mode-toggle">
            <button class="cal-mode-btn ${calMode==='project'?'active':''}" onclick="calMode='project';render()">Progetti</button>
            <button class="cal-mode-btn ${calMode==='task'?'active':''}" onclick="calMode='task';render()">Task</button>
        </div>`}
    </div>`;

    // Helper: render day cell content based on calMode
    function dayContent(dateStr) {
        let out = '';
        if (calMode === 'task') {
            const dayTasks = tasksByDate[dateStr] || [];
            const launchName = launches[dateStr];
            if (launchName) {
                out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700" title="LANCIO: ${esc(launchName)}">&#127937; ${esc(launchName)}</div>`;
            }
            dayTasks.slice(0,3).forEach(t => {
                const m = getTeamMember(t.assignee);
                const bgColor = m ? m.color + '22' : 'var(--slate-bg)';
                const textColor = m ? m.color : 'var(--slate)';
                out += `<div class="calendar-task-pill" style="background:${bgColor};color:${textColor}" onclick="openTaskModal('${t.id}','${t.projectId}')" title="${esc(t.projectName)}: ${esc(t.title)}">${esc(t.title)}</div>`;
            });
            if (dayTasks.length > 3) out += `<span style="font-size:10px;color:var(--text-muted)">+${dayTasks.length-3}</span>`;
        } else {
            const dayProjects = projectsByDate[dateStr] || [];
            const launchName = launches[dateStr];
            dayProjects.forEach(p => {
                const isLaunch = launchName === p.name && !p.isNext;
                if (isLaunch) {
                    out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;" title="${esc(p.name)} — LANCIO — ${p.pct}% (${p.done}/${p.total})${p.blocked?' — '+p.blocked+' bloccate':''}">&#127937; ${esc(p.name)} ${p.pct}%</div>`;
                } else if (p.isNext) {
                    const color = p.pct < 20 ? 'var(--red)' : p.pct < 50 ? 'var(--orange)' : 'var(--green)';
                    const bg = p.pct < 20 ? 'var(--red-bg)' : p.pct < 50 ? 'var(--orange-bg)' : 'var(--green-bg)';
                    out += `<div class="calendar-task-pill" style="background:${bg};color:${color};font-size:11px;" title="${esc(p.name)} — prossima: ${esc(p.taskTitle)}">${esc(p.name)} ${p.pct}%</div>`;
                }
            });
            if (launchName && !dayProjects.find(p => p.name === launchName && !p.isNext)) {
                out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;" title="LANCIO: ${esc(launchName)}">&#127937; ${esc(launchName)}</div>`;
            }
        }
        return out;
    }

    // Helper: full day content for week view (no limit)
    function dayContentFull(dateStr) {
        let out = '';
        if (calMode === 'task') {
            const dayTasks = tasksByDate[dateStr] || [];
            const launchName = launches[dateStr];
            if (launchName) {
                out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700" title="LANCIO: ${esc(launchName)}">&#127937; ${esc(launchName)}</div>`;
            }
            dayTasks.forEach(t => {
                const m = getTeamMember(t.assignee);
                const bgColor = m ? m.color + '22' : 'var(--slate-bg)';
                const textColor = m ? m.color : 'var(--slate)';
                out += `<div class="calendar-task-pill" style="background:${bgColor};color:${textColor}" onclick="openTaskModal('${t.id}','${t.projectId}')" title="${esc(t.projectName)}: ${esc(t.title)}">${esc(t.title)}</div>`;
            });
        } else {
            const dayProjects = projectsByDate[dateStr] || [];
            const launchName = launches[dateStr];
            dayProjects.forEach(p => {
                const isLaunch = launchName === p.name && !p.isNext;
                if (isLaunch) {
                    out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;" title="${esc(p.name)} — LANCIO — ${p.pct}% (${p.done}/${p.total})${p.blocked?' — '+p.blocked+' bloccate':''}">&#127937; ${esc(p.name)} ${p.pct}%</div>`;
                } else if (p.isNext) {
                    const color = p.pct < 20 ? 'var(--red)' : p.pct < 50 ? 'var(--orange)' : 'var(--green)';
                    const bg = p.pct < 20 ? 'var(--red-bg)' : p.pct < 50 ? 'var(--orange-bg)' : 'var(--green-bg)';
                    out += `<div class="calendar-task-pill" style="background:${bg};color:${color};font-size:11px;" title="${esc(p.name)} — prossima: ${esc(p.taskTitle)}">${esc(p.name)} ${p.pct}%</div>`;
                }
            });
            if (launchName && !dayProjects.find(p => p.name === launchName && !p.isNext)) {
                out += `<div class="calendar-task-pill" style="background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;" title="LANCIO: ${esc(launchName)}">&#127937; ${esc(launchName)}</div>`;
            }
        }
        return out;
    }

    if (calView === 'month') {
        // ── Month grid (rolling: parte da max 7gg fa per il mese corrente) ──
        const isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth();
        let gridStartDate;
        if (isCurrentMonth) {
            // Parti da 7 giorni fa, allineato a lunedì
            const sevenAgo = new Date(now); sevenAgo.setDate(now.getDate() - 7);
            const dow = sevenAgo.getDay();
            const mondayOffset = dow === 0 ? 6 : dow - 1;
            sevenAgo.setDate(sevenAgo.getDate() - mondayOffset);
            gridStartDate = sevenAgo;
        } else {
            // Mese non corrente: parti dal lunedì prima del 1°
            const fd = new Date(calYear, calMonth, 1);
            const dow = fd.getDay();
            const mondayOffset = dow === 0 ? 6 : dow - 1;
            fd.setDate(fd.getDate() - mondayOffset);
            gridStartDate = fd;
        }
        // Fine griglia: ultimo giorno del mese + fill settimana
        const gridEndBase = new Date(calYear, calMonth + 1, 0); // ultimo giorno mese
        const geDow = gridEndBase.getDay();
        const fillDays = geDow === 0 ? 0 : 7 - geDow;
        const gridEndDate = new Date(gridEndBase); gridEndDate.setDate(gridEndDate.getDate() + fillDays);

        html += '<div class="calendar-grid">';
        ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d => {
            html += `<div class="calendar-day-header">${d}</div>`;
        });

        const cursor = new Date(gridStartDate);
        while (cursor <= gridEndDate) {
            const cy = cursor.getFullYear();
            const cm = cursor.getMonth();
            const cd = cursor.getDate();
            const dateStr = `${cy}-${String(cm+1).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;
            const isToday = dateStr === todayStr;
            const isOther = cm !== calMonth;
            html += `<div class="calendar-day ${isToday?'today':''} ${isOther?'other-month':''}">`;
            html += `<span class="calendar-day-num">${cd}</span>`;
            if (!isOther) html += dayContent(dateStr);
            html += '</div>';
            cursor.setDate(cd + 1);
        }
        html += '</div>';

    } else if (calView === 'week') {
        // ── Week view ──
        const ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        const dayNames = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
        html += '<div class="cal-week-grid">';
        for (let i = 0; i < 7; i++) {
            const wd = new Date(ws); wd.setDate(wd.getDate() + i);
            const ds = `${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,'0')}-${String(wd.getDate()).padStart(2,'0')}`;
            const dayTasks = tasksByDate[ds] || [];
            const isToday = ds === todayStr;
            const isWeekend = wd.getDay() === 0 || wd.getDay() === 6;
            const launchName = launches[ds];
            const dayLaunchCount = projects.filter(p => p.launchDate === ds).length;
            const badgeCount = calMode === 'project' ? dayLaunchCount : dayTasks.length;

            html += `<div class="cal-week-day ${isToday?'today':''} ${isWeekend?'weekend':''}">`;
            html += `<div class="cal-week-day-header">
                <span class="cal-week-day-name">${dayNames[wd.getDay()]}</span>
                <span class="cal-week-day-num ${isToday?'today':''}">${wd.getDate()}</span>
                ${badgeCount > 0 ? `<span class="cal-week-day-count">${badgeCount}</span>` : ''}
            </div>`;

            html += '<div class="cal-week-tasks">';

            if (calMode === 'project') {
                // ── Modalità PROGETTI: solo scadenze globali (launchDate) ──
                const dayLaunches = projects.filter(p => p.launchDate === ds);
                dayLaunches.forEach(p => {
                    const total = (p.tasks||[]).length;
                    const done = (p.tasks||[]).filter(t => t.status === 'done').length;
                    const blocked = (p.tasks||[]).filter(t => t.status === 'blocked').length;
                    const pct = total > 0 ? Math.round(done/total*100) : 0;
                    const barColor = blocked > 0 ? 'var(--red)' : pct === 100 ? 'var(--green)' : 'var(--accent)';
                    const urgency = pct === 100 ? 'var(--green)' : pct >= 70 ? 'var(--accent)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';
                    html += `<div style="border:1px solid ${urgency}44;border-radius:10px;padding:10px;background:var(--surface);margin-bottom:6px;">`;
                    html += `<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;">&#127937; ${esc(p.name)}</div>`;
                    html += `<div style="height:4px;background:var(--border-light);border-radius:2px;margin-bottom:6px;"><div style="height:100%;width:${pct}%;background:${barColor};border-radius:2px;"></div></div>`;
                    html += `<div style="display:flex;gap:8px;font-size:11px;flex-wrap:wrap;">`;
                    html += `<span style="font-weight:700;color:${urgency}">${pct}%</span>`;
                    html += `<span style="color:var(--text-muted)">${done}/${total} task</span>`;
                    if (blocked > 0) html += `<span style="color:var(--red);font-weight:700">${blocked} bloccate</span>`;
                    html += '</div></div>';
                });
                if (dayLaunches.length === 0 && !launchName) {
                    // Nessuna scadenza progetto in questo giorno — cella vuota
                }
            } else {
                // ── Modalità TASK: singole task card ──
                const sorted = [...dayTasks].sort((a,b) => {
                    const ord = {blocked:0, in_progress:1, todo:2, done:3};
                    return (ord[a.status]||9) - (ord[b.status]||9);
                });
                sorted.forEach(t => {
                    const m = getTeamMember(t.assignee);
                    html += `<div class="cal-week-task-card" onclick="openTaskModal('${t.id}','${t.projectId}')">
                        <span class="cal-week-status-dot" style="background:${STATUS_COLORS[t.status]}"></span>
                        <div class="cal-week-task-info">
                            <div class="cal-week-task-title">${esc(t.title)}</div>
                            <div class="cal-week-task-meta">
                                ${t.assignee ? `<span class="avatar-xs" style="background:${m?m.color:'var(--slate)'}">${initials(t.assignee)}</span>` : ''}
                                <span>${esc(t.projectName||'')}</span>
                            </div>
                        </div>
                    </div>`;
                });
            }

            if (calMode === 'task' && dayTasks.length === 0 && !launchName) {
                html += '<div style="font-size:11px;color:var(--text-muted);padding:16px 4px;text-align:center;">Nessuna task</div>';
            }
            html += '</div></div>';
        }
        html += '</div>';

    } else if (calView === 'year') {

      // Mesi da mostrare: dal mese corrente in poi (12 mesi rolling)
      const curM = new Date().getMonth();
      const curY = new Date().getFullYear();
      const yearMonths = [];
      for (let i = 0; i < 12; i++) {
          const mi = (curM + i) % 12;
          const yi = curY + Math.floor((curM + i) / 12);
          if (yi === calYear || (yi === calYear + 1 && i > 0)) yearMonths.push({ m: mi, y: yi });
      }
      // Filtra solo mesi nell'anno selezionato, partendo dal corrente
      const displayMonths = [];
      for (let i = 0; i < 12; i++) {
          const mi = (curM + i) % 12;
          const yi = curY + Math.floor((curM + i) / 12);
          if (yi === calYear) displayMonths.push(mi);
      }

      if (calMode === 'project') {
        // ── ANNO / PROGETTI: un progetto nel mese della sua scadenza ──
        const monthProjs = Array.from({length:12}, () => []);
        projects.forEach(p => {
            if (!p.launchDate) return;
            const ld = new Date(p.launchDate + 'T00:00:00');
            if (ld.getFullYear() !== calYear) return;
            const mi = ld.getMonth();
            const total = (p.tasks||[]).length;
            const done = (p.tasks||[]).filter(t => t.status === 'done').length;
            const blocked = (p.tasks||[]).filter(t => t.status === 'blocked').length;
            const inProgress = (p.tasks||[]).filter(t => t.status === 'in_progress').length;
            const pct = total > 0 ? Math.round(done/total*100) : 0;
            monthProjs[mi].push({ name: p.name, launchDate: p.launchDate, total, done, blocked, inProgress, pct });
        });
        const noDate = projects.filter(p => {
            if (!p.launchDate) return true;
            const ld = new Date(p.launchDate + 'T00:00:00');
            return ld.getFullYear() !== calYear;
        });

        html += '<div class="cal-year-grid">';
        displayMonths.forEach(m => {
            const mName = new Date(calYear, m, 1).toLocaleDateString('it-IT', { month: 'long' });
            const isCur = m === new Date().getMonth() && calYear === new Date().getFullYear();
            const projs = monthProjs[m].sort((a,b) => a.launchDate.localeCompare(b.launchDate));

            html += `<div class="cal-year-month ${isCur?'current':''}" onclick="calMonth=${m};calView='month';render()">`;
            html += `<div class="cal-year-month-name">${mName.charAt(0).toUpperCase()+mName.slice(1)}</div>`;

            if (projs.length > 0) {
                html += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">';
                projs.forEach(pr => {
                    const barColor = pr.blocked > 0 ? 'var(--red)' : pr.pct === 100 ? 'var(--green)' : 'var(--accent)';
                    const deadlineStr = new Date(pr.launchDate+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
                    html += '<div style="padding:6px 8px;border-radius:8px;border:1px solid var(--border-light);background:var(--surface);">';
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">`;
                    html += `<span style="font-size:12px;font-weight:700;color:var(--text)">${esc(pr.name)}</span>`;
                    html += `<span style="font-size:10px;font-weight:700;color:var(--accent);">&#127937; ${deadlineStr}</span>`;
                    html += '</div>';
                    html += `<div class="cal-year-progress" style="margin-bottom:3px;"><div class="cal-year-progress-fill" style="width:${pr.pct}%;background:${barColor}"></div></div>`;
                    html += '<div style="display:flex;gap:6px;font-size:10px;">';
                    html += `<span style="color:var(--text-muted)">${pr.total} task</span>`;
                    html += `<span style="color:var(--green)">${pr.done} &#10003;</span>`;
                    if (pr.inProgress > 0) html += `<span style="color:var(--yellow)">${pr.inProgress} in corso</span>`;
                    if (pr.blocked > 0) html += `<span style="color:var(--red);font-weight:700">${pr.blocked} bloccate</span>`;
                    html += `<span style="color:var(--text-muted);margin-left:auto;">${pr.pct}%</span>`;
                    html += '</div></div>';
                });
                html += '</div>';
            } else {
                html += '<div style="font-size:11px;color:var(--text-muted);padding:12px 0;text-align:center;">—</div>';
            }
            html += '</div>';
        });
        if (noDate.length > 0) {
            html += '<div class="cal-year-month" style="border-style:dashed;">';
            html += '<div class="cal-year-month-name">Senza scadenza</div>';
            html += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">';
            noDate.forEach(p => {
                const total = (p.tasks||[]).length;
                const done = (p.tasks||[]).filter(t => t.status === 'done').length;
                const pct = total > 0 ? Math.round(done/total*100) : 0;
                html += `<div style="padding:4px 8px;border-radius:6px;border:1px solid var(--border-light);background:var(--surface);font-size:12px;">`;
                html += `<span style="font-weight:700;color:var(--text)">${esc(p.name)}</span>`;
                html += `<span style="color:var(--text-muted);font-size:10px;margin-left:8px;">${total} task · ${pct}%</span>`;
                html += '</div>';
            });
            html += '</div></div>';
        }
        html += '</div>';

      } else {
        // ── ANNO / TASK: carico di lavoro per mese con assegnatari ──
        const monthTasks = Array.from({length:12}, () => []);
        tasks.forEach(t => {
            const d = new Date(t.dueDate + 'T00:00:00');
            if (d.getFullYear() === calYear) monthTasks[d.getMonth()].push(t);
        });

        html += '<div class="cal-year-grid">';
        displayMonths.forEach(m => {
            const mName = new Date(calYear, m, 1).toLocaleDateString('it-IT', { month: 'long' });
            const isCur = m === new Date().getMonth() && calYear === new Date().getFullYear();
            const mt = monthTasks[m];
            const done = mt.filter(t => t.status === 'done').length;
            const blocked = mt.filter(t => t.status === 'blocked').length;
            const pct = mt.length > 0 ? Math.round(done/mt.length*100) : 0;

            // Raggruppa per assegnatario
            const byAssignee = {};
            mt.filter(t => t.status !== 'done').forEach(t => {
                const key = t.assignee || 'Non assegnato';
                if (!byAssignee[key]) byAssignee[key] = [];
                byAssignee[key].push(t);
            });

            html += `<div class="cal-year-month ${isCur?'current':''}" onclick="calMonth=${m};calView='month';render()">`;
            html += `<div class="cal-year-month-name">${mName.charAt(0).toUpperCase()+mName.slice(1)}</div>`;

            if (mt.length > 0) {
                html += '<div class="cal-year-month-stats">';
                html += `<div class="cal-year-progress"><div class="cal-year-progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':'var(--accent)'}"></div></div>`;
                html += '<div class="cal-year-stat-row">';
                html += `<span style="font-weight:700;color:var(--text)">${mt.length} task</span>`;
                html += `<span style="color:var(--green)">${done} &#10003;</span>`;
                if (blocked > 0) html += `<span style="color:var(--red);font-weight:700">${blocked} bloccate</span>`;
                html += `<span style="color:var(--text-muted);margin-left:auto;">${pct}%</span>`;
                html += '</div></div>';

                // Per assegnatario
                const assignees = Object.entries(byAssignee).sort((a,b) => b[1].length - a[1].length);
                if (assignees.length > 0) {
                    html += '<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;">';
                    assignees.forEach(([name, aTasks]) => {
                        const mem = getTeamMember(name);
                        const aBlocked = aTasks.filter(t => t.status === 'blocked').length;
                        html += `<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px solid var(--border-light);background:var(--surface);">`;
                        html += `<span class="avatar-xs" style="background:${mem?mem.color:'var(--slate)'};width:20px;height:20px;font-size:9px;">${initials(name)}</span>`;
                        html += `<span style="font-size:11px;font-weight:600;color:var(--text);flex:1;">${esc(name)}</span>`;
                        html += `<span style="font-size:10px;color:var(--text-muted)">${aTasks.length} task</span>`;
                        if (aBlocked > 0) html += `<span style="font-size:10px;color:var(--red);font-weight:700">${aBlocked} ✕</span>`;
                        html += '</div>';
                    });
                    html += '</div>';
                }
            } else {
                html += '<div style="font-size:11px;color:var(--text-muted);padding:12px 0;text-align:center;">—</div>';
            }

            html += '</div>';
        });
        html += '</div>';
      }
    }

    return html;
}

// Global People — all team with tasks across all projects
function renderGlobalPeople() {
    const team = getTeam();
    const allTasks = getGlobalFilteredTasks();

    let html = '<div class="people-grid">';
    team.forEach(m => {
        const memberTasks = allTasks.filter(t => t.assignee === m.name);
        if (memberTasks.length === 0) return;
        const activeTasks = memberTasks.filter(t => t.status !== 'done').length;
        const blockedCount = memberTasks.filter(t => t.status === 'blocked').length;

        html += `<div class="person-card">`;
        html += `<div class="person-header">
            <div class="avatar-lg" style="background:${m.color}">${initials(m.name)}</div>
            <div class="person-info"><div class="person-name">${esc(m.name)}</div><div class="person-role">${esc(m.role)}</div></div>
            <div style="text-align:right">
                <div style="font-size:20px;font-weight:800;color:var(--text)">${activeTasks}</div>
                <div style="font-size:10px;color:var(--text-muted)">task attive</div>
                ${blockedCount > 0 ? `<div style="font-size:10px;color:var(--red);font-weight:700">${blockedCount} bloccate</div>` : ''}
            </div>
        </div>`;
        html += '<div class="person-tasks">';
        const order = ['blocked','in_progress','review','todo','done'];
        memberTasks.sort((a,b) => order.indexOf(a.status) - order.indexOf(b.status));
        memberTasks.filter(t => t.status !== 'done').forEach(t => {
            const dc = dateClass(t.dueDate, t.status);
            html += `<div class="person-task-item" onclick="openTaskModal('${t.id}','${t.projectId}')">
                <span style="width:8px;height:8px;border-radius:50%;background:${STATUS_COLORS[t.status]};flex-shrink:0"></span>
                <span style="flex:1;font-weight:600">${esc(t.title)}</span>
                <span style="font-size:10px;color:var(--text-muted)">${esc(t.projectName)}</span>
                ${t.dueDate?`<span class="task-card-due ${dc}" style="font-size:11px">${smartDate(t.dueDate)}</span>`:''}
            </div>`;
        });
        html += '</div></div>';
    });
    html += '</div>';
    return html;
}

function statCard(label, value, sub, style='', onclick='') {
    const clickAttr = onclick ? `onclick="${onclick}" style="cursor:pointer"` : '';
    return `<div class="global-stat-card" ${clickAttr}>
        <span class="global-stat-label">${label}</span>
        <span class="global-stat-value" style="${style}">${value}</span>
        <span class="global-stat-sub">${sub}</span>
    </div>`;
}

// ========== PROJECT DETAIL ==========
function renderDetail() {
    const p = getProjects().find(pr => pr.id === state.currentProjectId);
    if (!p) return '';

    let html = '<div class="detail-view">';

    // ── Header progetto inline — compatto su mobile ──
    html += `<div style="padding:10px 16px 0;display:flex;align-items:center;gap:8px">`;
    html += `<button onclick="goGlobal()" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;font-family:var(--font);flex-shrink:0">&#8592;</button>`;
    html += `<div style="flex:1;min-width:0;overflow:hidden">`;
    html += `<div style="font-size:17px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)} <span class="status-badge status-${p.status||'draft'}" onclick="cycleProjectStatus('${p.id}')" style="font-size:10px;margin-left:4px;cursor:pointer">${(p.status||'draft').replace('-',' ')}</span></div>`;
    html += `</div>`;
    html += `<button class="add-btn" onclick="handleAdd()" style="flex-shrink:0;padding:6px 10px;font-size:13px">+ Task</button>`;
    html += `<button class="icon-btn" onclick="openProjectModal('${p.id}')" title="Impostazioni progetto" style="flex-shrink:0;width:30px;height:30px;font-size:13px">&#9881;</button>`;
    html += `</div>`;

    // Tabs
    html += '<div class="tabs-bar">';
    var _dtabs = isMobile() ? TABS_MOBILE : TABS;
    _dtabs.forEach((t,i) => {
        html += `<button class="tab-btn ${state.currentTab===i?'active':''}" onclick="setTab(${i})">${t}</button>`;
    });
    html += '</div>';

    // Filters (except for Dashboard and Calendar and Summary)
    if ([1,2,4,5].includes(state.currentTab)) {
        html += renderFilters(p);
    }

    html += '<div class="view-content">';
    switch(state.currentTab) {
        case 0: html += renderProjectDashboard(p); break;
        case 1: html += renderBoard(p); break;
        case 2: html += renderList(p); break;
        case 3: html += renderCalendar(p); break;
        case 4: html += renderPeople(p); break;
        case 5: html += renderMyTasks(p); break;
        case 6: html += renderSummary(p); break;
    }
    html += '</div></div>';
    return html;
}

function getFilteredTasks(p) {
    let tasks = [...(p.tasks||[])];
    const f = state.filters;
    if (f.search) {
        const s = f.search.toLowerCase();
        tasks = tasks.filter(t => t.title.toLowerCase().includes(s));
    }
    if (f.assignee) tasks = tasks.filter(t => t.assignee === f.assignee);
    if (f.status) tasks = tasks.filter(t => t.status === f.status);
    if (f.tags && f.tags.length > 0) {
        tasks = tasks.filter(t => f.tags.some(tag => (t.tags||[]).includes(tag)));
    }
    return tasks;
}

function hasActiveFilters() {
    const f = state.filters;
    return f.search || f.assignee || f.status || f.project || (f.tags && f.tags.length > 0);
}

function renderFilters(p) {
    const team = getTeam();
    const allTags = [...new Set((p.tasks||[]).flatMap(t => t.tags||[]))].sort();
    const active = hasActiveFilters();

    return `<div class="filters-bar">
        <input class="filter-input" type="text" placeholder="Cerca task..." value="${esc(state.filters.search)}" oninput="state.filters.search=this.value;render()">
        <select class="filter-select" onchange="state.filters.assignee=this.value;render()">
            <option value="">Tutti</option>
            ${team.map(m=>`<option value="${esc(m.name)}" ${state.filters.assignee===m.name?'selected':''}>${esc(m.name)}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="state.filters.status=this.value;render()">
            <option value="">Tutti gli stati</option>
            ${STATUS_LIST.map(s=>`<option value="${s}" ${state.filters.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="if(this.value){state.filters.tags=[this.value]}else{state.filters.tags=[]};render()">
            <option value="">Tutti i tag</option>
            ${allTags.map(t=>`<option value="${t}" ${state.filters.tags.includes(t)?'selected':''}>${t}</option>`).join('')}
        </select>
        <button class="filter-clear ${active?'visible':''}" onclick="state.filters={search:'',assignee:'',status:'',project:'',tags:[]};render()">Rimuovi filtri</button>
    </div>`;
}

// ===== VIEW 0: PROJECT DASHBOARD =====
function renderProjectDashboard(p) {
    const tasks = p.tasks || [];
    const todo = tasks.filter(t=>t.status==='todo').length;
    const inProgress = tasks.filter(t=>t.status==='in_progress').length;
    const blocked = tasks.filter(t=>t.status==='blocked').length;
    const done = tasks.filter(t=>t.status==='done').length;
    const total = tasks.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const todayStr = today();

    let html = '';

    // ── Stats a 2x2 griglia su mobile ──
    html += `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">`;
    html += `<div class="dash-stat-card" style="cursor:pointer;text-align:center;touch-action:manipulation" onclick="showTasksByStatus('${p.id}','todo')"><div class="dash-stat-value" style="color:var(--slate)">${todo}</div><div class="dash-stat-label">Da fare</div></div>`;
    html += `<div class="dash-stat-card" style="cursor:pointer;text-align:center;touch-action:manipulation" onclick="showTasksByStatus('${p.id}','in_progress')"><div class="dash-stat-value" style="color:var(--yellow)">${inProgress}</div><div class="dash-stat-label">In corso</div></div>`;
    html += `<div class="dash-stat-card" style="cursor:pointer;text-align:center;touch-action:manipulation" onclick="showTasksByStatus('${p.id}','blocked')"><div class="dash-stat-value" style="color:var(--red)">${blocked}</div><div class="dash-stat-label">Bloccate</div></div>`;
    html += `<div class="dash-stat-card" style="cursor:pointer;text-align:center;touch-action:manipulation" onclick="showTasksByStatus('${p.id}','done')"><div class="dash-stat-value" style="color:var(--green)">${done}</div><div class="dash-stat-label">Completate</div></div>`;
    html += `</div>`;

    // ── Progress bar multi-colore (stile CEO) ──
    html += `<div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:16px;display:flex">`;
    if (done > 0) html += `<div style="width:${done/total*100}%;background:var(--green);transition:width 0.3s"></div>`;
    if (inProgress > 0) html += `<div style="width:${inProgress/total*100}%;background:var(--yellow);transition:width 0.3s"></div>`;
    if (blocked > 0) html += `<div style="width:${blocked/total*100}%;background:var(--red);transition:width 0.3s"></div>`;
    if (todo > 0) html += `<div style="width:${todo/total*100}%;background:var(--border);transition:width 0.3s"></div>`;
    html += `</div>`;

    // ── Scadenza globale progetto ──
    if (p.launchDate) {
        const diff = daysDiff(p.launchDate);
        const urgent = diff <= 7 && diff >= 0;
        const overdue = diff < 0;
        const dateStr = new Date(p.launchDate+'T00:00:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const borderCol = overdue ? 'var(--red)' : urgent ? 'var(--accent)' : 'var(--border)';
        const bgCol = overdue ? 'var(--red-bg)' : urgent ? 'var(--accent-soft)' : 'var(--surface)';
        const labelCol = overdue ? 'var(--red)' : urgent ? 'var(--accent)' : 'var(--text-muted)';
        html += `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid ${borderCol};background:${bgCol};margin-bottom:16px;">
            <span style="font-size:22px;">${overdue ? '&#9888;' : '&#127937;'}</span>
            <div style="flex:1;">
                <div style="font-size:10px;font-weight:700;color:${labelCol};text-transform:uppercase;letter-spacing:0.5px;">Scadenza progetto</div>
                <div style="font-size:16px;font-weight:800;color:var(--text);">${dateStr}</div>
                <div style="font-size:12px;color:${labelCol};font-weight:600;">${overdue ? Math.abs(diff)+' giorni fa' : diff === 0 ? 'OGGI' : diff+' giorni rimasti'}</div>
            </div>
            <button onclick="openProjectModal('${p.id}')" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font);color:var(--text-secondary);transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">Modifica</button>
        </div>`;
    } else {
        html += `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px dashed var(--border);background:var(--surface);margin-bottom:16px;cursor:pointer;" onclick="openProjectModal('${p.id}')">
            <span style="font-size:20px;">&#128197;</span>
            <div>
                <div style="font-size:13px;font-weight:600;color:var(--text-muted);">Nessuna scadenza impostata</div>
                <div style="font-size:11px;color:var(--accent);font-weight:600;">Clicca per impostare &rarr;</div>
            </div>
        </div>`;
    }

    // ── Conversazione CEO-COO (se ci sono note) ──
    const pCooResps = p.cooProjectResponses || [];
    const pNotes = p.ceoProjectNotes || [];
    const pConvo = [];
    pNotes.forEach(n => { pConvo.push({ from: 'ceo', note: n.note, at: n.at }); });
    pCooResps.forEach(r => { pConvo.push({ from: 'coo', note: r.note, at: r.at }); });
    pConvo.sort((a, b) => new Date(a.at) - new Date(b.at));

    if (pConvo.length > 0 || pNotes.length > 0) {
        html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">`;
        html += `<div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px">&#128172; Note sul progetto</div>`;
        if (pConvo.length > 0) {
            html += `<div style="max-height:250px;overflow-y:auto;margin-bottom:10px">`;
            pConvo.forEach(msg => {
                const isCeo = msg.from === 'ceo';
                const msgDate = new Date(msg.at).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                const bgCol = isCeo ? 'var(--surface)' : 'var(--accent-soft,#FFF1ED)';
                const nameCol = isCeo ? 'var(--blue)' : 'var(--accent)';
                const name = isCeo ? 'Alberto' : 'Tu (COO)';
                html += `<div style="padding:8px 12px;background:${bgCol};border-radius:8px;margin-bottom:5px;font-size:13px">
                    <span style="font-weight:700;color:${nameCol}">${name}</span>
                    <span style="font-size:11px;color:var(--text-muted)"> &middot; ${msgDate}</span>
                    ${msg.note ? '<div style="color:var(--text-secondary);margin-top:3px;line-height:1.4">' + esc(msg.note) + '</div>' : ''}
                </div>`;
            });
            html += `</div>`;
        }
        html += `<div style="display:flex;gap:8px">`;
        html += `<input id="cooProjectNote_${p.id}" type="text" placeholder="Rispondi ad Alberto..." style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text)" onkeydown="if(event.key==='Enter')cooSendProjectNote('${p.id}')">`;
        html += `<button onclick="cooSendProjectNote('${p.id}')" style="padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap">Invia</button>`;
        html += `</div></div>`;
    }

    // ── Task raggruppate per status (stile CEO, con assignee, cliccabili) ──
    const statusOrder = ['blocked', 'in_progress', 'todo'];
    const statusStyles = {
        blocked: {label:'Bloccate', color:'var(--red)', bg:'var(--red-bg, #FEF2F2)'},
        in_progress: {label:'In Corso', color:'var(--yellow)', bg:'var(--yellow-bg, #FEFCE8)'},
        todo: {label:'Da Fare', color:'var(--slate)', bg:'var(--bg)'}
    };

    statusOrder.forEach(status => {
        const sTasks = tasks.filter(t => t.status === status);
        if (sTasks.length === 0) return;
        const style = statusStyles[status];

        html += `<div style="margin-bottom:16px">`;
        html += `<div style="font-size:13px;font-weight:700;color:${style.color};margin-bottom:8px;display:flex;align-items:center;gap:6px">`;
        html += `<span style="width:8px;height:8px;border-radius:50%;background:${style.color}"></span>`;
        html += `${style.label} (${sTasks.length})`;
        html += `</div>`;

        sTasks.forEach(t => {
            const isOverdue = t.dueDate && t.dueDate < todayStr;
            html += `<div style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:${style.bg};border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:border-color 0.15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px" onclick="openTaskModal('${t.id}','${p.id}')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">`;
            html += `<span style="font-size:14px;font-weight:600;color:var(--text);flex:1;min-width:0">${esc(t.title)}</span>`;
            if (t.assignee) html += `<span style="font-size:12px;color:var(--text-muted);flex-shrink:0;background:var(--surface);padding:2px 8px;border-radius:6px;border:1px solid var(--border)">${esc(t.assignee)}</span>`;
            if (t.dueDate) {
                const dc = dateClass(t.dueDate, t.status);
                html += `<span class="task-card-due ${dc}" style="font-size:12px;flex-shrink:0">${smartDate(t.dueDate)}</span>`;
            }
            html += `</div>`;
        });
        html += `</div>`;
    });

    // ── Completate — conteggio ──
    if (done > 0) {
        html += `<div style="margin-bottom:16px;padding:12px 14px;background:var(--green-bg, #F0FDF4);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:8px;cursor:pointer;touch-action:manipulation" onclick="showTasksByStatus('${p.id}','done')">`;
        html += `<span style="font-size:16px">&#9989;</span>`;
        html += `<span style="font-size:14px;font-weight:600;color:var(--green)">${done} task completate su ${total}</span>`;
        html += `<span style="font-size:11px;color:var(--text-muted);margin-left:auto">Vedi tutte &rarr;</span>`;
        html += `</div>`;
    }

    return html;
}

// ===== VIEW 1: BOARD (KANBAN) =====
function renderBoard(p) {
    const tasks = getFilteredTasks(p);

    let html = '<div class="kanban-board">';
    STATUS_LIST.forEach(status => {
        const colTasks = tasks.filter(t => t.status === status);
        const color = STATUS_COLORS[status];
        const label = STATUS_LABELS[status];

        html += `<div class="kanban-column" data-status="${status}">`;
        html += `<div class="kanban-col-header">
            <div class="kanban-col-top-border" style="background:${color}"></div>
            <div class="kanban-col-title">${label} <span class="kanban-col-count">${colTasks.length}</span></div>
        </div>`;
        html += `<div class="kanban-col-body" data-status="${status}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${p.id}','${status}')">`;

        if (colTasks.length === 0) {
            html += '<div class="kanban-empty">Trascina qui</div>';
        } else {
            colTasks.forEach(t => {
                html += renderTaskCard(t, p);
            });
        }
        html += '</div>';
        html += `<button class="kanban-add-btn" onclick="openTaskModal(null,'${p.id}',null,'${status}')">+ Task</button>`;
        html += '</div>';
    });
    html += '</div>';
    return html;
}

function renderTaskCard(t, p) {
    const m = getTeamMember(t.assignee);
    const dc = dateClass(t.dueDate, t.status);
    const isDone = t.status === 'done';
    const depWarning = (t.dependsOn||[]).length > 0;
    const commentCount = (t.comments||[]).length;
    const notePreview = (t.note||'').slice(0, 50);

    let html = `<div class="task-card ${isDone?'done-card':''}" draggable="true" ondragstart="onDragStart(event,'${t.id}')" data-task-id="${t.id}" onclick="openTaskModal('${t.id}','${p.id}')">`;
    html += `<div class="task-card-top">
        <span class="task-card-title">${esc(t.title)}</span>
        <span class="task-card-status-dot" style="background:${STATUS_COLORS[t.status]}" title="${STATUS_LABELS[t.status]}" onclick="event.stopPropagation();cycleTaskStatus('${t.id}','${p.id}')"></span>
    </div>`;
    html += '<div class="task-card-body">';

    // Tags
    if (t.tags && t.tags.length > 0) {
        html += '<div class="task-card-tags">';
        t.tags.slice(0,3).forEach(tag => {
            html += `<span class="task-tag">${esc(tag)}</span>`;
        });
        if (t.tags.length > 3) html += `<span class="task-tag">+${t.tags.length-3}</span>`;
        html += '</div>';
    }

    html += '<div class="task-card-meta">';
    if (t.assignee) {
        html += `<span class="task-card-assignee"><span class="avatar-xs" style="background:${m?m.color:'var(--slate)'}">${initials(t.assignee)}</span>${esc(t.assignee)}</span>`;
    }
    if (t.dueDate) html += `<span class="task-card-due ${dc}">${smartDate(t.dueDate)}</span>`;
    if (t.estimateHours) html += `<span class="task-card-estimate">${t.estimateHours}h</span>`;
    if (commentCount > 0) html += `<span class="task-card-comments">&#128172; ${commentCount}</span>`;
    html += '</div>';

    if (depWarning) html += `<div class="task-card-dep-warning">&#9888; Bloccata da ${t.dependsOn.length} task</div>`;
    if (notePreview) html += `<div class="task-card-note">${esc(notePreview)}${t.note.length>50?'...':''}</div>`;

    // nextCheck
    if (t.nextCheck) {
        const ncDiff = daysDiff(t.nextCheck);
        const ncClass = ncDiff < 0 ? 'overdue-check' : 'normal-check';
        html += `<span class="next-check-badge ${ncClass}">&#128203; ${smartDate(t.nextCheck)}</span>`;
    }
    // doneWhen (show only when done)
    if (isDone && t.doneWhen) {
        html += `<div class="done-when-badge">&#9989; ${esc(t.doneWhen)}</div>`;
    }
    // dependsLabel
    if (t.dependsLabel) {
        html += `<div class="depends-label-badge">&#9939;&#65039; ${esc(t.dependsLabel)}</div>`;
    }
    // Aging badge (in_progress + blocked)
    if (t.status === 'in_progress' || t.status === 'blocked') {
        const ageDays = Math.round((Date.now() - (t.createdAt || Date.now())) / 86400000);
        const label = t.status === 'blocked' ? 'bloccata' : 'in corso';
        if (ageDays > 10) {
            html += `<span class="aging-badge aging-critical">&#9200; ${ageDays}g ${label}</span>`;
        } else if (ageDays > 5) {
            html += `<span class="aging-badge aging-warn">&#9200; ${ageDays}g ${label}</span>`;
        }
    }

    // Indicatore "Alberto ha aggiornato" (CEO ha mandato update)
    if (t.ceoHasUpdate) {
        html += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:var(--blue-bg,#EFF6FF);border:1px solid var(--blue);border-radius:6px;font-size:11px;font-weight:700;color:var(--blue)">&#128172; Alberto ha risposto — richiede tua attenzione</div>`;
    }

    // Quick "Fatto" button
    if (!isDone) {
        html += `<button class="quick-done-btn" onclick="event.stopPropagation();changeTaskStatus('${t.id}','${p.id}','done')" title="Segna come completata">&#10003; Fatto</button>`;
    }

    html += '</div></div>';
    return html;
}

// ===== VIEW 2: LIST =====
function renderList(p) {
    let tasks = getFilteredTasks(p);
    // Sorting
    if (state.sort.column) {
        tasks.sort((a,b) => {
            let va = a[state.sort.column] || '';
            let vb = b[state.sort.column] || '';
            if (state.sort.column === 'status') { va = STATUS_LIST.indexOf(a.status); vb = STATUS_LIST.indexOf(b.status); }
            if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
            if (va < vb) return state.sort.dir === 'asc' ? -1 : 1;
            if (va > vb) return state.sort.dir === 'asc' ? 1 : -1;
            return 0;
        });
    }

    const sortArrow = (col) => {
        if (state.sort.column !== col) return '';
        return `<span class="sort-arrow">${state.sort.dir==='asc'?'&#9650;':'&#9660;'}</span>`;
    };

    let html = '<table class="list-table"><thead><tr>';
    html += `<th style="width:30px"></th>`;
    html += `<th onclick="toggleSort('title')">Titolo ${sortArrow('title')}</th>`;
    html += `<th onclick="toggleSort('assignee')">Assegnato ${sortArrow('assignee')}</th>`;
    html += `<th onclick="toggleSort('status')">Stato ${sortArrow('status')}</th>`;
    html += `<th onclick="toggleSort('dueDate')">Scadenza ${sortArrow('dueDate')}</th>`;
    html += '</tr></thead><tbody>';

    tasks.forEach(t => {
        const m = getTeamMember(t.assignee);
        const dc = dateClass(t.dueDate, t.status);
        html += `<tr onclick="openTaskModal('${t.id}','${p.id}')">`;
        html += `<td class="td-check"><input type="checkbox" onclick="event.stopPropagation()"></td>`;
        html += `<td data-label="Titolo" class="td-title" style="font-weight:600">${esc(t.title)}</td>`;
        html += `<td data-label="Assegnato" class="td-assignee">${t.assignee?`<span style="display:flex;align-items:center;gap:4px"><span class="avatar-xs" style="background:${m?m.color:'var(--slate)'}">${initials(t.assignee)}</span>${esc(t.assignee)}</span>`:''}</td>`;
        html += `<td data-label="Stato" class="td-status"><button class="status-chip status-chip-${t.status}" onclick="event.stopPropagation();cycleTaskStatus('${t.id}','${p.id}')">${STATUS_LABELS[t.status]}</button></td>`;
        html += `<td data-label="Scadenza" class="td-due"><span class="task-card-due ${dc}">${smartDate(t.dueDate)}</span></td>`;
        html += '</tr>';
    });

    html += '</tbody></table>';
    html += `<button class="list-add-row" onclick="openTaskModal(null,'${p.id}')">+ Nuova task</button>`;
    return html;
}

function toggleSort(col) {
    if (state.sort.column === col) {
        state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
        state.sort.column = col;
        state.sort.dir = 'asc';
    }
    render();
}

// ===== VIEW 3: CALENDAR =====
let calYear = Number(safeSessionGet('pb_calYear')) || null;
let calMonth = safeSessionGet('pb_calMonth') !== null ? Number(safeSessionGet('pb_calMonth')) : null;
let calMode = safeSessionGet('pb_calMode') || 'project';
let calView = safeSessionGet('pb_calView') || (isMobile() ? 'week' : 'month');
let calWeekDay = Number(safeSessionGet('pb_calWeekDay')) || null;

function getWeekStart(y, m, d) {
    const date = new Date(y, m, d);
    const dow = date.getDay();
    const diff = dow === 0 ? 6 : dow - 1;
    date.setDate(date.getDate() - diff);
    return date;
}

function calNavPrev() {
    if (calView === 'year') {
        calYear--;
    } else if (calView === 'week') {
        const ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        ws.setDate(ws.getDate() - 7);
        calYear = ws.getFullYear(); calMonth = ws.getMonth(); calWeekDay = ws.getDate();
    } else {
        calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
    }
}

function calNavNext() {
    if (calView === 'year') {
        calYear++;
    } else if (calView === 'week') {
        const ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        ws.setDate(ws.getDate() + 7);
        calYear = ws.getFullYear(); calMonth = ws.getMonth(); calWeekDay = ws.getDate();
    } else {
        calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
    }
}

function renderCalendar(p) {
    const now = new Date();
    if (!calYear) { calYear = now.getFullYear(); calMonth = now.getMonth(); }

    const tasks = (p.tasks||[]).filter(t => t.dueDate);
    const tasksByDate = {};
    tasks.forEach(t => { if (!tasksByDate[t.dueDate]) tasksByDate[t.dueDate] = []; tasksByDate[t.dueDate].push(t); });

    const firstDay = new Date(calYear, calMonth, 1);
    const lastDay = new Date(calYear, calMonth + 1, 0);
    let startDay = firstDay.getDay(); // 0=Sun
    startDay = startDay === 0 ? 6 : startDay - 1; // Mon=0

    const monthName = firstDay.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
    const todayStr = today();

    // Nav label depends on view
    let navLabel = '';
    if (calView === 'year') {
        navLabel = String(calYear);
    } else if (calView === 'week') {
        const ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        const we = new Date(ws); we.setDate(we.getDate() + 6);
        navLabel = ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'}) + ' \u2014 ' + we.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    } else {
        navLabel = monthName.charAt(0).toUpperCase()+monthName.slice(1);
    }

    let html = `<div class="calendar-nav">
        <button class="calendar-nav-btn" onclick="calNavPrev();render()">&#8249;</button>
        <span class="calendar-month-label">${navLabel}</span>
        <button class="calendar-nav-btn" onclick="calNavNext();render()">&#8250;</button>
        <div class="cal-mode-toggle">
            <button class="cal-mode-btn ${calView==='week'?'active':''}" onclick="calView='week';render()">Settimana</button>
            <button class="cal-mode-btn ${calView==='month'?'active':''}" onclick="calView='month';render()">Mese</button>
            <button class="cal-mode-btn ${calView==='year'?'active':''}" onclick="calView='year';render()">Anno</button>
        </div>
    </div>`;

    if (calView === 'month') {
        // ── Month grid (rolling: parte da max 7gg fa per il mese corrente) ──
        const isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth();
        let gridStartDate;
        if (isCurrentMonth) {
            const sevenAgo = new Date(now); sevenAgo.setDate(now.getDate() - 7);
            const dow = sevenAgo.getDay();
            const mondayOffset = dow === 0 ? 6 : dow - 1;
            sevenAgo.setDate(sevenAgo.getDate() - mondayOffset);
            gridStartDate = sevenAgo;
        } else {
            const fd = new Date(calYear, calMonth, 1);
            const dow = fd.getDay();
            const mondayOffset = dow === 0 ? 6 : dow - 1;
            fd.setDate(fd.getDate() - mondayOffset);
            gridStartDate = fd;
        }
        const gridEndBase = new Date(calYear, calMonth + 1, 0);
        const geDow = gridEndBase.getDay();
        const fillDays = geDow === 0 ? 0 : 7 - geDow;
        const gridEndDate = new Date(gridEndBase); gridEndDate.setDate(gridEndBase.getDate() + fillDays);

        html += '<div class="calendar-grid">';
        ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d => {
            html += `<div class="calendar-day-header">${d}</div>`;
        });

        const cursor = new Date(gridStartDate);
        while (cursor <= gridEndDate) {
            const cy = cursor.getFullYear();
            const cm = cursor.getMonth();
            const cd = cursor.getDate();
            const dateStr = `${cy}-${String(cm+1).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;
            const isToday = dateStr === todayStr;
            const isOther = cm !== calMonth;
            const dayTasks = tasksByDate[dateStr] || [];
            html += `<div class="calendar-day ${isToday?'today':''} ${isOther?'other-month':''}">`;
            html += `<span class="calendar-day-num">${cd}</span>`;
            if (!isOther) {
                dayTasks.slice(0,3).forEach(t => {
                    const bgColor = t.priority === 'p0' ? 'var(--red-bg)' : t.priority === 'p1' ? 'var(--orange-bg)' : t.priority === 'p2' ? 'var(--yellow-bg)' : 'var(--slate-bg)';
                    const textColor = t.priority === 'p0' ? 'var(--red)' : t.priority === 'p1' ? 'var(--orange)' : t.priority === 'p2' ? 'var(--yellow)' : 'var(--slate)';
                    html += `<div class="calendar-task-pill" style="background:${bgColor};color:${textColor}" onclick="openTaskModal('${t.id}','${p.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`;
                });
                if (dayTasks.length > 3) html += `<span style="font-size:10px;color:var(--text-muted)">+${dayTasks.length-3} altre</span>`;
            }
            html += '</div>';
            cursor.setDate(cd + 1);
        }
        html += '</div>';

    } else if (calView === 'week') {
        // ── Week view: vista operativa progetto ──
        const ws = getWeekStart(calYear, calMonth, calWeekDay || new Date().getDate());
        const dayNames = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
        html += '<div class="cal-week-grid">';
        for (let i = 0; i < 7; i++) {
            const wd = new Date(ws); wd.setDate(wd.getDate() + i);
            const ds = `${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,'0')}-${String(wd.getDate()).padStart(2,'0')}`;
            const wdTasks = tasksByDate[ds] || [];
            const isToday = ds === todayStr;
            const isWeekend = wd.getDay() === 0 || wd.getDay() === 6;

            html += `<div class="cal-week-day ${isToday?'today':''} ${isWeekend?'weekend':''}">`;
            html += `<div class="cal-week-day-header">
                <span class="cal-week-day-name">${dayNames[wd.getDay()]}</span>
                <span class="cal-week-day-num ${isToday?'today':''}">${wd.getDate()}</span>
                ${wdTasks.length > 0 ? `<span class="cal-week-day-count">${wdTasks.length}</span>` : ''}
            </div>`;

            html += '<div class="cal-week-tasks">';
            const sorted = [...wdTasks].sort((a,b) => {
                const ord = {blocked:0, in_progress:1, todo:2, done:3};
                return (ord[a.status]||9) - (ord[b.status]||9);
            });
            sorted.forEach(t => {
                const m = getTeamMember(t.assignee);
                html += `<div class="cal-week-task-card" onclick="openTaskModal('${t.id}','${p.id}')">
                    <span class="cal-week-status-dot" style="background:${STATUS_COLORS[t.status]}"></span>
                    <div class="cal-week-task-info">
                        <div class="cal-week-task-title">${esc(t.title)}</div>
                        <div class="cal-week-task-meta">
                            ${t.assignee ? `<span class="avatar-xs" style="background:${m?m.color:'var(--slate)'}">${initials(t.assignee)}</span>` : ''}
                            <span>${esc(t.assignee||'')}</span>
                        </div>
                    </div>
                </div>`;
            });
            if (wdTasks.length === 0) html += '<div style="font-size:11px;color:var(--text-muted);padding:16px 4px;text-align:center;">Nessuna task</div>';
            html += '</div></div>';
        }
        html += '</div>';

    } else if (calView === 'year') {
        // ── Year view: panoramica annuale progetto (dal mese corrente) ──
        const monthAgg = Array.from({length:12}, () => ({ total:0, done:0, blocked:0, inProgress:0, tasks:[] }));
        tasks.forEach(t => {
            const d = new Date(t.dueDate + 'T00:00:00');
            if (d.getFullYear() === calYear) {
                const mi = d.getMonth();
                monthAgg[mi].total++;
                if (t.status === 'done') monthAgg[mi].done++;
                if (t.status === 'blocked') monthAgg[mi].blocked++;
                if (t.status === 'in_progress') monthAgg[mi].inProgress++;
                monthAgg[mi].tasks.push(t);
            }
        });
        const hasLaunch = p.launchDate && new Date(p.launchDate+'T00:00:00').getFullYear() === calYear;
        const launchMonth = hasLaunch ? new Date(p.launchDate+'T00:00:00').getMonth() : -1;

        // Dal mese corrente in poi
        const pCurM = new Date().getMonth();
        const pCurY = new Date().getFullYear();
        const pDisplayMonths = [];
        for (let i = 0; i < 12; i++) {
            const mi = (pCurM + i) % 12;
            const yi = pCurY + Math.floor((pCurM + i) / 12);
            if (yi === calYear) pDisplayMonths.push(mi);
        }

        html += '<div class="cal-year-grid">';
        pDisplayMonths.forEach(m => {
            const mName = new Date(calYear, m, 1).toLocaleDateString('it-IT', { month: 'long' });
            const isCur = m === new Date().getMonth() && calYear === new Date().getFullYear();
            const agg = monthAgg[m];
            const pct = agg.total > 0 ? Math.round(agg.done / agg.total * 100) : 0;

            html += `<div class="cal-year-month ${isCur?'current':''}" onclick="calMonth=${m};calView='month';render()">`;
            html += `<div class="cal-year-month-name">${mName.charAt(0).toUpperCase()+mName.slice(1)}</div>`;

            if (m === launchMonth) {
                html += `<div class="cal-year-launch-badge">&#127937; LANCIO — ${new Date(p.launchDate+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</div>`;
            }

            if (agg.total > 0) {
                html += '<div class="cal-year-month-stats">';
                html += `<div class="cal-year-progress"><div class="cal-year-progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':'var(--accent)'}"></div></div>`;
                html += `<div class="cal-year-stat-row"><span style="font-weight:700;color:var(--text)">${agg.total} task</span><span style="color:var(--green);font-weight:600">${agg.done} &#10003;</span><span style="color:var(--text-muted)">${pct}%</span></div>`;
                html += '</div>';

                // Lista task chiave (non-done, max 5)
                const keyTasks = agg.tasks.filter(t => t.status !== 'done').sort((a,b) => {
                    const ord = {blocked:0, in_progress:1, todo:2};
                    return (ord[a.status]||9) - (ord[b.status]||9);
                }).slice(0, 5);
                if (keyTasks.length > 0) {
                    html += '<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;">';
                    keyTasks.forEach(t => {
                        const m2 = getTeamMember(t.assignee);
                        html += `<div style="display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0;cursor:pointer;" onclick="event.stopPropagation();openTaskModal('${t.id}','${p.id}')">
                            <span style="width:6px;height:6px;border-radius:50%;background:${STATUS_COLORS[t.status]};flex-shrink:0;"></span>
                            <span style="flex:1;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.title)}</span>
                            ${t.assignee ? `<span class="avatar-xs" style="background:${m2?m2.color:'var(--slate)'}; width:16px;height:16px;font-size:8px;">${initials(t.assignee)}</span>` : ''}
                        </div>`;
                    });
                    const remaining = agg.tasks.filter(t => t.status !== 'done').length - keyTasks.length;
                    if (remaining > 0) html += `<div style="font-size:10px;color:var(--text-muted);">+${remaining} altre</div>`;
                    html += '</div>';
                }
            } else {
                html += '<div style="font-size:11px;color:var(--text-muted);padding:12px 0;text-align:center;">Nessuna attivit&agrave;</div>';
            }

            html += '</div>';
        });
        html += '</div>';
    }

    return html;
}

// ===== VIEW 5: MY TASKS =====
function renderMyTasks(p) {
    const tasks = getFilteredTasks(p).filter(t => t.assignee === 'Mattia');
    const todayStr = today();
    const sow = startOfWeek(new Date());
    const eow = endOfWeek(new Date());

    const groups = {
        overdue: tasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0),
        today: tasks.filter(t => t.status !== 'done' && t.dueDate === todayStr),
        week: tasks.filter(t => t.status !== 'done' && t.dueDate && new Date(t.dueDate) > new Date(todayStr) && new Date(t.dueDate) <= eow),
        next: tasks.filter(t => t.status !== 'done' && t.dueDate && new Date(t.dueDate) > eow),
        noDue: tasks.filter(t => t.status !== 'done' && !t.dueDate),
    };

    const groupConfig = [
        { key: 'overdue', label: 'Scadute', color: 'var(--red)' },
        { key: 'today', label: 'Oggi', color: 'var(--orange)' },
        { key: 'week', label: 'Questa settimana', color: 'var(--blue)' },
        { key: 'next', label: 'Prossime', color: 'var(--text-secondary)' },
        { key: 'noDue', label: 'Senza scadenza', color: 'var(--text-muted)' },
    ];

    let html = '<div class="my-tasks-view">';
    groupConfig.forEach(g => {
        const items = groups[g.key];
        if (items.length === 0) return;
        html += `<div class="my-tasks-group">
            <div class="my-tasks-group-title" style="color:${g.color}">${g.label} <span class="kanban-col-count">${items.length}</span></div>`;
        items.forEach(t => {
            html += `<div class="my-task-item ${g.key==='overdue'?'overdue-item':''}" onclick="openTaskModal('${t.id}','${p.id}')">

    return html;

    const statusCounts = {};
    STATUS_LIST.forEach(s => statusCounts[s] = tasks.filter(t=>t.status===s).length);

    const donutData = STATUS_LIST.map(s => ({ status: s, count: statusCounts[s], pct: statusCounts[s]/total }));
    let donutSVG = buildDonut(donutData, total);

    // Velocity
    const now = Date.now();
    const thisWeekDone = tasks.filter(t => t.completedAt && (now - t.completedAt) < 7*86400000).length;
    const lastWeekDone = tasks.filter(t => t.completedAt && (now - t.completedAt) >= 7*86400000 && (now - t.completedAt) < 14*86400000).length;

    // Team workload
    const team = getTeam();

    // Next deadlines
    const nextDue = tasks.filter(t=>t.status!=='done'&&t.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,10);

    // Blocked
    const blocked = tasks.filter(t=>t.status==='blocked');

    let html = '<div class="summary-grid">';

    // Donut
    html += `<div class="summary-card">
        <div class="summary-card-title">Distribuzione task</div>
        <div class="donut-chart">${donutSVG}
            <div class="donut-legend">
                ${STATUS_LIST.map(s=>`<div class="donut-legend-item">
                    <span class="donut-legend-dot" style="background:${STATUS_COLORS[s]}"></span>
                    <span>${STATUS_LABELS[s]}: ${statusCounts[s]}</span>
                </div>`).join('')}
            </div>
        </div>
    </div>`;

    // Velocity
    html += `<div class="summary-card">
        <div class="summary-card-title">Velocita</div>
        <div class="speed-row"><span class="speed-label">Ultimi 7 giorni</span><span class="speed-value" style="color:var(--green)">${thisWeekDone} task completate</span></div>
        <div class="speed-row"><span class="speed-label">7 giorni precedenti</span><span class="speed-value">${lastWeekDone} task completate</span></div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">
            ${thisWeekDone > lastWeekDone ? 'Trend positivo' : thisWeekDone < lastWeekDone ? 'Rallentamento rispetto alla settimana scorsa' : 'Ritmo costante'}
        </div>
    </div>`;

    // Team task counts
    html += `<div class="summary-card">
        <div class="summary-card-title">Task per persona</div>
        <div style="display:flex;flex-direction:column;gap:8px">`;
    team.forEach(m => {
        const memberActive = tasks.filter(t=>t.assignee===m.name&&t.status!=='done').length;
        const memberBlocked = tasks.filter(t=>t.assignee===m.name&&t.status==='blocked').length;
        const memberDone = tasks.filter(t=>t.assignee===m.name&&t.status==='done').length;
        if (memberActive === 0 && memberDone === 0) return;
        html += `<div style="display:flex;align-items:center;gap:10px;padding:4px 0">
            <span class="avatar-xs" style="background:${m.color}">${initials(m.name)}</span>
            <span style="flex:1;font-size:12px;font-weight:600;color:${m.color}">${esc(m.name)}</span>
            <span style="font-size:12px;font-weight:700">${memberActive} attive</span>
            ${memberBlocked > 0 ? `<span style="font-size:11px;color:var(--red);font-weight:600">${memberBlocked} bloccate</span>` : ''}
            <span style="font-size:11px;color:var(--green)">${memberDone} fatte</span>
        </div>`;

    html += `<div class="summary-card">

    nextDue.forEach(t => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div class="dash-list-item" onclick="openTaskModal('${t.id}','${p.id}')" style="padding:6px 8px">
            <span style="flex:1;font-size:12px;font-weight:600">${esc(t.title)}</span>
            <span class="task-card-due ${dc}" style="font-size:11px">${smartDate(t.dueDate)}</span>

    // Blocked / decisions
    if (blocked.length > 0) {
        html += `<div class="summary-card" style="grid-column:1/-1">
            <div class="summary-card-title" style="color:var(--red)">Decisioni da prendere</div>
