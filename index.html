// ========== CALENDARIO GANTT LANCI ==========
function renderLaunchCalendar(allLaunches, editable) {
    if (allLaunches.length === 0) return '';

    var brandOrder = ['ADT', 'USR', 'GTF', 'ADM'];
    var brandHex = { ADT: '#DC2626', USR: '#CA8A04', GTF: '#38BDF8', ADM: '#7C3AED' };
    var brandBgHex = { ADT: '#FEF2F2', USR: '#FEFCE8', GTF: '#F0F9FF', ADM: '#F5F3FF' };
    var darkBrandBg = { ADT: '#1A0A0A', USR: '#1A1608', GTF: '#0A1420', ADM: '#120A1A' };

    // Date range
    var allDates = [];
    allLaunches.forEach(function(l) {
        if (l.startDate) allDates.push(l.startDate);
        if (l.endDate) allDates.push(l.endDate);
    });
    allDates.sort();

    var startD = new Date(allDates[0] + 'T00:00:00');
    var endD = new Date(allDates[allDates.length - 1] + 'T00:00:00');
    // Pad: start from Monday before, end at least 2 weeks after last date (+ to Sunday)
    var dayOff = startD.getDay() === 0 ? 6 : startD.getDay() - 1;
    startD.setDate(startD.getDate() - dayOff);
    endD.setDate(endD.getDate() + 14); // +2 settimane di visibilità extra
    var dayEnd = endD.getDay() === 0 ? 0 : 7 - endD.getDay();
    endD.setDate(endD.getDate() + dayEnd);

    var days = [];
    var d = new Date(startD);
    while (d <= endD) {
        days.push(d.toISOString().split('T')[0]);
        d.setDate(d.getDate() + 1);
    }

    var todayStr = today();
    var dayW = 38;
    var labelW = 54;
    var totalW = labelW + days.length * dayW;
    var isDark = document.body.classList.contains('dark');

    // Store for drag logic
    if (editable) {
        window._ganttDays = days;
        window._ganttDayW = dayW;
        window._ganttLabelW = labelW;
    }

    // Group by brand
    var grouped = {};
    allLaunches.forEach(function(l) {
        var b = l.brand || 'Altro';
        if (!grouped[b]) grouped[b] = [];
        grouped[b].push(l);
    });
    // Mostra TUTTI i brand sempre, anche se vuoti
    var brandKeys = brandOrder.slice();
    Object.keys(grouped).forEach(function(b) { if (brandKeys.indexOf(b) === -1) brandKeys.push(b); });
    brandKeys.forEach(function(b) {
        if (!grouped[b]) grouped[b] = [];
        grouped[b].sort(function(a, c) { return (a.startDate || '').localeCompare(c.startDate || ''); });
    });

    // Count total rows for today line height
    var totalRows = 0;
    brandKeys.forEach(function(b) { totalRows += grouped[b].length; });

    var rowH = 34;
    var headerH = 36;
    var brandGap = 6;
    var bodyH = totalRows * rowH + (brandKeys.length - 1) * brandGap;

    var html = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">';
    html += '<div style="position:relative;min-width:' + totalW + 'px">';

    // ---- HEADER: day numbers ----
    html += '<div style="display:flex;border-bottom:1px solid var(--border)">';
    html += '<div style="width:' + labelW + 'px;flex-shrink:0"></div>';
    var prevMonth = '';
    days.forEach(function(dayStr) {
        var dd = new Date(dayStr + 'T00:00:00');
        var dayNum = dd.getDate();
        var isT = dayStr === todayStr;
        var isWe = dd.getDay() === 0 || dd.getDay() === 6;
        var mon = dd.toLocaleDateString('it-IT', { month: 'short' }).toUpperCase();
        var showMon = mon !== prevMonth;
        if (showMon) prevMonth = mon;

        html += '<div style="width:' + dayW + 'px;flex-shrink:0;text-align:center;padding:4px 0;font-size:10px;line-height:1.2;';
        if (isT) html += 'font-weight:800;color:var(--accent);background:var(--accent-soft);';
        else if (isWe) html += 'color:var(--text-muted);opacity:0.5;';
        else html += 'color:var(--text-muted);';
        html += '">';
        if (showMon) html += '<div style="font-size:8px;font-weight:800;letter-spacing:0.5px;color:var(--text-secondary)">' + mon + '</div>';
        else html += '<div style="height:10px"></div>';
        html += dayNum;
        html += '</div>';
    });
    html += '</div>';

    // ---- BODY: bars ----
    html += '<div style="position:relative">';

    // Today vertical line
    var todayIdx = days.indexOf(todayStr);
    if (todayIdx >= 0) {
        var todayX = labelW + todayIdx * dayW + dayW / 2;
        html += '<div style="position:absolute;left:' + todayX + 'px;top:0;bottom:0;width:2px;background:var(--accent);opacity:0.4;z-index:0;pointer-events:none"></div>';
    }

    brandKeys.forEach(function(brand, bi) {
        var bColor = brandHex[brand] || '#78716C';
        var bBg = isDark ? (darkBrandBg[brand] || '#141414') : (brandBgHex[brand] || '#F5F5F4');
        var bLaunches = grouped[brand];

        // Packing: metti lanci non sovrapposti sulla stessa riga
        var rows = []; // array di array di launches
        bLaunches.forEach(function(l) {
            var si = days.indexOf(l.startDate); if (si < 0) si = 0;
            var ei = days.indexOf(l.endDate); if (ei < 0) ei = days.length - 1;
            var placed = false;
            for (var r = 0; r < rows.length; r++) {
                var lastInRow = rows[r][rows[r].length - 1];
                var lastEi = days.indexOf(lastInRow.endDate); if (lastEi < 0) lastEi = days.length - 1;
                if (si > lastEi + 1) { // +1 = almeno 1 giorno di gap
                    rows[r].push(l);
                    placed = true;
                    break;
                }
            }
            if (!placed) rows.push([l]);
        });

        // Se il brand non ha lanci, mostra una riga vuota
        if (rows.length === 0) rows.push([]);

        rows.forEach(function(rowLaunches, ri) {
            html += '<div class="gantt-row" data-brand="' + esc(brand) + '" style="display:flex;height:' + rowH + 'px;align-items:center;position:relative">';

            // Brand label solo sulla prima riga
            if (ri === 0) {
                html += '<div style="width:' + labelW + 'px;flex-shrink:0;font-size:11px;font-weight:800;color:' + bColor + ';padding:0 6px;text-align:right;white-space:nowrap;opacity:' + (rowLaunches.length === 0 ? '0.4' : '1') + '">' + esc(brand) + '</div>';
            } else {
                html += '<div style="width:' + labelW + 'px;flex-shrink:0"></div>';
            }

            // Bar area — contiene tutte le barre di questa riga
            html += '<div style="flex:1;position:relative;height:100%">';

            // Weekend shading (una volta per riga)
            if (ri === 0) {
                days.forEach(function(dayStr, di) {
                    var wd = new Date(dayStr + 'T00:00:00').getDay();
                    if (wd === 0 || wd === 6) {
                        html += '<div style="position:absolute;left:' + (di * dayW) + 'px;top:0;width:' + dayW + 'px;height:100%;background:var(--bg);opacity:0.5;pointer-events:none"></div>';
                    }
                });
            }

            // Render each bar in this row
            rowLaunches.forEach(function(l) {
                var si = days.indexOf(l.startDate); if (si < 0) si = 0;
                var ei = days.indexOf(l.endDate); if (ei < 0) ei = days.length - 1;

                var barL = si * dayW + 2;
                var barW = (ei - si + 1) * dayW - 4;

                var st = getLaunchStatus(l);
                var isLive = st === 'live';
                var borderStyle = isLive ? '2px solid ' + bColor : '1px solid ' + bColor + '80';
                var cursor = editable ? 'cursor:grab;' : 'pointer-events:none;';
                var cleanName = l.name;

                html += '<div class="gantt-bar" data-launch-id="' + l.id + '" style="position:absolute;left:' + barL + 'px;width:' + barW + 'px;top:5px;bottom:5px;background:' + bBg + ';border:' + borderStyle + ';border-radius:6px;display:flex;align-items:center;overflow:hidden;z-index:1;' + cursor + 'user-select:none;touch-action:none">';
                if (editable) html += '<div class="gantt-handle gantt-handle-l" style="position:absolute;left:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;border-radius:6px 0 0 6px" data-side="left"></div>';
                html += '<div style="flex:1;display:flex;align-items:center;gap:4px;padding:0 10px;overflow:hidden;min-width:0">';
                html += '<span style="font-size:11px;font-weight:700;color:' + bColor + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">' + esc(cleanName) + '</span>';
                if (isLive) html += '<span style="font-size:8px;font-weight:800;color:#fff;background:' + bColor + ';border-radius:3px;padding:1px 5px;flex-shrink:0">LIVE</span>';
                html += '</div>';
                if (editable) html += '<div class="gantt-handle gantt-handle-r" style="position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;border-radius:0 6px 6px 0" data-side="right"></div>';
                html += '</div>';
            });

            html += '</div>'; // close bar area
            html += '</div>'; // close row
        });

        // Brand separator
        if (bi < brandKeys.length - 1) {
            html += '<div style="height:1px;background:var(--border-light);margin:' + (brandGap / 2) + 'px ' + labelW + 'px"></div>';
        }
    });

    html += '</div>'; // close body
    html += '</div></div>'; // close containers
    return html;
}

// ========== GANTT DRAG & RESIZE ==========
(function() {
    var _drag = null;

    function findBrandAtY(y) {
        var rows = document.querySelectorAll('.gantt-row[data-brand]');
        var best = null, bestDist = 99999;
        rows.forEach(function(row) {
            var rect = row.getBoundingClientRect();
            var mid = rect.top + rect.height / 2;
            var dist = Math.abs(y - mid);
            if (dist < bestDist) { bestDist = dist; best = row.getAttribute('data-brand'); }
        });
        return best;
    }

    function ganttPointerDown(e) {
        var handle = e.target.closest('.gantt-handle');
        var bar = e.target.closest('.gantt-bar');
        if (!bar) return;
        var launchId = bar.getAttribute('data-launch-id');
        if (!launchId) return;

        var mode = 'move';
        if (handle) {
            mode = handle.getAttribute('data-side') === 'left' ? 'left' : 'right';
        }

        var dayW = window._ganttDayW || 38;
        var days = window._ganttDays || [];
        var launches = getLaunches();
        var launch = launches.find(function(l) { return l.id === launchId; });
        if (!launch) return;

        var si = days.indexOf(launch.startDate);
        var ei = days.indexOf(launch.endDate);
        if (si < 0) si = 0;
        if (ei < 0) ei = days.length - 1;

        e.preventDefault();
        bar.setPointerCapture(e.pointerId);
        bar.style.opacity = '0.85';
        bar.style.zIndex = '10';
        if (mode === 'move') bar.style.cursor = 'grabbing';

        _drag = {
            bar: bar,
            launchId: launchId,
            mode: mode,
            startX: e.clientX,
            startY: e.clientY,
            origLeft: parseFloat(bar.style.left),
            origWidth: parseFloat(bar.style.width),
            startSi: si,
            startEi: ei,
            startBrand: launch.brand || '',
            dayW: dayW,
            days: days,
            _newBrand: null
        };
    }

    function ganttPointerMove(e) {
        if (!_drag) return;
        var dx = e.clientX - _drag.startX;
        var dayShift = Math.round(dx / _drag.dayW);

        if (_drag.mode === 'move') {
            var newSi = _drag.startSi + dayShift;
            var newEi = _drag.startEi + dayShift;
            if (newSi < 0) { newEi -= newSi; newSi = 0; }
            if (newEi >= _drag.days.length) { newSi -= (newEi - _drag.days.length + 1); newEi = _drag.days.length - 1; }
            _drag.bar.style.left = (newSi * _drag.dayW + 2) + 'px';
            _drag._newSi = newSi;
            _drag._newEi = newEi;

            // Vertical: check brand under pointer
            var brandUnder = findBrandAtY(e.clientY);
            _drag._newBrand = brandUnder;
            // Visual feedback: dim if changing brand
            if (brandUnder && brandUnder !== _drag.startBrand) {
                _drag.bar.style.outline = '2px dashed rgba(0,0,0,0.3)';
                _drag.bar.style.outlineOffset = '2px';
            } else {
                _drag.bar.style.outline = '';
                _drag.bar.style.outlineOffset = '';
            }
        } else if (_drag.mode === 'left') {
            var newSi = _drag.startSi + dayShift;
            if (newSi < 0) newSi = 0;
            if (newSi > _drag.startEi) newSi = _drag.startEi;
            _drag.bar.style.left = (newSi * _drag.dayW + 2) + 'px';
            _drag.bar.style.width = ((_drag.startEi - newSi + 1) * _drag.dayW - 4) + 'px';
            _drag._newSi = newSi;
            _drag._newEi = _drag.startEi;
        } else if (_drag.mode === 'right') {
            var newEi = _drag.startEi + dayShift;
            if (newEi >= _drag.days.length) newEi = _drag.days.length - 1;
            if (newEi < _drag.startSi) newEi = _drag.startSi;
            _drag.bar.style.width = ((newEi - _drag.startSi + 1) * _drag.dayW - 4) + 'px';
            _drag._newSi = _drag.startSi;
            _drag._newEi = newEi;
        }
    }

    function ganttPointerUp(e) {
        if (!_drag) return;
        _drag.bar.style.opacity = '';
        _drag.bar.style.zIndex = '';
        _drag.bar.style.cursor = '';
        _drag.bar.style.outline = '';
        _drag.bar.style.outlineOffset = '';

        var newSi = _drag._newSi;
        var newEi = _drag._newEi;
        var newBrand = _drag._newBrand;
        var datesChanged = (newSi !== undefined && newEi !== undefined) && (newSi !== _drag.startSi || newEi !== _drag.startEi);
        var brandChanged = newBrand && newBrand !== _drag.startBrand;

        if (datesChanged || brandChanged) {
            var launches = getLaunches();
            var idx = launches.findIndex(function(l) { return l.id === _drag.launchId; });
            if (idx >= 0) {
                if (datesChanged && _drag.days[newSi] && _drag.days[newEi]) {
                    launches[idx].startDate = _drag.days[newSi];
                    launches[idx].endDate = _drag.days[newEi];
                }
                if (brandChanged) {
                    launches[idx].brand = newBrand;
                }
                saveLaunches(launches);
                _autoPublishForCEO();
                render();
            }
        } else if (_drag.mode === 'move' && Math.abs(e.clientX - _drag.startX) < 5 && Math.abs(e.clientY - _drag.startY) < 5) {
            openLaunchModal(_drag.launchId);
        }

        _drag = null;
    }

    document.addEventListener('pointerdown', function(e) {
        if (CEO_MODE || _ceoPreview) return; // CEO: no drag/resize
        if (e.target.closest('.gantt-bar') || e.target.closest('.gantt-handle')) ganttPointerDown(e);
    });
    document.addEventListener('pointermove', ganttPointerMove);
    document.addEventListener('pointerup', ganttPointerUp);
})();

function _loadAppData(callback) {
    var token = getGHToken();
    if (!token) {
        // Nessun token: carica da cache locale se esiste
        _loadFromCache();
        if (callback) callback();
        return;
    }
    _ghFetchJSON(GH_COO_FILE, token).then(function(data) {
        if (data) {
            if (data.projects) _appData.projects = data.projects;
            if (data.team && data.team.length > 0) _appData.team = data.team;
            if (data.launches) _appData.launches = data.launches;
            if (data.ceoLinks) _appData.ceoLinks = data.ceoLinks;
            if (data.resources) _appData.resources = data.resources;
            _appData._loaded = true;
            // Aggiorna cache locale
            safeSetItem('pb_cache', JSON.stringify(data));
        } else {
            _loadFromCache();
        }
        if (callback) callback();
    }).catch(function() {
        // Offline: usa cache locale
        _loadFromCache();
        if (callback) callback();
    });
}

function _loadFromCache() {
    try {
        var cached = JSON.parse(safeGetItem('pb_cache') || 'null');
        if (cached) {
            if (cached.projects) _appData.projects = cached.projects;
            if (cached.team && cached.team.length > 0) _appData.team = cached.team;
            if (cached.launches) _appData.launches = cached.launches;
            if (cached.ceoLinks) _appData.ceoLinks = cached.ceoLinks;
            if (cached.resources) _appData.resources = cached.resources;
        }
    } catch(e) {}
}

// Vista inline task CEO (mobile)
function _renderCeoTaskInline(taskId, projectId) {
    var projects = getProjects();
    var p = projects.find(function(pr) { return pr.id === projectId; });
    if (!p) return renderCEOHome();
    var t = (p.tasks || []).find(function(tk) { return tk.id === taskId; });
    if (!t) return renderCEOHome();

    var isBlocked = t.status === 'blocked';
    var isOverdue = t.dueDate && t.dueDate < today();
    var isDueToday = t.dueDate && t.dueDate === today();
    var hasCeoNote = t.ceoNote && t.ceoNote.trim();
    var statusColor = isBlocked ? 'var(--red)' : t.status === 'ceo_done' ? 'var(--green)' : isOverdue ? 'var(--red)' : isDueToday ? 'var(--orange)' : 'var(--blue)';
    var statusLabel = isBlocked ? 'BLOCCATA' : t.status === 'ceo_done' ? 'COMPLETATA (in attesa conferma)' : isOverdue ? 'IN RITARDO' : isDueToday ? 'SCADE OGGI' : t.status === 'in_progress' ? 'IN CORSO' : 'DA FARE';

    var html = '<div class="ceo-container">';
    html += '<button onclick="ceoGoHome()" style="background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:0;font-family:var(--font);margin-bottom:16px">&larr; Indietro</button>';

    // Status
    html += '<div style="display:inline-block;padding:5px 14px;border-radius:6px;background:' + statusColor + ';color:#fff;font-size:12px;font-weight:800;margin-bottom:12px">' + statusLabel + '</div>';

    // Titolo
    html += '<div style="font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px">' + esc(t.title) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">' + esc(p.name);
    if (t.dueDate) {
        var dLeft = daysUntil(t.dueDate);
        var dateF = new Date(t.dueDate + 'T00:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'long'});
        html += ' &middot; Scadenza: <strong>' + dateF + '</strong>';
        if (dLeft !== null && dLeft >= 0) html += ' (' + dLeft + ' giorni)';
    }
    html += '</div>';

    // Messaggio COO
    if (hasCeoNote) {
        html += '<div style="padding:16px;background:var(--accent-soft, #FFF1ED);border:1px solid var(--accent);border-radius:12px;margin-bottom:20px">';
        html += '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase">Istruzioni dal team operativo</div>';
        html += '<div style="font-size:15px;color:var(--text);line-height:1.7">' + esc(t.ceoNote) + '</div>';
        html += '</div>';
    } else if (t.note) {
        html += '<div style="padding:14px;background:var(--bg);border-radius:10px;margin-bottom:20px;font-size:14px;color:var(--text-secondary);line-height:1.6">' + esc(t.note) + '</div>';
    }

    // Conversazione
    var allMsgs = [];
    (t.ceoUpdates || []).forEach(function(u) { allMsgs.push({ from: 'ceo', note: u.note, type: u.type, at: u.at }); });
    (t.cooResponses || []).forEach(function(r) { allMsgs.push({ from: 'coo', note: r.note, type: 'response', at: r.at }); });
    allMsgs.sort(function(a, b) { return new Date(a.at) - new Date(b.at); });
    if (allMsgs.length > 0) {
        html += '<div style="margin-bottom:20px">';
        html += '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px">Conversazione</div>';
        allMsgs.forEach(function(msg) {
            var d = new Date(msg.at);
            var dateStr = d.toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            var isCeo = msg.from === 'ceo';
            var typeLabel = msg.type === 'complete' ? 'Completata' : msg.type === 'update' ? 'Aggiornamento' : 'Risposta';
            var bgCol = isCeo ? 'var(--bg)' : 'var(--accent-soft,#FFF1ED)';
            var nameCol = isCeo ? 'var(--blue)' : 'var(--accent)';
            var name = isCeo ? 'Tu' : 'Mattia (COO)';
            html += '<div style="padding:10px 14px;background:' + bgCol + ';border-radius:10px;margin-bottom:6px;font-size:13px">';
            html += '<span style="font-weight:700;color:' + nameCol + '">' + name + '</span>';
            html += ' <span style="font-size:11px;color:var(--text-muted)">' + typeLabel + ' &middot; ' + dateStr + '</span>';
            if (msg.note) html += '<div style="color:var(--text-secondary);margin-top:4px;line-height:1.5">' + esc(msg.note) + '</div>';
            html += '</div>';
        });
        html += '</div>';
    }

    // Textarea
    html += '<textarea id="ceoTaskNote" rows="3" placeholder="Scrivi una nota, un aggiornamento, o il motivo per cui non hai potuto completarla..." style="width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);background:var(--bg);color:var(--text);box-sizing:border-box;resize:vertical;margin-bottom:16px"></textarea>';

    // Bottoni
    if (t.status !== 'ceo_done' && t.status !== 'done') {
        html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">';

        html += '<button onclick="ceoTaskAction(\'' + taskId + '\',\'' + projectId + '\',\'update\')" style="flex:1;padding:16px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:52px">Aggiorna il COO</button>';
        html += '</div>';
    } else if (t.status === 'ceo_done') {
        html += '<div style="padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:12px;text-align:center;font-size:15px;font-weight:600;color:var(--green);margin-bottom:20px">In attesa di conferma dal COO</div>';
    }

    // Spacer bottom per iOS Safari — i pulsanti non devono finire sotto la barra browser
    html += '<div style="height:30px" aria-hidden="true"></div>';
    html += '</div>';
    return html;
}

// Vista inline risorsa CEO (mobile)
function _renderCeoResInline(resId) {
    var resources = getResources();

    var _ca = _ceoActions || { taskActions: {}, resourceActions: {}, projectActions: {} };
    var resActions = _ca.resourceActions[resId] || {};
    var isRead = resActions.read;
    var typeIcon = res.type === 'link' ? '&#128279;' : res.type === 'html' ? '&#128196;' : '&#128221;';
    var typeLabel = res.type === 'link' ? 'Link' : res.type === 'html' ? 'HTML' : 'Nota';
    var dateStr = res.createdAt ? new Date(res.createdAt).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';

    var html = '<div class="ceo-container">';
    html += '<button onclick="ceoGoHome()" style="background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:0;font-family:var(--font);margin-bottom:16px">&larr; Indietro</button>';

    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">';
    html += '<span style="font-size:28px;line-height:1">' + typeIcon + '</span>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:20px;font-weight:800;color:var(--text)">' + esc(res.title) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-muted)">' + typeLabel + (dateStr ? ' &middot; ' + dateStr : '') + '</div>';
    html += '</div>';
    if (isRead) html += '<span style="font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:6px;padding:4px 10px;flex-shrink:0">LETTO</span>';
    html += '</div>';

    // Contenuto
    if (res.content && res.content.trim()) {
        html += '<div style="padding:18px;background:var(--bg);border-radius:12px;font-size:15px;line-height:1.8;color:var(--text);margin-bottom:18px">' + simpleMarkdown(res.content) + '</div>';
    }

function _ceoOpenTaskModal(taskId, projectId) {
    var projects = getProjects();
    var p = projects.find(function(pr) { return pr.id === projectId; });
    if (!p) return;
    var t = (p.tasks || []).find(function(tk) { return tk.id === taskId; });
    if (!t) return;

    var isBlocked = t.status === 'blocked';
    var isOverdue = t.dueDate && t.dueDate < today();
    var isDueToday = t.dueDate && t.dueDate === today();
    var hasCeoNote = t.ceoNote && t.ceoNote.trim();
    var statusColor = isBlocked ? 'var(--red)' : t.status === 'ceo_done' ? 'var(--green)' : isOverdue ? 'var(--red)' : isDueToday ? 'var(--orange)' : 'var(--blue)';
    var statusLabel = isBlocked ? 'BLOCCATA' : t.status === 'ceo_done' ? 'COMPLETATA (in attesa conferma COO)' : isOverdue ? 'IN RITARDO' : isDueToday ? 'SCADE OGGI' : t.status === 'in_progress' ? 'IN CORSO' : 'DA FARE';

    var modal = document.getElementById('taskModalInner');
    var html = '<div class="modal-close-bar"><button class="modal-close-x" onclick="closeTaskModal()" aria-label="Chiudi">&times;</button></div>';

    // Status badge
    html += '<div style="display:inline-block;padding:4px 12px;border-radius:6px;background:' + statusColor + ';color:#fff;font-size:11px;font-weight:800;margin-bottom:12px">' + statusLabel + '</div>';

    // Titolo
    html += '<div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px">' + esc(t.title) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">' + esc(p.name);
    if (t.dueDate) {
        var dLeft = daysUntil(t.dueDate);
        var dateF = new Date(t.dueDate + 'T00:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'long'});
        html += ' &middot; Scadenza: <strong>' + dateF + '</strong>';
        if (dLeft !== null && dLeft >= 0) html += ' (' + dLeft + ' giorni)';
    }
    html += '</div>';

    // Messaggio COO (ceoNote)
    if (hasCeoNote) {
        html += '<div style="padding:14px 16px;background:var(--accent-soft, #FFF1ED);border:1px solid var(--accent);border-radius:10px;margin-bottom:16px">';
        html += '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase">Istruzioni dal team operativo</div>';
        html += '<div style="font-size:14px;color:var(--text);line-height:1.6">' + esc(t.ceoNote) + '</div>';
        html += '</div>';
    } else if (t.note) {
        html += '<div style="padding:12px 14px;background:var(--bg);border-radius:8px;margin-bottom:16px;font-size:13px;color:var(--text-secondary);line-height:1.5">' + esc(t.note) + '</div>';
    }

    // Thread conversazione CEO ↔ COO (cronologico)
    var allMsgs = [];
    (t.ceoUpdates || []).forEach(function(u) { allMsgs.push({ from: 'ceo', note: u.note, type: u.type, at: u.at }); });
    (t.cooResponses || []).forEach(function(r) { allMsgs.push({ from: 'coo', note: r.note, type: 'response', at: r.at }); });
    allMsgs.sort(function(a, b) { return new Date(a.at) - new Date(b.at); });
    if (allMsgs.length > 0) {
        html += '<div style="margin-bottom:16px">';
        html += '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px">Conversazione</div>';
        allMsgs.forEach(function(msg) {
            var d = new Date(msg.at);
            var dateStr = d.toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            var isCeo = msg.from === 'ceo';
            var typeLabel = msg.type === 'complete' ? 'Completata' : msg.type === 'update' ? 'Aggiornamento' : 'Risposta';
            var bgCol = isCeo ? 'var(--bg)' : 'var(--accent-soft,#FFF1ED)';
            var nameCol = isCeo ? 'var(--blue)' : 'var(--accent)';
            var name = isCeo ? 'Tu' : 'Mattia (COO)';
            html += '<div style="padding:8px 12px;background:' + bgCol + ';border-radius:8px;margin-bottom:4px;font-size:12px">';
            html += '<span style="font-weight:700;color:' + nameCol + '">' + name + '</span>';
            html += ' <span style="font-size:10px;font-weight:600;color:var(--text-muted)">' + typeLabel + ' &middot; ' + dateStr + '</span>';
            if (msg.note) html += '<div style="color:var(--text-secondary);margin-top:4px">' + esc(msg.note) + '</div>';
            html += '</div>';
        });

    html += '<div style="margin-bottom:16px">';

        html += '<button onclick="ceoTaskAction(\'' + taskId + '\',\'' + projectId + '\',\'update\')" style="flex:1;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);min-width:120px;min-height:48px">Aggiorna il COO</button>';
    } else if (t.status === 'ceo_done') {
        html += '<div style="flex:1;padding:14px;background:var(--green-bg);border:1px solid var(--green);border-radius:10px;text-align:center;font-size:14px;font-weight:600;color:var(--green)">In attesa di conferma dal COO</div>';
    }
    html += '<button onclick="closeTaskModal()" style="flex:1;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--text);min-height:48px">Chiudi</button>';
    html += '</div>';

    modal.innerHTML = html;
    document.getElementById('taskModal').classList.add('open');
}

function ceoTaskAction(taskId, projectId, actionType) {
    var noteText = (document.getElementById('ceoTaskNote') || {}).value || '';
    if (actionType === 'update' && !noteText.trim()) {
        alert('Scrivi una nota per aggiornare il COO.');
        return;
    }

    // Update _ceoActions
    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {} };
    if (!_ceoActions.taskActions[taskId]) _ceoActions.taskActions[taskId] = { status: '', updates: [] };
    var ta = _ceoActions.taskActions[taskId];
    ta.updates.push({
        type: actionType,
        note: noteText.trim(),
        at: new Date().toISOString()
    });
    if (actionType === 'complete') {
        ta.status = 'complete';
    } else {
        ta.status = 'update';
    }

    // Also update local _ceoData for immediate rendering
    if (_ceoData) {
        var p = _ceoData.projects.find(function(pr) { return pr.id === projectId; });
        if (p) {
            var t = (p.tasks || []).find(function(tk) { return tk.id === taskId; });
            if (t) {
                t.ceoUpdates = ta.updates;
                if (actionType === 'complete') t.status = 'ceo_done';
            }
        }
    }

    // Push only ceo.json
    ceoPushActions(function(ok) {
        if (ok) {
            if (_ceoOpenTaskInline) { _ceoOpenTaskInline = null; }
            try { closeTaskModal(); } catch(e) {}
            renderCEOView();
        } else {
            alert('Errore nel salvataggio. Riprova.');
        }
    });
}

function ceoPushActions(callback, retryCount) {
    var token = safeGetItem('pb_gh_token_ceo');
    if (!token) {
        _showCeoOnboarding();
        callback(false);
        return;
    }
    retryCount = retryCount || 0;

    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {}, projectActions: {} };
    if (!_ceoActions.projectActions) _ceoActions.projectActions = {};
    _ceoActions.lastUpdate = new Date().toISOString();

    var content = btoa(unescape(encodeURIComponent(JSON.stringify(_ceoActions, null, 2))));

    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(existing) {
        var body = { message: 'CEO actions ' + new Date().toISOString().split('T')[0], content: content };
        if (existing && existing.sha) body.sha = existing.sha;

        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    }).then(function(r) {
        if (r.ok) {
            callback(true);
        } else {
            return r.json().then(function(err) {
                if (err.message && err.message.indexOf('Bad credentials') !== -1) {
                    safeSetItem('pb_gh_token_ceo', '');
                    _showCeoOnboarding();
                    callback(false);
                } else if (err.message && err.message.indexOf('does not match') !== -1 && retryCount < 3) {
                    setTimeout(function() { ceoPushActions(callback, retryCount + 1); }, 1000);
                } else {
                    callback(false);
                }
            });
        }
    }).catch(function() { callback(false); });
}

function daysUntil(dateStr) {
    if (!dateStr) return null;
    var diff = Math.ceil((new Date(dateStr) - new Date(today())) / 86400000);
    return diff;
}

function loadTeamData(callback, silent) {
    var token = safeGetItem('pb_gh_token_team');
    if (!token) { if (callback) callback(); return; }
    // Load published data (data.json)
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_DATA_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(fileData) {
        if (fileData && fileData.content) {
            _teamData = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
        }
        // Load team actions
        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_TEAM_FILE + '?t=' + Date.now(), {
            headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
        });
    }).then(function(r) { return (r && r.ok) ? r.json() : null; })
    .then(function(fileData) {
        if (fileData && fileData.content) {
            _teamActions = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
        } else {
            _teamActions = {};
        }
        if (callback) callback();
    }).catch(function() { if (callback) callback(); });
}

function teamPushActions(callback) {
    var token = safeGetItem('pb_gh_token_team');
    if (!token) { if (callback) callback(false); return; }
    if (!_teamActions) _teamActions = {};
    _teamActions.lastUpdate = new Date().toISOString();
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(_teamActions, null, 2))));
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_TEAM_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(existing) {
        var body = { message: 'Team actions ' + new Date().toISOString().split('T')[0], content: content };
        if (existing && existing.sha) body.sha = existing.sha;
        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_TEAM_FILE, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    }).then(function(r) {
        if (callback) callback(r.ok);
    }).catch(function() { if (callback) callback(false); });
}

function _getTeamMemberActions() {
    if (!_teamActions) _teamActions = {};
    if (!_teamActions[TEAM_MEMBER_NAME]) _teamActions[TEAM_MEMBER_NAME] = { taskActions: {} };
    return _teamActions[TEAM_MEMBER_NAME];
}

function renderTeamHome() {
    var projects = (_teamData && _teamData.projects) || [];
    var todayStr = today();
    var isDark = document.body.classList.contains('dark');
    var myActions = _getTeamMemberActions();

    // Raccogli task assegnate a questo membro
    var myTasks = [];
    projects.forEach(function(p) {
        if (p.status === 'completato') return;
        (p.tasks || []).forEach(function(t) {
            if (t.assignee === TEAM_MEMBER_NAME && t.status !== 'done') {
                var ta = myActions.taskActions[t.id];
                var memberStatus = (ta && ta.status) || null;
                myTasks.push({ task: t, projectName: p.name, projectId: p.id, memberStatus: memberStatus });
            }
        });
    });

    // Ordina: bloccate/scadute prima
    myTasks.sort(function(a, b) {
        var ta = a.task, tb = b.task;
        var aBlk = ta.status === 'blocked' ? 0 : 1, bBlk = tb.status === 'blocked' ? 0 : 1;
        if (aBlk !== bBlk) return aBlk - bBlk;
        var aOvr = (ta.dueDate && ta.dueDate < todayStr) ? 0 : 1, bOvr = (tb.dueDate && tb.dueDate < todayStr) ? 0 : 1;
        if (aOvr !== bOvr) return aOvr - bOvr;
        return (ta.dueDate || '9999').localeCompare(tb.dueDate || '9999');
    });

    var completedTasks = [];
    projects.forEach(function(p) {
        (p.tasks || []).forEach(function(t) {

            }
        });

    html += '<div style="font-size:22px;font-weight:800;color:var(--text)">' + _greeting + ', ' + esc(TEAM_MEMBER_NAME) + '</div>';
    html += '<div style="font-size:14px;color:var(--text-muted);margin-top:2px">' + new Date().toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'}) + '</div>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:8px">';
    html += '<button onclick="_teamRefresh()" style="background:' + (isDark ? '#1E1E1E' : 'var(--surface)') + ';border:1px solid ' + (isDark ? '#333' : 'var(--border)') + ';border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:' + (isDark ? '#F5F3F0' : 'var(--text)') + '" title="Aggiorna">&#8635;</button>';
    html += '<button onclick="teamToggleTheme()" style="background:' + (isDark ? '#1E1E1E' : 'var(--surface)') + ';border:1px solid ' + (isDark ? '#333' : 'var(--border)') + ';border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:' + (isDark ? '#F5F3F0' : 'var(--text)') + '">' + (isDark ? '&#9728;' : '&#9790;') + '</button>';
    html += '</div>';
    html += '</div>';

    // Stats rapide
    var totalMy = myTasks.length;
    var overdueMy = myTasks.filter(function(i) { return i.task.dueDate && i.task.dueDate < todayStr; }).length;
    var blockedMy = myTasks.filter(function(i) { return i.task.status === 'blocked'; }).length;

    html += '<div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">';
    html += '<div style="flex:1;min-width:80px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center">';
    html += '<div style="font-size:24px;font-weight:800;color:var(--text)">' + totalMy + '</div>';
    html += '<div style="font-size:13px;color:var(--text-muted);font-weight:600">Da fare</div></div>';
    if (overdueMy > 0) {
        html += '<div style="flex:1;min-width:80px;background:var(--red-bg,#FEF2F2);border:1px solid var(--red);border-radius:12px;padding:12px;text-align:center">';
        html += '<div style="font-size:24px;font-weight:800;color:var(--red)">' + overdueMy + '</div>';
        html += '<div style="font-size:13px;color:var(--red);font-weight:600">Scadute</div></div>';
    }
    if (blockedMy > 0) {
        html += '<div style="flex:1;min-width:80px;background:var(--red-bg,#FEF2F2);border:1px solid var(--red);border-radius:12px;padding:12px;text-align:center">';
        html += '<div style="font-size:24px;font-weight:800;color:var(--red)">' + blockedMy + '</div>';
        html += '<div style="font-size:13px;color:var(--red);font-weight:600">Bloccate</div></div>';
    }
    html += '<div style="flex:1;min-width:80px;background:var(--green-bg,#F0FDF4);border:1px solid var(--green);border-radius:12px;padding:12px;text-align:center">';
    html += '<div style="font-size:24px;font-weight:800;color:var(--green)">' + completedTasks.length + '</div>';
    html += '<div style="font-size:13px;color:var(--green);font-weight:600">Completate</div></div>';
    html += '</div>';

    // Task attive
    if (myTasks.length === 0) {
        html += '<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:16px;font-weight:600">Nessuna task assegnata al momento</div>';
    } else {
        html += '<div style="font-size:17px;font-weight:800;color:var(--text);margin-bottom:12px">Le tue task</div>';
        myTasks.forEach(function(item) {
            var t = item.task;
            var isBlocked = t.status === 'blocked';
            var isOverdue = t.dueDate && t.dueDate < todayStr;
            var isDueToday = t.dueDate && t.dueDate === todayStr;
            var borderColor = isBlocked ? 'var(--red)' : isOverdue ? 'var(--red)' : isDueToday ? 'var(--orange)' : 'var(--border)';
            var bgColor = isBlocked ? 'var(--red-bg,#FEF2F2)' : isOverdue ? 'var(--red-bg,#FEF2F2)' : isDueToday ? 'var(--orange-bg,#FFF7ED)' : 'var(--surface)';

            html += '<div onclick="teamOpenTask(\'' + t.id + '\',\'' + item.projectId + '\')" style="cursor:pointer;background:' + bgColor + ';border:1px solid ' + borderColor + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:transform 0.1s" onmouseenter="this.style.transform=\'translateY(-1px)\'" onmouseleave="this.style.transform=\'\'">';

            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">';
            if (isBlocked) html += '<span style="background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:4px;padding:2px 6px">BLOCCATA</span>';
            else if (isOverdue) html += '<span style="background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:4px;padding:2px 6px">SCADUTA</span>';
            else if (isDueToday) html += '<span style="background:var(--orange);color:#fff;font-size:12px;font-weight:800;border-radius:4px;padding:2px 6px">OGGI</span>';
            html += '<span style="font-size:13px;color:var(--text-muted);font-weight:600">' + esc(item.projectName) + '</span>';

            if (t.dueDate) {
                var dLeft = daysUntil(t.dueDate);
                var dateFormatted = new Date(t.dueDate + 'T00:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'short'});
                var dateColor = isOverdue ? 'var(--red)' : isDueToday ? 'var(--orange)' : 'var(--text-muted)';
                var dateLabel = isOverdue ? 'scaduta da ' + Math.abs(dLeft) + 'g' : isDueToday ? 'oggi' : dateFormatted + ' (' + dLeft + 'g)';
                html += '<span style="font-size:13px;font-weight:700;color:' + dateColor + ';margin-left:auto">&#128197; ' + dateLabel + '</span>';
            }
            html += '</div>';

            html += '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px">' + esc(t.title) + '</div>';
            if (t.note) {
                html += '<div style="font-size:14px;color:var(--text-secondary);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(t.note) + '</div>';
            }

            // Status badge se il membro ha aggiornato
            var ta = (_getTeamMemberActions().taskActions || {})[t.id];
            if (ta && ta.status) {
                var stLabel = ta.status === 'in_progress' ? 'In corso' : ta.status === 'done' ? 'Completata' : ta.status === 'blocked' ? 'Bloccata' : ta.status;
                var stColor = ta.status === 'in_progress' ? 'var(--blue,#2563EB)' : ta.status === 'done' ? 'var(--green)' : 'var(--red)';
                html += '<div style="margin-top:6px;font-size:12px;font-weight:700;color:' + stColor + '">Il tuo stato: ' + stLabel + '</div>';
            }

            html += '</div>';
        });
    }

    // Completate (collassate)
    if (completedTasks.length > 0) {
        html += '<details style="margin-top:20px"><summary style="font-size:15px;font-weight:700;color:var(--text-muted);cursor:pointer;margin-bottom:10px">Completate (' + completedTasks.length + ')</summary>';
        completedTasks.forEach(function(item) {
            html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:6px;opacity:0.6">';
            html += '<div style="font-size:14px;font-weight:600;color:var(--text);text-decoration:line-through">' + esc(item.task.title) + '</div>';
            html += '<div style="font-size:12px;color:var(--text-muted)">' + esc(item.projectName) + '</div>';
            html += '</div>';
        });
        html += '</details>';
    }

    html += '</div>';
    return html;

function renderTeamTaskDetail() {

    var isDark = document.body.classList.contains('dark');

    var isDueToday = task.dueDate && task.dueDate === todayStr;

    var ta = (myActions.taskActions || {})[task.id] || {};

    html += '<button onclick="teamGoHome()" style="background:none;border:none;color:var(--accent);font-size:17px;font-weight:700;cursor:pointer;padding:0;font-family:var(--font);margin-bottom:16px">&larr; Le mie task</button>';

            var border = isTeam ? 'var(--accent)' : 'var(--border)';
            var label = isTeam ? esc(TEAM_MEMBER_NAME) : 'Mattia (COO)';
            var timeStr = new Date(m.at).toLocaleString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
            html += '<div style="display:flex;justify-content:' + align + ';margin-bottom:8px">';
            html += '<div style="background:' + bg + ';border:1px solid ' + border + ';border-radius:12px;padding:10px 14px;max-width:85%">';
            html += '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px">' + label + ' &middot; ' + timeStr + '</div>';

            }

    }

    // Input commento
    html += '<textarea id="teamTaskNote" rows="3" placeholder="Scrivi un commento o aggiornamento..." style="width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);background:var(--bg);color:var(--text);box-sizing:border-box;resize:vertical;margin-bottom:12px;margin-top:12px"></textarea>';

    html += '</div>';
    return html;
}

function teamOpenTask(taskId) {
    _teamOpenTaskId = taskId;
    renderTeamView();
    window.scrollTo(0, 0);
}

function teamGoHome() {
    _teamOpenTaskId = null;
    renderTeamView();
    window.scrollTo(0, 0);
}

function teamTaskAction(taskId, newStatus) {
    var noteEl = document.getElementById('teamTaskNote');
    var note = noteEl ? noteEl.value.trim() : '';
    if (!note && !newStatus) { alert('Scrivi un commento prima di inviare.'); return; }

    var myActions = _getTeamMemberActions();
    if (!myActions.taskActions) myActions.taskActions = {};
    if (!myActions.taskActions[taskId]) myActions.taskActions[taskId] = { updates: [] };
    var ta = myActions.taskActions[taskId];
    if (newStatus) ta.status = newStatus;
    if (!ta.updates) ta.updates = [];
    ta.updates.push({ note: note || '', status: newStatus, at: new Date().toISOString() });

    teamPushActions(function(ok) {
        if (ok) {
            renderTeamView();
        } else {
            alert('Errore nel salvataggio. Riprova.');
        }
    });
}

function _teamRefresh() {
    loadTeamData(function() { renderTeamView(); });
}

function teamToggleTheme() {
    document.body.classList.toggle('dark');
    safeSetItem('pb_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    renderTeamView();
}

    var secCeoDone = _ceoTaskItems.filter(function(i) { return i.task.status === 'ceo_done'; });

    // Ordina task attive: blocked/scadute prima, poi per scadenza
    function _ceoSortByUrgency(a, b) {

    // === SEZIONE 4: In attesa (feedback inviato + completate da confermare) ===
    var awaitingTotal = secAwaiting.length + secCeoDone.length;
    if (awaitingTotal > 0) {
        html += _ceoSectionHeader('In attesa', awaitingTotal, 'var(--purple,#8B5CF6)', '&#9203;');

// CEO invia nota su progetto
function ceoSendProjectNote(pid) {
    var input = document.getElementById('ceoProjectNote_' + pid);
    if (!input) return;
    var note = input.value.trim();
    if (!note) { input.focus(); return; }
    if (!_ceoActions) _ceoActions = { lastUpdate: '', taskActions: {}, resourceActions: {} };
    if (!_ceoActions.projectActions) _ceoActions.projectActions = {};
    if (!_ceoActions.projectActions[pid]) _ceoActions.projectActions[pid] = { notes: [] };
    _ceoActions.projectActions[pid].notes.push({ note: note, at: new Date().toISOString() });
    input.value = '';
    var btn = input.nextElementSibling;
    if (btn) { btn.textContent = 'Invio...'; btn.disabled = true; }
    ceoPushActions(function(ok) {
        if (ok) {
            _showToast('Nota inviata a Mattia!');
            renderCEOView();
        } else {
            _showToast('Errore invio nota', true);
            if (btn) { btn.textContent = 'Invia'; btn.disabled = false; }
        }
    });
}

// ========== HARD RELOAD (cache-busting per GitHub Pages) ==========
function _hardReload() {
    if ('caches' in window) {
        caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
        });
    }
    var u = new URL(window.location.href);
    u.searchParams.set('_cb', Date.now());
    window.location.replace(u.toString());
}

function _smartRefresh() {
    _showToast('Aggiornamento in corso...');
    // 1) Svuota caches (Service Worker ecc.)
    if ('caches' in window) {
        caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
        });
    }
    // 2) Fetch nuova versione HTML con cache-bust per forzare bypass
    fetch(window.location.pathname + '?_cb=' + Date.now(), { cache: 'no-store' })
        .then(function() {
            if (CEO_MODE) {
                loadCEOData(function() {
                    var u = new URL(window.location.href);
                    u.searchParams.set('_cb', Date.now());
                    window.location.replace(u.toString());
                }, true);
            } else {
                // COO: pull data.json da GitHub → merge nel localStorage
                _pullFromGitHub(function() {
                    var u = new URL(window.location.href);
                    u.searchParams.set('_cb', Date.now());
                    window.location.replace(u.toString());
                });
            }
        })
        .catch(function() {
            var u = new URL(window.location.href);
            u.searchParams.set('_cb', Date.now());
            window.location.replace(u.toString());
        });
}

// COO: Pull data.json da GitHub e merge nel localStorage
function _pullFromGitHub(callback) {
    var token = getGHToken();
    if (!token) { if (callback) callback(); return; }
    _ghFetchJSON(GH_DATA_FILE, token).then(function(remoteData) {
        if (!remoteData) { if (callback) callback(); return; }
        // Confronta timestamp: se remote è più recente, aggiorna localStorage
        var localPublish = safeGetItem('pb_last_publish') || '';
        var remotePublish = remoteData.publishedAt || '';
        if (remotePublish > localPublish) {
            // Remote ha dati più recenti (es. modificati da Claude) → importa
            if (remoteData.projects) saveProjects(remoteData.projects);
            if (remoteData.team) saveTeam(remoteData.team);
            if (remoteData.launches) saveLaunches(remoteData.launches);
            if (remoteData.ceoLinks) saveCeoLinks(remoteData.ceoLinks);
            if (remoteData.resources) saveResources(remoteData.resources);
            safeSetItem('pb_last_publish', remotePublish);
            console.log('Pull da GitHub: dati aggiornati (' + remotePublish + ')');
        }
        if (callback) callback();
    }).catch(function() { if (callback) callback(); });
}

function publishForCEO(retryCount) {
    var token = getGHToken();
    if (!token) {
        _showCooOnboarding(function() { publishForCEO(); });
        return;
    }
    retryCount = retryCount || 0;

    var data = {
        publishedAt: new Date().toISOString(),
        projects: getProjects(),
        team: getTeam(),
        launches: getLaunches(),
        ceoLinks: getCeoLinks(),
        resources: getResources()
    };
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

    _showToast('Pubblicazione in corso...');

    // Get current file SHA (needed for update)
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_DATA_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + getGHToken() }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(existing) {
        var body = {
            message: 'CEO data update ' + new Date().toISOString().split('T')[0],
            content: content
        };
        if (existing && existing.sha) body.sha = existing.sha;

        return fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_DATA_FILE, {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + getGHToken(),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
    }).then(function(r) {
        if (r.ok) {
            window._lastCooPublish = Date.now();
            safeSetItem('pb_last_publish', new Date().toISOString());
            _appData._hasUnpublished = false;
            _updateCeoPublishBadge();
            _updateSyncIndicator();
            _showToast('Pubblicato per il CEO!');
        } else {
            return r.json().then(function(err) {
                if (err.message && err.message.indexOf('Bad credentials') !== -1) {
                    setGHToken('');
                    _showCooOnboarding(function() { publishForCEO(); });
                } else if (err.message && err.message.indexOf('does not match') !== -1 && retryCount < 3) {
                    // SHA conflict — retry with fresh SHA
                    _showToast('Conflitto SHA, riprovo...');
                    setTimeout(function() { publishForCEO(retryCount + 1); }, 1000);
                } else {
                    _showToast('Errore: ' + (err.message || 'sconosciuto'), true);
                }
            });
        }
    }).catch(function(e) { _showToast('Errore di rete: ' + e.message, true); });
}

function _showToast(msg, isError) {
    var existing = document.getElementById('pbToast');
    if (existing) existing.remove();

    el.id = 'pbToast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;font-family:var(--font);z-index:99999;box-shadow:var(--shadow-lg);transition:opacity 0.3s;' +
        (isError ? 'background:var(--red);color:#fff' : 'background:var(--surface);color:var(--text);border:1px solid var(--border)');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 3000);
}

function _updateSyncIndicator() {
    var ids = CEO_MODE ? ['syncIndicatorCeo', 'syncIndicator'] : ['syncIndicator'];
    var lastSync = CEO_MODE ? window._lastCeoSync : window._lastCooSync;
    ids.forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (!lastSync) { el.textContent = ''; return; }
        var secsAgo = Math.round((Date.now() - lastSync) / 1000);
        var label = secsAgo < 10 ? 'ora' : secsAgo < 60 ? secsAgo + 's fa' : Math.round(secsAgo / 60) + 'm fa';
        el.innerHTML = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px"></span>Sync: ' + label;
    });
}

// CEO mode: load data from remote data.json + ceo.json
var _ceoData = null;
var _ceoActions = null;

function _applyCeoActionsToData() {
    if (!_ceoData || !_ceoActions) return;
    // Apply task actions from ceo.json onto _ceoData for rendering
    if (_ceoActions.taskActions && _ceoData.projects) {
        _ceoData.projects.forEach(function(p) {
            (p.tasks || []).forEach(function(t) {
                var ta = _ceoActions.taskActions[t.id];
                if (ta) {
                    t.ceoUpdates = ta.updates || [];
                    if (ta.status === 'complete') {
                        // Controlla se il COO ha risposto DOPO l'ultima azione del CEO
                        var lastCeoAct = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1] : null;
                        var lastCooResp = (t.cooResponses && t.cooResponses.length > 0) ? t.cooResponses[t.cooResponses.length - 1] : null;
                        var cooRespondedAfter = lastCooResp && lastCeoAct && new Date(lastCooResp.at) > new Date(lastCeoAct.at);
                        if (cooRespondedAfter) {
                            // COO ha gia' gestito — rispetta lo status in data.json
                            // (done = confermata, todo = rimessa in lavorazione)
                        } else {
                            // COO non ha ancora gestito — mostra "in attesa di conferma"
                            t.status = 'ceo_done';
                        }
                    }
                }
            });
        });
    }
}

function _ghFetchJSON(file, token) {
    var url = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + file + '?t=' + Date.now();
    var opts = { cache: 'no-store', headers: {} };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, opts).then(function(r) {
        if (!r.ok) return null;
        return r.json();
    }).then(function(fileData) {
        if (!fileData || !fileData.content) return null;
        return JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
    });
}

function loadCEOData(callback, forceRefresh) {
    if (_ceoData && !forceRefresh) { callback(_ceoData); return; }
    var token = safeGetItem('pb_gh_token_ceo') || '';

    var dataPromise = _ghFetchJSON(GH_DATA_FILE, token).then(function(d) {
        if (!d) throw new Error('Nessun dato pubblicato');
        return d;
    });
    var ceoPromise = _ghFetchJSON(GH_CEO_FILE, token).then(function(d) {
        return d || { lastUpdate: '', taskActions: {}, resourceActions: {} };
    });

    Promise.all([dataPromise, ceoPromise]).then(function(results) {
        _ceoData = results[0];
        _ceoActions = results[1];
        _applyCeoActionsToData();
        window._lastCeoSync = Date.now();
        callback(_ceoData);
    }).catch(function(err) {
        document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:16px">Nessun dato pubblicato ancora.<br>Il COO deve prima pubblicare i dati.<br><small style="color:var(--red)">' + err.message + '</small></div>';
    });
}

// COO: fetch ceo.json from GitHub to display Alberto's responses
function _cooFetchCeoActions() {
    var ghToken = getGHToken();
    if (!ghToken) return;
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + ghToken }, cache: 'no-store'
    }).then(function(r) {
        if (!r.ok) return null;
        return r.json();
    }).then(function(fileData) {
        if (!fileData || !fileData.content) return;
        var decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
        var ceoActs = JSON.parse(decoded);
        // Update resource badges in DOM
        var ress = getResources();
        ress.forEach(function(r) {
            var ra = (ceoActs.resourceActions && ceoActs.resourceActions[r.id]) || {};
            var badgeEl = document.getElementById('cooResBadge_' + r.id);
            if (badgeEl) {
                if (ra.read) {
                    badgeEl.style.color = 'var(--green)';
                    badgeEl.style.background = 'var(--green-bg,#F0FDF4)';
                    badgeEl.textContent = 'LETTO';
                } else {
                    badgeEl.style.color = 'var(--orange)';
                    badgeEl.style.background = 'var(--orange-bg,#FFF7ED)';
                    badgeEl.textContent = 'NON LETTO';
                }
            }
            // Update badges in BOTH locations (top panoramica + bottom pannello CEO)
            ['cooResFeedback_', 'cooResTopFeedback_'].forEach(function(prefix) {
                var feedEl = document.getElementById(prefix + r.id);
                var feedback = ra.feedback || [];
                if (feedEl && feedback.length > 0) {
                    var fHtml = '<div style="padding:4px 10px 8px;border-top:1px solid var(--border-light)">';
                    feedback.slice(-2).forEach(function(fb) {
                        var fDate = new Date(fb.at).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                        fHtml += '<div style="font-size:11px;padding:4px 0"><span style="font-weight:700;color:var(--blue)">Alberto:</span> <span style="color:var(--text-secondary)">' + esc(fb.note) + '</span> <span style="color:var(--text-muted);font-size:10px">' + fDate + '</span></div>';
                    });
                    fHtml += '</div>';
                    feedEl.innerHTML = fHtml;
                }
            });
            // Top badge too
            var topBadgeEl = document.getElementById('cooResTopBadge_' + r.id);
            if (topBadgeEl) {
                if (ra.read) {
                    topBadgeEl.style.color = 'var(--green)';
                    topBadgeEl.style.background = 'var(--green-bg,#F0FDF4)';
                    topBadgeEl.textContent = 'LETTO';
                } else {
                    topBadgeEl.style.color = 'var(--orange)';
                    topBadgeEl.style.background = 'var(--orange-bg,#FFF7ED)';
                    topBadgeEl.textContent = 'NON LETTO';
                }
            }
            // Msg badge next to both badge elements
            var feedback = ra.feedback || [];
            [badgeEl, topBadgeEl].forEach(function(bEl) {
                if (bEl && feedback.length > 0 && !bEl.nextSibling?.classList?.contains('msg-count')) {
                    var msgBadge = document.createElement('span');
                    msgBadge.className = 'msg-count';
                    msgBadge.style.cssText = 'font-size:9px;font-weight:800;color:var(--blue);background:var(--blue-bg,#EFF6FF);border-radius:4px;padding:1px 5px;margin-left:4px';
                    msgBadge.textContent = feedback.length + ' msg';
                    bEl.parentNode.insertBefore(msgBadge, bEl.nextSibling);
                }
            });
        });
        // Aggiorna badge sommario sul rettangolo Bacheca
        var summaryEl = document.getElementById('cooResBadgeSummary');
        if (summaryEl) {
            var readCount = 0;
            var msgCount = 0;
            var taskDoneCount = 0;
            ress.forEach(function(r) {
                var ra = (ceoActs.resourceActions && ceoActs.resourceActions[r.id]) || {};
                if (ra.read) readCount++;
                if (ra.feedback) msgCount += ra.feedback.length;
            });
            if (ceoActs.taskActions) {
                Object.keys(ceoActs.taskActions).forEach(function(tid) {
                    var ta = ceoActs.taskActions[tid];
                    if (ta.updates && ta.updates.length > 0) taskDoneCount += ta.updates.length;
                });
            }
            var parts = [];
            if (msgCount > 0) parts.push(msgCount + ' rispost' + (msgCount === 1 ? 'a' : 'e'));
            if (readCount > 0) parts.push(readCount + '/' + ress.length + ' lette');
            if (taskDoneCount > 0) parts.push(taskDoneCount + ' aggiornament' + (taskDoneCount === 1 ? 'o' : 'i') + ' task');
            if (parts.length > 0) {
                summaryEl.innerHTML = '<span style="color:var(--blue);font-weight:700">' + parts.join(' &middot; ') + '</span>';
            }
        }

        // Task completate da CEO → status 'da_verificare' (COO conferma poi)
        // Task con update da CEO → ceoHasUpdate flag
        if (ceoActs.taskActions) {
            var projects = getProjects();
            var needSave = false;
            projects.forEach(function(p) {
                (p.tasks || []).forEach(function(t) {
                    var ta = ceoActs.taskActions[t.id];
                    if (!ta) return;
                    // Skip se il COO ha già gestito questa azione (confermata o rifiutata)
                    var _latestCeoAt = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1].at : null;
                    if (_isCooAcked(t.id, _latestCeoAt)) return;
                    // Completate → da_verificare
                    if (ta.status === 'complete' && t.status !== 'done' && t.status !== 'da_verificare') {
                        t.status = 'da_verificare';
                        t.ceoUpdates = ta.updates || [];
                        t.ceoCompletedAt = (ta.updates && ta.updates.length > 0) ? ta.updates[ta.updates.length - 1].at : new Date().toISOString();
                        needSave = true;
                    }
                    // Aggiornamenti → ceoHasUpdate
                    if (ta.updates && ta.updates.length > 0) {
                        var lastCeoUpdate = ta.updates[ta.updates.length - 1];
                        var lastCooResponse = (t.cooResponses && t.cooResponses.length > 0) ? t.cooResponses[t.cooResponses.length - 1] : null;
                        var ceoIsNewer = !lastCooResponse || new Date(lastCeoUpdate.at) > new Date(lastCooResponse.at);
                        if (ceoIsNewer && lastCeoUpdate.type === 'update' && !t.ceoHasUpdate) {
                            t.ceoHasUpdate = true;
                            t.ceoUpdates = ta.updates;
                            needSave = true;
                        }
                    }
                });
            });
            if (needSave) { saveProjects(projects); render(); }
        }

        // Note progetto da CEO → flag ceoHasProjectNote
        if (ceoActs.projectActions) {
            var projects2 = getProjects();
            var needSave2 = false;
            projects2.forEach(function(p) {
                var pa = ceoActs.projectActions[p.id];
                if (!pa || !pa.notes || pa.notes.length === 0) return;
                var lastCeoNote = pa.notes[pa.notes.length - 1];
                var lastCooResp = (p.cooProjectResponses && p.cooProjectResponses.length > 0) ? p.cooProjectResponses[p.cooProjectResponses.length - 1] : null;
                var ceoIsNewer = !lastCooResp || new Date(lastCeoNote.at) > new Date(lastCooResp.at);
                if (ceoIsNewer && !p.ceoHasProjectNote) {
                    p.ceoHasProjectNote = true;
                    p.ceoProjectNotes = pa.notes;
                    needSave2 = true;
                }
            });
            if (needSave2) { saveProjects(projects2); render(); }
        }
    }).catch(function() { /* silent fail — badges stay as '...' */ });
}

function renderGlobalWrapper() {
    let html = '';
    // Global tabs bar
    html += '<div class="tabs-bar">';
    var _gtabs = isMobile() ? GLOBAL_TABS_MOBILE : GLOBAL_TABS;
    _gtabs.forEach((t,i) => {
        html += `<button class="tab-btn ${state.globalTab===i?'active':''}" onclick="setGlobalTab(${i})">${t}</button>`;
    });
    html += '</div>';

    // Filters for non-panoramica views
    if (state.globalTab > 0) {
        html += renderGlobalFilters();
    }

    html += '<div class="view-content">';
    switch(state.globalTab) {
        case 0: html += renderGlobal(); break;
        case 1: html += renderGlobalBoard(); break;
        case 2: html += renderGlobalList(); break;
        case 3: html += renderGlobalCalendar(); break;
        case 4: html += renderGlobalPeople(); break;
        case 5: html += renderWeeklyReview(); break;
    }
    html += '</div>';
    return html;
}
