        });
        html += '</div></div>';
    });
    html += '</div>';
    return html;
}

// ===== VIEW 5: MY TASKS =====
function renderMyTasks(p) {
    const tasks = getFilteredTasks(p).filter(t => t.assignee === 'Mattia');
    const todayStr = today();
    const sow = startOfWeek(new Date());
    const eow = endOfWeek(new Date());

    const groups = {
        overdue: tasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0),
        today: tasks.filter(t => t.status !== 'done' && t.dueDate === todayStr),
        week: tasks.filter(t => t.status !== 'done' && t.dueDate && new Date(t.dueDate) > new Date(todayStr) && new Date(t.dueDate) <= eow),
        next: tasks.filter(t => t.status !== 'done' && t.dueDate && new Date(t.dueDate) > eow),
        noDue: tasks.filter(t => t.status !== 'done' && !t.dueDate),
    };

    const groupConfig = [
        { key: 'overdue', label: 'Scadute', color: 'var(--red)' },
        { key: 'today', label: 'Oggi', color: 'var(--orange)' },
        { key: 'week', label: 'Questa settimana', color: 'var(--blue)' },
        { key: 'next', label: 'Prossime', color: 'var(--text-secondary)' },
        { key: 'noDue', label: 'Senza scadenza', color: 'var(--text-muted)' },
    ];

    let html = '<div class="my-tasks-view">';
    groupConfig.forEach(g => {
        const items = groups[g.key];
        if (items.length === 0) return;
        html += `<div class="my-tasks-group">
            <div class="my-tasks-group-title" style="color:${g.color}">${g.label} <span class="kanban-col-count">${items.length}</span></div>`;
        items.forEach(t => {
            html += `<div class="my-task-item ${g.key==='overdue'?'overdue-item':''}" onclick="openTaskModal('${t.id}','${p.id}')">
                <span class="my-task-title">${esc(t.title)}</span>
                ${t.dueDate?`<span style="font-size:11px;color:var(--text-muted)">${smartDate(t.dueDate)}</span>`:''}
                ${t.estimateHours?`<span class="task-card-estimate">${t.estimateHours}h</span>`:''}
                <button class="quick-status-btn" onclick="event.stopPropagation();cycleTaskStatus('${t.id}','${p.id}')">${STATUS_LABELS[t.status]}</button>
            </div>`;
        });
        html += '</div>';
    });
    if (Object.values(groups).every(g => g.length === 0)) {
        html += '<div style="text-align:center;padding:40px;color:var(--text-muted)">Nessuna task assegnata a te</div>';
    }
    html += '</div>';
    return html;
}

// ===== VIEW 6: SUMMARY =====
function renderSummary(p) {
    const tasks = p.tasks || [];
    const statusCounts = {};
    STATUS_LIST.forEach(s => statusCounts[s] = tasks.filter(t=>t.status===s).length);

    // Donut SVG
    const total = tasks.length || 1;
    const donutData = STATUS_LIST.map(s => ({ status: s, count: statusCounts[s], pct: statusCounts[s]/total }));
    let donutSVG = buildDonut(donutData, total);

    // Velocity
    const now = Date.now();
    const thisWeekDone = tasks.filter(t => t.completedAt && (now - t.completedAt) < 7*86400000).length;
    const lastWeekDone = tasks.filter(t => t.completedAt && (now - t.completedAt) >= 7*86400000 && (now - t.completedAt) < 14*86400000).length;

    // Team workload
    const team = getTeam();

    // Next deadlines
    const nextDue = tasks.filter(t=>t.status!=='done'&&t.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,10);

    // Blocked
    const blocked = tasks.filter(t=>t.status==='blocked');

    let html = '<div class="summary-grid">';

    // Donut
    html += `<div class="summary-card">
        <div class="summary-card-title">Distribuzione task</div>
        <div class="donut-chart">${donutSVG}
            <div class="donut-legend">
                ${STATUS_LIST.map(s=>`<div class="donut-legend-item">
                    <span class="donut-legend-dot" style="background:${STATUS_COLORS[s]}"></span>
                    <span>${STATUS_LABELS[s]}: ${statusCounts[s]}</span>
                </div>`).join('')}
            </div>
        </div>
    </div>`;

    // Velocity
    html += `<div class="summary-card">
        <div class="summary-card-title">Velocita</div>
        <div class="speed-row"><span class="speed-label">Ultimi 7 giorni</span><span class="speed-value" style="color:var(--green)">${thisWeekDone} task completate</span></div>
        <div class="speed-row"><span class="speed-label">7 giorni precedenti</span><span class="speed-value">${lastWeekDone} task completate</span></div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">
            ${thisWeekDone > lastWeekDone ? 'Trend positivo' : thisWeekDone < lastWeekDone ? 'Rallentamento rispetto alla settimana scorsa' : 'Ritmo costante'}
        </div>
    </div>`;

    // Team task counts
    html += `<div class="summary-card">
        <div class="summary-card-title">Task per persona</div>
        <div style="display:flex;flex-direction:column;gap:8px">`;
    team.forEach(m => {
        const memberActive = tasks.filter(t=>t.assignee===m.name&&t.status!=='done').length;
        const memberBlocked = tasks.filter(t=>t.assignee===m.name&&t.status==='blocked').length;
        const memberDone = tasks.filter(t=>t.assignee===m.name&&t.status==='done').length;
        if (memberActive === 0 && memberDone === 0) return;
        html += `<div style="display:flex;align-items:center;gap:10px;padding:4px 0">
            <span class="avatar-xs" style="background:${m.color}">${initials(m.name)}</span>
            <span style="flex:1;font-size:12px;font-weight:600;color:${m.color}">${esc(m.name)}</span>
            <span style="font-size:12px;font-weight:700">${memberActive} attive</span>
            ${memberBlocked > 0 ? `<span style="font-size:11px;color:var(--red);font-weight:600">${memberBlocked} bloccate</span>` : ''}
            <span style="font-size:11px;color:var(--green)">${memberDone} fatte</span>
        </div>`;
    });
    html += '</div></div>';

    // Next deadlines
    html += `<div class="summary-card">
        <div class="summary-card-title">Prossime scadenze</div>
        <div class="dash-list">`;
    nextDue.forEach(t => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div class="dash-list-item" onclick="openTaskModal('${t.id}','${p.id}')" style="padding:6px 8px">
            <span style="flex:1;font-size:12px;font-weight:600">${esc(t.title)}</span>
            <span class="task-card-due ${dc}" style="font-size:11px">${smartDate(t.dueDate)}</span>
        </div>`;
    });
    if (nextDue.length === 0) html += '<div style="font-size:12px;color:var(--text-muted);padding:8px">Nessuna scadenza</div>';
    html += '</div></div>';

    // Blocked / decisions
    if (blocked.length > 0) {
        html += `<div class="summary-card" style="grid-column:1/-1">
            <div class="summary-card-title" style="color:var(--red)">Decisioni da prendere</div>
            <div class="dash-list">`;
        blocked.forEach(t => {
            html += `<div class="dash-list-item" onclick="openTaskModal('${t.id}','${p.id}')" style="border-left:3px solid var(--red)">
                <span style="flex:1;font-weight:600;font-size:13px">${esc(t.title)}</span>
                <span style="font-size:11px;color:var(--text-muted)">${esc(t.assignee||'')}</span>
                ${t.note?`<span style="font-size:11px;color:var(--text-secondary);font-style:italic;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.note)}</span>`:''}
            </div>`;
        });
        html += '</div></div>';
    }

    html += '</div>';
    return html;
}

function buildDonut(data, total) {
    const size = 140, cx = 70, cy = 70, r = 55, strokeW = 20;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    let paths = '';

    data.forEach(d => {
        if (d.count === 0) return;
        const len = (d.count / total) * circumference;
        const colorMap = { todo: '#6B7280', in_progress: '#3B7DD8', review: '#8B5CF6', done: '#3D9A50', blocked: '#D94F4F' };
        paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[d.status]}" stroke-width="${strokeW}" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="-${offset}" transform="rotate(-90 ${cx} ${cy})" />`;
        offset += len;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeW}" />
        ${paths}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">${total}</text>
        <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">task</text>
    </svg>`;
}

// ========== DRAG & DROP ==========
// ========== GLOBAL BOARD DRAG (changes STATUS) ==========
let globalDragData = { taskId: null, projectId: null };

function onDragStartGlobal(e, taskId, projectId) {
    globalDragData = { taskId, projectId };
    e.dataTransfer.effectAllowed = 'move';
    e.target.classList.add('dragging');
}

function onDragOverGlobal(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function onDropGlobal(e, newStatus) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!globalDragData.taskId) return;
    const projects = getProjects();
    const p = projects.find(pr => pr.id === globalDragData.projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === globalDragData.taskId);
    if (task && task.status !== newStatus) {
        const wasDone = task.status === 'done';
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[newStatus] || newStatus) });
        task.status = newStatus;
        if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
        if (task.status !== 'done') task.completedAt = null;
        saveProjects(projects);
        if (!wasDone && task.status === 'done') onTaskCompleted();
    }
    globalDragData = { taskId: null, projectId: null };
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    render();
}

// ========== PROJECT BOARD DRAG ==========
function onDragStart(e, taskId) {
    state.dragTask = taskId;
    e.dataTransfer.effectAllowed = 'move';
    e.target.classList.add('dragging');
}

function onDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

function onDrop(e, projectId, newStatus) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!state.dragTask) return;

    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === state.dragTask);
    if (task && task.status !== newStatus) {
        const oldStatus = task.status;
        task.status = newStatus;
        if (newStatus === 'done' && !task.completedAt) {
            task.completedAt = Date.now();
            onTaskCompleted();
        }
        if (oldStatus === 'done' && newStatus !== 'done') {
            task.completedAt = null;
        }
        saveProjects(projects);
    }
    state.dragTask = null;
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    render();
}

// ========== STATUS CYCLING ==========
function cycleTaskStatus(taskId, projectId) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    const idx = STATUS_LIST.indexOf(task.status);
    const wasDone = task.status === 'done';
    const oldStatus = task.status;
    task.status = STATUS_LIST[(idx + 1) % STATUS_LIST.length];
    if (oldStatus !== task.status) {
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[task.status] || task.status) });
    }
    if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
    if (task.status !== 'done') task.completedAt = null;
    saveProjects(projects);
    if (!wasDone && task.status === 'done') onTaskCompleted();
    render();
}

function changeTaskStatus(taskId, projectId, newStatus) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    const wasDone = task.status === 'done';
    if (task.status !== newStatus) {
        if (!task.activityLog) task.activityLog = [];
        task.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[newStatus] || newStatus) });
    }
    task.status = newStatus;
    if (task.status === 'done' && !task.completedAt) task.completedAt = Date.now();
    if (task.status !== 'done') task.completedAt = null;
    saveProjects(projects);
    if (!wasDone && task.status === 'done') onTaskCompleted();
    render();
}

function cycleProjectStatus(projectId) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const idx = PROJECT_STATUSES.indexOf(p.status);
    p.status = PROJECT_STATUSES[(idx + 1) % PROJECT_STATUSES.length];
    saveProjects(projects);
    render();
}

function selectChip(el, rowId) {
    document.querySelectorAll('#' + rowId + ' .chip-option, #' + rowId + ' .assignee-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

function toggleModalExtra() {
    const extra = document.getElementById('modalExtra');
    const arrow = document.getElementById('extraArrow');
    extra.classList.toggle('collapsed');
    arrow.classList.toggle('open');
}

function closeTaskModal() {
    document.getElementById('taskModal').classList.remove('open');
}

function saveTask(taskId, projectId, isNew) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;

    const title = document.getElementById('tmTitle').value.trim();
    if (!title) { document.getElementById('tmTitle').style.borderColor = 'var(--red)'; return; }

    const taskData = {
        id: taskId,
        title: title,
        status: (function(){ var el = document.querySelector('#tmStatusRow .selected'); return el && el.dataset ? el.dataset.val : ''; })() || 'todo',
        assignee: (function(){ var el = document.querySelector('#tmAssigneeRow .selected'); return el && el.dataset ? el.dataset.val : ''; })() || '',
        dueDate: document.getElementById('tmDue').value,
        estimateHours: parseFloat(document.getElementById('tmHours').value) || 0,
        recurrence: document.getElementById('tmRecurrence').value || null,
        note: document.getElementById('tmNote').value,
        ceoNote: document.getElementById('tmCeoNote').value || '',
        nextCheck: document.getElementById('tmNextCheck').value || '',
        doneWhen: document.getElementById('tmDoneWhen').value || '',
        dependsLabel: document.getElementById('tmDependsLabel').value || '',
        tags: [...document.querySelectorAll('#tmTagsWrap .tag-pill')].map(el => el.textContent.replace('×','')),
        dependsOn: [...document.querySelectorAll('.deps-list input:checked')].map(el => el.value),
        comments: [],
        createdAt: Date.now(),
        completedAt: null,
        activityLog: [],
    };

    let justCompleted = false;
    if (isNew) {
        if (taskData.status === 'done') { taskData.completedAt = Date.now(); justCompleted = true; }
        p.tasks.push(taskData);
    } else {
        const existing = p.tasks.find(t => t.id === taskId);
        if (existing) {
            const wasDone = existing.status === 'done';
            taskData.comments = existing.comments;
            taskData.createdAt = existing.createdAt;
            taskData.completedAt = existing.completedAt;
            taskData.activityLog = existing.activityLog || [];
            // Auto-log status change
            if (existing.status !== taskData.status) {
                taskData.activityLog.push({ date: today(), text: 'Stato cambiato in: ' + (STATUS_LABELS[taskData.status] || taskData.status) });
            }
            if (taskData.status === 'done' && !taskData.completedAt) taskData.completedAt = Date.now();
            if (taskData.status !== 'done') taskData.completedAt = null;
            if (!wasDone && taskData.status === 'done') justCompleted = true;
            Object.assign(existing, taskData);
        }
    }

    saveProjects(projects);
    closeTaskModal();
    if (justCompleted) onTaskCompleted();
    render();
}

function deleteTask(taskId, projectId) {
    if (!confirm('Eliminare questa task?')) return;
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    p.tasks = p.tasks.filter(t => t.id !== taskId);
    saveProjects(projects);
    closeTaskModal();
    render();
}

function addComment(taskId, projectId, isNew) {
    const text = document.getElementById('tmNewComment').value.trim();
    if (!text) return;
    if (isNew) {
        // Save task first
        saveTask(taskId, projectId, true);
        return;
    }
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!task.comments) task.comments = [];
    task.comments.push({ text, author: 'Mattia', createdAt: Date.now() });
    saveProjects(projects);
    openTaskModal(taskId, projectId); // refresh modal
}

function addTag(input) {
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const wrap = document.getElementById('tmTagsWrap');
    const existing = [...wrap.querySelectorAll('.tag-pill')].map(el => el.textContent.replace('×',''));
    if (existing.includes(val)) { input.value = ''; return; }
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${esc(val)}<span class="tag-pill-x" onclick="this.parentElement.remove()">&times;</span>`;
    wrap.insertBefore(pill, input);
    input.value = '';
}

function removeTag(el, tag) {
    el.parentElement.remove();
}

function addActivityEntry(taskId, projectId, isNew) {
    const text = document.getElementById('tmNewActivity').value.trim();
    if (!text) return;
    if (isNew) {
        // Task non ancora salvata — salva prima
        saveTask(taskId, projectId, true);
        return;
    }
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const task = p.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!task.activityLog) task.activityLog = [];
    task.activityLog.push({ date: today(), text: text });
    saveProjects(projects);
    openTaskModal(taskId, projectId); // refresh modal
}

function closeProjectModal() {
    document.getElementById('projectModal').classList.remove('open');
}


function saveProject(projectId, isNew) {
    const projects = getProjects();
    const name = document.getElementById('pmName').value.trim();
    if (!name) { document.getElementById('pmName').style.borderColor = 'var(--red)'; return; }

    const launchDate = document.getElementById('pmLaunchDate').value || null;

    if (isNew) {
        projects.push({
            id: projectId,
            name: name,
            description: document.getElementById('pmDesc').value.trim(),
            status: document.getElementById('pmStatus').value,
            launchDate: launchDate,
            tasks: []
        });
    } else {
        const p = projects.find(pr => pr.id === projectId);
        if (!p) return;
        p.name = name;
        p.description = document.getElementById('pmDesc').value.trim();
        p.status = document.getElementById('pmStatus').value;
        p.launchDate = launchDate;
    }

    saveProjects(projects);
    closeProjectModal();
    render();
}

function deleteProject(projectId) {
    if (!confirm('Eliminare questo progetto e tutte le sue task?')) return;
    let projects = getProjects();
    projects = projects.filter(p => p.id !== projectId);
    saveProjects(projects);
    closeProjectModal();
    goGlobal();
}

function showTasksByStatus(projectId, status) {
    const projects = getProjects();
    const p = projects.find(pr => pr.id === projectId);
    if (!p) return;
    const items = (p.tasks||[]).filter(t => t.status === status);
    if (!items.length) return;
    const colorMap = { todo:'var(--slate)', in_progress:'var(--blue)', review:'var(--purple)', done:'var(--green)', blocked:'var(--red)' };
    const bgMap = { todo:'var(--slate-bg)', in_progress:'var(--blue-bg)', review:'var(--purple-bg)', done:'var(--green-bg)', blocked:'var(--red-bg)' };
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:${colorMap[status]}">${STATUS_LABELS[status]} (${items.length})</div>`;
    items.forEach(t => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div style="padding:12px 16px;background:${bgMap[status]};border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px" onclick="document.getElementById('backupModal').classList.remove('open');openTaskModal('${t.id}','${p.id}')">

    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;

function showWeekTasks() {
    const projects = getProjects();
    const now = new Date(); now.setHours(0,0,0,0);
    const weekEnd = new Date(now); weekEnd.setDate(weekEnd.getDate() + 7);
    let items = [];
    projects.forEach(p => {
        (p.tasks||[]).forEach(t => {
            if (t.status === 'done' || !t.dueDate) return;
            const d = new Date(t.dueDate); d.setHours(0,0,0,0);
            if (d >= now && d <= weekEnd) items.push({task: t, project: p});
        });
    });
    if (!items.length) return;
    items.sort((a,b) => new Date(a.task.dueDate) - new Date(b.task.dueDate));
    const modal = document.getElementById('backupModalInner');
    let html = `<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--orange)">Scadenze questa settimana (${items.length})</div>`;
    items.forEach(({task: t, project: p}) => {
        const dc = dateClass(t.dueDate, t.status);
        html += `<div style="padding:12px 16px;background:var(--bg);border-radius:10px;margin-bottom:8px;cursor:pointer;border-left:3px solid ${dc==='overdue'?'var(--red)':dc==='today'?'var(--orange)':'var(--blue)'}" onclick="document.getElementById('backupModal').classList.remove('open');openTaskModal('${t.id}','${p.id}')">

            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${esc(p.name)} — ${t.assignee||'Non assegnata'} — <span class="task-card-due ${dc}">${smartDate(t.dueDate)}</span></div>
        </div>`;
    });
    modal.innerHTML = html + `<div style="text-align:right;margin-top:16px"><button class="btn-cancel" onclick="document.getElementById('backupModal').classList.remove('open')">Chiudi</button></div>`;
    document.getElementById('backupModal').classList.add('open');
}

function cooRespondFromPopup(taskId, projectId) {

function confirmTask(taskId, projectId) {
    var projects = getProjects();
    var p = projects.find(function(pr) { return pr.id === projectId; });
    if (!p) { _showToast('Progetto non trovato', true); return; }
    var t = (p.tasks||[]).find(function(tk) { return tk.id === taskId; });
    if (!t) { _showToast('Task non trovata', true); return; }
    // Leggi commento opzionale
    var commentInput = document.getElementById('daVerificaComment_' + taskId);
    var comment = commentInput ? commentInput.value.trim() : '';
    if (!t.cooResponses) t.cooResponses = [];
    t.cooResponses.push({ note: comment || '[Task confermata]', at: new Date().toISOString() });
    t.status = 'done';
    t.completedAt = new Date().toISOString();
    _setCooAcked(taskId);
    if (!t.activityLog) t.activityLog = [];
    t.activityLog.push({ date: today(), text: 'Confermata dal COO' + (comment ? ': ' + comment : ' (completata da Alberto)') });
    saveProjects(projects);

function rejectTask(taskId, projectId) {

function handleExport() {
    const data = {
        projects: getProjects(),
        team: getTeam(),
        exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `project-board-backup-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.projects) {
                saveProjects(data.projects);
                if (data.team) safeSetItem('pb_team', JSON.stringify(data.team));
                alert('Importazione completata!');
                goGlobal();
            } else {
                alert('File non valido.');
            }
        } catch(err) {
            alert('Errore nel parsing del file.');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ========== DYNAMIC COLORS & GAMIFICATION ==========
function completionColor(pct) {
    // Red(0%) → Orange(25%) → Yellow(50%) → Green(100%) via HSL
    const hue = Math.round(pct * 1.2); // 0=red(0), 30=orange, 60=yellow, 120=green
    return `hsl(${hue}, 70%, 45%)`;
}

function completionColorSoft(pct) {
    const hue = Math.round(pct * 1.2);
    return `hsl(${hue}, 60%, 95%)`;
}

function projectHealthEmoji(p) {
    const tasks = p.tasks || [];
    if (tasks.length === 0) return '';
    const blocked = tasks.filter(t => t.status === 'blocked').length;
    const overdue = tasks.filter(t => t.status !== 'done' && t.dueDate && daysDiff(t.dueDate) < 0).length;
    const done = tasks.filter(t => t.status === 'done').length;
    const pct = Math.round(done / tasks.length * 100);
    if (blocked >= 3 || overdue >= 3) return '\u{1F525}'; // fire - critical
    if (blocked > 0 || overdue > 0) return '\u26A0\uFE0F'; // warning
    if (pct >= 80) return '\u{1F680}'; // rocket - on fire
    if (pct >= 50) return '\u2705'; // check - good
    return '\u{1F3AF}'; // target - in progress
}

// XP System
const XP_PER_LEVEL = 200;
const LEVEL_NAMES = ['Principiante', 'Operativo', 'Produttivo', 'Efficiente', 'Inarrestabile', 'Leggenda', 'Dio del PM', 'Ultra Instinct'];

function getGamificationData() {
    var data = safeGetItem('pb_gamification');
    if (data) return JSON.parse(data);
    return { totalXP: 0, streak: 0, lastCompletionDate: null, completedToday: 0, levelUpShown: -1 };
}

function saveGamificationData(data) {
    safeSetItem('pb_gamification', JSON.stringify(data));
}

function getCurrentLevel(xp) {
    return Math.floor(xp / XP_PER_LEVEL);
}

function getXPInLevel(xp) {
    return xp % XP_PER_LEVEL;
}

function getLevelName(level) {
    return LEVEL_NAMES[Math.min(level, LEVEL_NAMES.length - 1)];
}

function updateStreak() {
    const data = getGamificationData();
    const todayStr = today();
    if (data.lastCompletionDate === todayStr) return; // already updated today
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    if (data.lastCompletionDate === yesterdayStr) {
        data.streak += 1;
    } else if (data.lastCompletionDate !== todayStr) {
        data.streak = 1;
    }
    data.lastCompletionDate = todayStr;
    data.completedToday = (data.completedToday || 0) + 1;
    saveGamificationData(data);
}

function awardXP() {
    const data = getGamificationData();
    const oldLevel = getCurrentLevel(data.totalXP);
    const xpGain = XP_PER_TASK;
    data.totalXP += xpGain;
    const newLevel = getCurrentLevel(data.totalXP);
    updateStreak();
    saveGamificationData(data);
    // Show XP popup
    showXPPopup(`+${xpGain} XP`);
    // Check level up
    if (newLevel > oldLevel) {
        setTimeout(() => showLevelUp(newLevel), 800);
    }
    return xpGain;
}

function renderXPBarInline() {
    const data = getGamificationData();
    const level = getCurrentLevel(data.totalXP);
    const xpInLevel = getXPInLevel(data.totalXP);
    const pct = Math.round(xpInLevel / XP_PER_LEVEL * 100);
    let html = `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;">`;
    html += `<span style="color:var(--accent);font-size:11px;">Lv.${level}</span>`;
    html += `<span style="display:inline-block;width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;"><span style="display:block;height:100%;width:${pct}%;background:var(--accent);border-radius:3px;"></span></span>`;
    html += `<span style="color:var(--text-muted);font-size:10px;">${xpInLevel}/${XP_PER_LEVEL}</span>`;
    if (data.streak > 1) html += `<span style="font-size:11px;">\u{1F525}${data.streak}</span>`;
    html += `</span>`;
    return html;
}

function renderXPBar() {
    const data = getGamificationData();
    const level = getCurrentLevel(data.totalXP);
    const xpInLevel = getXPInLevel(data.totalXP);
    const pct = Math.round(xpInLevel / XP_PER_LEVEL * 100);
    let html = `<div class="xp-bar-wrap">`;
    html += `<span class="xp-level-badge">Lv.${level} ${getLevelName(level)}</span>`;
    html += `<div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>`;
    html += `<span class="xp-label">${xpInLevel}/${XP_PER_LEVEL} XP</span>`;
    if (data.streak > 1) {
        html += `<span class="streak-badge">\u{1F525} ${data.streak}g streak</span>`;
    }
    html += `</div>`;
    return html;
}

        if (document.getElementById('projectModal').classList.contains('open')) { closeProjectModal(); return; }
        if (document.getElementById('backupModal').classList.contains('open')) { closeBackupModal(); return; }
        if (document.getElementById('tutorialModal').classList.contains('open')) { closeTutorialModal(); return; }
        if (state.currentView === 'detail') { goGlobal(); return; }
    }
});

// ========== AUTO-BACKUP (ogni 3 giorni) ==========
function checkAutoBackup() {
    const lastBackup = safeGetItem('pb_last_backup');
    const now = Date.now();
    const threeDays = 3 * 86400000;
    if (lastBackup && (now - parseInt(lastBackup)) < threeDays) return;

    const projects = getProjects();
    if (projects.length === 0) return;

    // Mostra prompt
    const days = lastBackup ? Math.round((now - parseInt(lastBackup)) / 86400000) : null;
    const msg = days ? `Ultimo backup: ${days} giorni fa. Scaricare un backup?` : 'Non hai mai fatto un backup. Scaricare?';
    if (!confirm(msg)) {
        // Posticipa di 1 giorno
        safeSetItem('pb_last_backup', String(now - 2 * 86400000));
        return;
    }

    const data = {
        version: 3,
        exportedAt: new Date().toISOString(),
        tasks: [],
        projects: projects,
        archive: JSON.parse(safeGetItem('tb_archive')||'[]'),
        ideas: JSON.parse(safeGetItem('pb_ideas')||'[]')
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'project_board_backup_' + today() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    safeSetItem('pb_last_backup', String(now));
}

// ========== START ==========
init();
if (!CEO_MODE) setTimeout(checkAutoBackup, 2000); // check dopo caricamento (skip in CEO mode)

// ========== AUTO-SYNC ==========
(function() {
    var POLL_CEO = 45000;  // CEO: refresh ogni 45s
    var POLL_COO = 60000;  // COO: fetch feedback ogni 60s

    if (CEO_MODE) {
        // CEO: ricarica dati da API periodicamente
        setInterval(function() {
            if (!safeGetItem('pb_gh_token_ceo')) return;
            loadCEOData(function() {
                renderCEOView();
                _updateSyncIndicator();
            }, true); // forceRefresh=true
        }, POLL_CEO);
    } else if (window.location.hostname.indexOf('github.io') !== -1) {
        // COO su GitHub Pages: fetch solo feedback CEO (il COO e' la fonte dati, non rilegge data.json)
        setInterval(function() {
            var cooToken = getGHToken();
            if (!cooToken) return;
            _cooFetchCeoActions();
            _cooFetchCeoActionsForBacheca();
            _updateSyncIndicator();
        }, POLL_COO);
    }
})();
</script>
