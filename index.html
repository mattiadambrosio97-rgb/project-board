<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Project Command Center — Mattia D'Ambrosio</title>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister()});});}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --font: 'DM Sans', system-ui, -apple-system, sans-serif;
            --bg: #FAF9F7;
            --surface: #FFFFFF;
            --surface-hover: #FEFDFB;
            --border: #E5E2DC;
            --border-light: #EFECEA;
            --text: #111110;
            --text-secondary: #3D3935;
            --text-muted: #78716C;
            --accent: #F06543;
            --accent-soft: #FFF1ED;
            --accent-strong: #DC4A2A;
            --accent-glow: rgba(240,101,67,0.14);
            --red: #DC2626;
            --orange: #EA580C;
            --yellow: #CA8A04;
            --green: #16A34A;
            --blue: #2563EB;
            --purple: #7C3AED;
            --red-bg: #FEF2F2;
            --orange-bg: #FFF7ED;
            --yellow-bg: #FEFCE8;
            --green-bg: #F0FDF4;
            --blue-bg: #EFF6FF;
            --purple-bg: #F5F3FF;
            --teal: #0D9488;
            --teal-bg: #F0FDFA;
            --pink: #DB2777;
            --pink-bg: #FDF2F8;
            --slate: #78716C;
            --slate-bg: #F5F5F4;
            --indigo: #6366F1;
            --indigo-bg: #EEF2FF;
            --shadow-sm: 0 1px 2px rgba(28,25,23,0.05), 0 1px 3px rgba(28,25,23,0.07);
            --shadow-md: 0 4px 12px rgba(28,25,23,0.08), 0 2px 4px rgba(28,25,23,0.04);
            --shadow-lg: 0 12px 32px rgba(28,25,23,0.12), 0 4px 8px rgba(28,25,23,0.06);
            --shadow-card: 0 1px 3px rgba(28,25,23,0.04), 0 2px 6px rgba(28,25,23,0.03);
            --col-bg: #F5F3F0;
            --col-today: #FFF8F5;
            --drop-zone: rgba(240,101,67,0.10);
            --radius: 12px;
            --radius-lg: 16px;
            --modal-backdrop: rgba(28,25,23,0.45);
        }

        .dark {
            --bg: #000000;
            --surface: #0A0A0A;
            --surface-hover: #141414;
            --border: #1E1E1E;
            --border-light: #141414;
            --text: #F5F3F0;
            --text-secondary: #E0DCD8;
            --text-muted: #B8B2AC;
            --accent: #F06543;
            --accent-soft: #1A0F0A;
            --accent-glow: rgba(240,101,67,0.14);
            --accent-strong: #F4845F;
            --red-bg: #1A0A0A;
            --orange-bg: #1A0F08;
            --yellow-bg: #1A1608;
            --green-bg: #0A1A0E;
            --blue-bg: #0A0F1A;
            --purple-bg: #120A1A;
            --teal: #2DD4BF;
            --teal-bg: #0A1A18;
            --pink-bg: #1A0A12;
            --slate: #A8A29E;
            --slate-bg: #141414;
            --indigo: #A5B4FC;
            --indigo-bg: #0F0E24;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.6);
            --shadow-md: 0 3px 12px rgba(0,0,0,0.7);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.8);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
            --col-bg: #050505;
            --col-today: #0F0A05;
            --drop-zone: rgba(240,101,67,0.12);
            --modal-backdrop: rgba(0,0,0,0.85);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
        }
        .header-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
        .header-brand { display: flex; flex-direction: column; gap: 0; }
        .header-breadcrumb {
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px;
        }
        .header-breadcrumb span { opacity: 0.5; }
        .header-back {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 13px; font-weight: 500; color: var(--accent);
            cursor: pointer; border: none; background: none;
            font-family: var(--font); padding: 0; transition: all 0.15s;
        }
        .header-back:hover { color: var(--accent-strong); }
        .header-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.6px;
            color: var(--text); line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 500px;
        }
        .header-desc {
            font-size: 12px; color: var(--text-muted); font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 400px; margin-top: 1px;
        }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .status-badge {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
            user-select: none; display: inline-flex; align-items: center;
        }
        .status-badge:hover { transform: scale(1.05); }
        .status-attivo { background: var(--green-bg); color: var(--green); }
        .status-in-pausa { background: var(--yellow-bg); color: var(--yellow); }
        .status-completato { background: var(--blue-bg); color: var(--blue); }

        .icon-btn {
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: all 0.2s; font-family: var(--font);
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

        .add-btn {
            padding: 8px 18px; border-radius: 10px; border: none;
            background: var(--accent); color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            font-size: 13px; font-weight: 700; transition: all 0.2s; font-family: var(--font);
            box-shadow: 0 2px 8px rgba(240,101,67,0.3);
        }
        .add-btn:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240,101,67,0.35); }

        .theme-toggle {
            width: 44px; height: 24px; border-radius: 12px;
            background: var(--border); border: none; cursor: pointer;
            position: relative; transition: background 0.3s; flex-shrink: 0;
        }
        .theme-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--surface); box-shadow: var(--shadow-sm); transition: transform 0.3s;
        }
        .dark .theme-toggle { background: var(--accent); }
        .dark .theme-toggle::after { transform: translateX(20px); }

        /* ===== MAIN CONTENT ===== */
        .main-content { flex: 1; overflow: auto; position: relative; }

        /* ===== GLOBAL DASHBOARD ===== */
        .global-view { padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; }
        .top-controls-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .global-stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
        .global-stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 20px;
            display: flex; flex-direction: column; gap: 6px;
            transition: all 0.25s ease; box-shadow: var(--shadow-card);
        }
        .global-stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .global-stat-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .global-stat-value { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; }
        .global-stat-sub { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

        /* ===== ACTION CARDS (riga 1 — urgenti, cliccabili) ===== */
        .action-bar { display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 10px; }
        .action-card {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: var(--radius); cursor: pointer;
            background: var(--surface); border: 1px solid var(--border);
            box-shadow: var(--shadow-card); transition: all 0.2s;
            min-width: 140px; position: relative; overflow: hidden;
        }
        .action-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        }
        .action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .action-card-icon { font-size: 18px; line-height: 1; flex-shrink: 0; }
        .action-card-body { display: flex; flex-direction: column; gap: 1px; }
        .action-card-num { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
        .action-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.8; }

        .action-card.danger { border-color: var(--red); }
        .action-card.danger::before { background: var(--red); }
        .action-card.danger .action-card-num { color: var(--red); }
        .action-card.danger .action-card-label { color: var(--red); }
        .action-card.danger:hover { background: var(--red-bg); border-color: var(--red); }

        .action-card.warning { border-color: var(--orange); }
        .action-card.warning::before { background: var(--orange); }
        .action-card.warning .action-card-num { color: var(--orange); }
        .action-card.warning .action-card-label { color: var(--orange); }
        .action-card.warning:hover { background: var(--orange-bg); border-color: var(--orange); }

        .action-card.caution { border-color: var(--yellow); }
        .action-card.caution::before { background: var(--yellow); }
        .action-card.caution .action-card-num { color: var(--yellow); }
        .action-card.caution .action-card-label { color: var(--yellow); }
        .action-card.caution:hover { background: var(--yellow-bg); border-color: var(--yellow); }

        /* ===== STATS LINE (riga 2 — contesto leggero) ===== */
        .stats-line {
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 6px 16px; margin-bottom: 20px;
            font-size: 13px; color: var(--text-muted); font-weight: 500;
        }
        .stats-line-sep { color: var(--border); font-size: 10px; }
        .stats-line-link { color: var(--text-secondary); cursor: pointer; text-decoration: none; transition: color 0.15s; border-bottom: 1px dashed var(--border); }
        .stats-line-link:hover { color: var(--accent); border-color: var(--accent); }
        .stats-line-warn { color: var(--purple); font-weight: 600; }

        /* Legacy (keep for other views) */
        .stat-pill-compact { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); white-space: nowrap; transition: all 0.2s; }
        .stat-pill-compact:hover { border-color: var(--accent); color: var(--text); }
        .stat-pill-alert { background: var(--red-bg); border-color: var(--red); color: var(--red); }
        .stat-pill-alert:hover { background: var(--red); color: white; }
        .stat-pill-warn { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }
        .stat-pill-warn:hover { background: var(--purple); color: white; }

        .section-title {
            font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.3px;
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
        }
        .section-title .count-badge {
            font-size: 11px; font-weight: 700; background: var(--red-bg); color: var(--red);
            padding: 2px 8px; border-radius: 10px;
        }

        /* Inbox */
        .inbox-section { display: flex; flex-direction: column; gap: 8px; }
        .inbox-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
            box-shadow: var(--shadow-card);
        }
        .inbox-item:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--accent); }
        .inbox-item.overdue { border-left: 3px solid var(--red); }
        .inbox-item.blocked { border-left: 3px solid var(--orange); }
        .inbox-project { font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 140px; }
        .inbox-task-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
        .inbox-assignee { font-size: 12px; color: var(--text-secondary); }
        .inbox-urgency { font-size: 11px; font-weight: 700; color: var(--red); white-space: nowrap; }

        /* Projects Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .project-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 22px;
            cursor: pointer; transition: all 0.25s ease; position: relative;
            box-shadow: var(--shadow-card);
        }
        .project-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .project-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .project-card-name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; letter-spacing: -0.2px; }
        .project-card-stats { display: flex; gap: 16px; margin-bottom: 12px; }
        .project-card-stat { display: flex; flex-direction: column; }
        .project-card-stat-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
        .project-card-stat-value { font-size: 16px; font-weight: 700; }
        .project-card-progress { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .project-card-progress-bar { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
        .project-card-footer { display: flex; justify-content: space-between; align-items: center; }
        .project-card-avatars { display: flex; gap: -4px; }
        .avatar-sm {
            width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 10px; font-weight: 700; color: white;
            border: 2px solid var(--surface); margin-left: -6px;
        }
        .avatar-sm:first-child { margin-left: 0; }
        .project-card-deadline { font-size: 11px; color: var(--text-muted); }
        .project-card-alert {
            position: absolute; top: 12px; right: 12px;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--red); color: white; font-size: 10px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            animation: pulse-alert 2s infinite;
        }
        @keyframes pulse-alert {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217,79,79,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(217,79,79,0); }
        }

        /* Launch calendar */
        .launch-timeline { display: flex; flex-direction: column; gap: 12px; }
        .launch-item {
            display: flex; align-items: center; gap: 16px; padding: 16px 20px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.25s ease;
            position: relative; overflow: hidden; box-shadow: var(--shadow-card);
        }
        .launch-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .launch-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        }
        .launch-countdown {
            min-width: 80px; text-align: center; display: flex; flex-direction: column;
            align-items: center; gap: 2px;
        }
        .launch-countdown-num { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
        .launch-countdown-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted); }
        .launch-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .launch-name { font-size: 15px; font-weight: 700; }
        .launch-date { font-size: 12px; color: var(--text-secondary); }
        .launch-progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; width: 100%; max-width: 200px; }
        .launch-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
        .launch-milestone { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .launch-item.past-due::before { background: var(--red); }
        .launch-item.soon::before { background: var(--orange); }
        .launch-item.on-track::before { background: var(--green); }
        .launch-item.far::before { background: var(--blue); }

        /* My tasks global */
        .my-global-section { display: flex; flex-direction: column; gap: 8px; }
        .my-global-task {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
        }
        .my-global-task:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--accent); }
        .my-global-task.overdue-glow { border-left: 3px solid var(--red); background: var(--red-bg); }
        .my-global-task.today-glow { border-left: 3px solid var(--orange); }

        /* This Week */
        .week-section { display: flex; flex-direction: column; gap: 12px; }
        .week-day-group { display: flex; flex-direction: column; gap: 6px; }
        .week-day-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .week-task-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 14px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .week-task-item:hover { border-color: var(--accent); background: var(--surface-hover); }

        /* ===== PROJECT DETAIL ===== */
        .detail-view { display: flex; flex-direction: column; height: 100%; }

        /* Tabs */
        .tabs-bar {
            display: flex; gap: 2px; border-bottom: 1px solid var(--border);
            padding: 0 32px; flex-shrink: 0; background: var(--surface);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 14px 20px; font-size: 13px; font-weight: 600;
            color: var(--text-muted); border: none; background: none;
            cursor: pointer; font-family: var(--font); position: relative;
            transition: all 0.2s; white-space: nowrap; letter-spacing: 0.1px;
            border-radius: 8px 8px 0 0;
        }
        .tab-btn:hover { color: var(--text); background: var(--accent-glow); }
        .tab-btn.active { color: var(--accent); font-weight: 700; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 6px; right: 6px;
            height: 3px; background: var(--accent); border-radius: 3px 3px 0 0;
        }

        /* Filters */
        .filters-bar {
            display: flex; gap: 10px; padding: 12px 32px; flex-shrink: 0;
            border-bottom: 1px solid var(--border-light); align-items: center;
            flex-wrap: wrap;
        }
        .filter-input, .filter-select {
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 13px;
            font-family: var(--font); outline: none; transition: border-color 0.2s;
        }
        .filter-input:focus, .filter-select:focus { border-color: var(--accent); }
        .filter-input { min-width: 200px; }
        .filter-select { min-width: 130px; cursor: pointer; }
        .filter-clear {
            font-size: 12px; color: var(--red); font-weight: 600;
            cursor: pointer; border: none; background: none; font-family: var(--font);
            padding: 6px 10px; border-radius: 6px; transition: all 0.15s;
            display: none;
        }
        .filter-clear:hover { background: var(--red-bg); }
        .filter-clear.visible { display: inline-flex; }

        /* View content */
        .view-content { flex: 1; overflow: auto; padding: 24px 32px; }

        /* ===== BOARD (KANBAN) ===== */
        .kanban-board {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px;
            min-height: 400px; align-items: flex-start;
        }
        .kanban-column {
            min-width: 290px; max-width: 320px; flex-shrink: 0;
            background: var(--col-bg); border-radius: var(--radius);
            display: flex; flex-direction: column; max-height: calc(100vh - 220px);
            border: 1px solid var(--border-light);
        }
        .kanban-col-header {
            padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px;
            flex-shrink: 0;
        }
        .kanban-col-top-border { height: 3px; border-radius: 3px 3px 0 0; margin: -14px -16px 8px; }
        .kanban-col-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .kanban-col-count {
            font-size: 11px; font-weight: 700; background: var(--border);
            padding: 1px 7px; border-radius: 8px; color: var(--text-secondary);
        }
        .kanban-col-progress { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
        .kanban-col-progress-bar { height: 100%; border-radius: 1px; }
        .kanban-col-body {
            flex: 1; overflow-y: auto; padding: 4px 10px 10px;
            display: flex; flex-direction: column; gap: 8px;
            min-height: 60px;
        }
        .kanban-col-body.drag-over {
            background: var(--drop-zone); border: 2px dashed var(--accent);
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .kanban-empty {
            border: 2px dashed var(--border); border-radius: 8px;
            padding: 20px; text-align: center; font-size: 12px;
            color: var(--text-muted); font-weight: 500;
        }

        /* Task Card */
        .task-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 16px;
            box-shadow: var(--shadow-card);
            cursor: grab; transition: all 0.2s; position: relative;
        }
        .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .task-card.dragging { opacity: 0.5; transform: rotate(2deg); }
        .task-card.done-card { opacity: 0.55; }
        .task-card-priority { position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; }
        .task-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding-left: 8px; }
        .task-card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; }
        .task-card-status-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
            cursor: pointer; margin-top: 3px; margin-left: 8px; transition: transform 0.2s;
        }
        .task-card-status-dot:hover { transform: scale(1.3); }
        .task-card-body { padding-left: 8px; display: flex; flex-direction: column; gap: 6px; }
        .task-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .task-tag {
            font-size: 10px; font-weight: 600; padding: 2px 7px;
            border-radius: 6px; background: var(--accent-soft); color: var(--accent);
        }
        .task-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .task-card-assignee {
            display: flex; align-items: center; gap: 4px; font-size: 11px;
            font-weight: 600; color: var(--text-secondary);
        }
        .avatar-xs {
            width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 8px; font-weight: 700; color: white;
        }
        .task-card-due { font-size: 11px; font-weight: 600; }
        .task-card-due.overdue { color: var(--red); }
        .task-card-due.today { color: var(--orange); }
        .task-card-due.normal { color: var(--text-muted); }
        .task-card-estimate {
            font-size: 10px; font-weight: 700; background: var(--blue-bg);
            color: var(--blue); padding: 1px 6px; border-radius: 6px;
        }
        .task-card-note { font-size: 11px; color: var(--text-muted); font-style: italic; }
        .task-card-dep-warning {
            font-size: 11px; font-weight: 600; color: var(--orange);
            display: flex; align-items: center; gap: 4px;
        }
        .task-card-comments {
            font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 3px;
        }
        .kanban-add-btn {
            padding: 8px 14px; border: 2px dashed var(--border); border-radius: 8px;
            background: none; color: var(--text-muted); font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: var(--font); transition: all 0.2s;
            margin: 4px 10px 10px; text-align: center;
        }
        .kanban-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

        /* ===== LIST VIEW ===== */
        .list-table { width: 100%; border-collapse: collapse; }
        .list-table th {
            text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px;
            border-bottom: 2px solid var(--border); cursor: pointer; user-select: none;
            white-space: nowrap; transition: color 0.2s;
        }
        .list-table th:hover { color: var(--accent); }
        .list-table th .sort-arrow { font-size: 10px; margin-left: 4px; }
        .list-table td {
            padding: 10px 12px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; vertical-align: middle;
        }
        .list-table tr { cursor: pointer; transition: background 0.15s; }
        .list-table tbody tr:hover { background: var(--surface-hover); }
        .list-table .priority-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .inline-select {
            padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 12px;
            font-family: var(--font); cursor: pointer;
        }
        .status-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px; font-size: 11px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            user-select: none; border: none; font-family: var(--font);
            white-space: nowrap; vertical-align: middle; line-height: 1.3;
        }
        .status-chip:hover { transform: scale(1.05); filter: brightness(0.90); box-shadow: var(--shadow-sm); }
        .status-chip::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            display: inline-block; flex-shrink: 0;
        }
        .status-chip-todo { background: var(--slate-bg); color: var(--slate); }
        .status-chip-todo::before { background: var(--slate); }
        .status-chip-in_progress { background: var(--blue-bg); color: var(--blue); }
        .status-chip-in_progress::before { background: var(--blue); }
        .status-chip-review { background: var(--purple-bg); color: var(--purple); }
        .status-chip-review::before { background: var(--purple); }
        .status-chip-done { background: var(--green-bg); color: var(--green); }
        .status-chip-done::before { background: var(--green); }
        .status-chip-blocked { background: var(--red-bg); color: var(--red); }
        .status-chip-blocked::before { background: var(--red); }
        .status-chip-da_verificare { background: var(--teal-bg); color: var(--teal); }
        .status-chip-da_verificare::before { background: var(--teal); }
        .list-add-row {
            padding: 10px 12px; border: none; background: none;
            color: var(--text-muted); font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: var(--font); width: 100%; text-align: left;
            transition: color 0.15s;
        }
        .list-add-row:hover { color: var(--accent); }

        /* ===== CALENDAR VIEW ===== */
        .cal-mode-toggle { display: flex; gap: 4px; margin-left: auto; }
        .cal-mode-btn { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 600; font-family: var(--font); transition: all 0.15s; }
        .cal-mode-btn:hover { border-color: var(--accent); color: var(--accent); }
        .cal-mode-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        .calendar-nav {
            display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
        }
        .calendar-nav-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            transition: all 0.2s; font-family: var(--font);
        }
        .calendar-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .calendar-month-label { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
            background: var(--border); border-radius: var(--radius); overflow: hidden;
        }
        .calendar-day-header {
            background: var(--col-bg); padding: 8px; text-align: center;
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase;
        }
        .calendar-day {
            background: var(--surface); min-height: 96px; padding: 8px;
            display: flex; flex-direction: column; gap: 3px; position: relative;
        }
        .calendar-day.other-month { opacity: 0.35; }
        .calendar-day.today { background: var(--col-today); }
        .calendar-day-num {
            font-size: 12px; font-weight: 600; color: var(--text-secondary);
            margin-bottom: 2px;
        }
        .calendar-day.today .calendar-day-num {
            background: var(--accent); color: white; width: 22px; height: 22px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .calendar-task-pill {
            font-size: 10px; font-weight: 600; padding: 3px 6px;
            border-radius: 4px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; cursor: pointer; transition: all 0.15s;
            line-height: 1.3;
        }
        .calendar-task-pill:hover { transform: scale(1.03); filter: brightness(0.92); box-shadow: var(--shadow-sm); }

        /* Week view */
        .cal-week-grid {
            display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px;
            background: var(--border); border-radius: var(--radius); overflow: hidden;
            width: 100%;
        }
        .cal-week-day {
            background: var(--surface); min-height: 300px; padding: 10px;
            display: flex; flex-direction: column; min-width: 0; overflow: hidden;
        }
        .cal-week-day.today { background: var(--col-today); }
        .cal-week-day-header {
            text-align: center; padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light); margin-bottom: 8px;
        }
        .cal-week-day-name {
            display: block; font-size: 11px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase;
        }
        .cal-week-day-num {
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; color: var(--text);
            width: 32px; height: 32px;
        }
        .cal-week-day-num.today {
            background: var(--accent); color: white; border-radius: 50%;
        }
        .cal-week-tasks {
            flex: 1; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
        }

        /* Year view */
        .cal-year-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
        }
        .cal-year-month {
            background: var(--surface); border-radius: var(--radius); padding: 12px;
            border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
        }
        .cal-year-month:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
        .cal-year-month.current { border-color: var(--accent); background: var(--accent-soft); }
        .cal-year-month-name {
            font-size: 13px; font-weight: 700; color: var(--text);
            margin-bottom: 8px; text-align: center;
        }
        .cal-year-mini-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center;
        }
        .cal-year-mini-header {
            font-size: 9px; font-weight: 600; color: var(--text-muted); padding: 2px 0;
        }
        .cal-year-mini-day {
            font-size: 10px; padding: 3px 0; color: var(--text-secondary); border-radius: 50%;
        }
        .cal-year-mini-day.empty { visibility: hidden; }
        .cal-year-mini-day.has-tasks { font-weight: 800; color: var(--accent); background: var(--accent-soft); }
        .cal-year-mini-day.today { background: var(--accent); color: white; font-weight: 800; }

        /* Week view — enhanced operational */
        .cal-week-day.weekend { background: var(--col-bg); }
        .cal-week-day-count {
            font-size: 10px; font-weight: 700; background: var(--accent);
            color: white; padding: 1px 6px; border-radius: 10px; margin-left: auto;
        }
        .cal-week-task-card {
            display: flex; align-items: flex-start; gap: 8px; padding: 8px;
            border-radius: 8px; border: 1px solid var(--border-light); background: var(--surface);
            cursor: pointer; transition: all 0.15s; min-width: 0; overflow: hidden;
        }
        .cal-week-task-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
        .cal-week-task-card.launch { background: var(--accent-soft); border-color: var(--accent); cursor: default; }
        .cal-week-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
        .cal-week-task-info { flex: 1; min-width: 0; }
        .cal-week-task-title {
            font-size: 12px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cal-week-task-meta {
            display: flex; align-items: center; gap: 4px; margin-top: 2px;
            font-size: 10px; color: var(--text-muted); overflow: hidden;
        }
        .cal-week-task-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cal-week-day-header {
            display: flex; align-items: center; gap: 6px;
            padding-bottom: 8px; border-bottom: 1px solid var(--border-light); margin-bottom: 8px;
        }

        /* Year view — enhanced strategic */
        .cal-year-month-stats { padding: 6px 0 4px; }
        .cal-year-progress {
            height: 4px; background: var(--border); border-radius: 2px;
            overflow: hidden; margin-bottom: 4px;
        }
        .cal-year-progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
        .cal-year-stat-row { display: flex; gap: 8px; font-size: 11px; align-items: center; }
        .cal-year-launch-badge {
            font-size: 10px; font-weight: 700; color: var(--accent);
            background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; margin-top: 6px;
        }

        /* ===== PEOPLE VIEW ===== */
        .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .person-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 22px; transition: all 0.25s ease;
            box-shadow: var(--shadow-card);
        }
        .person-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .person-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .avatar-lg {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 16px; font-weight: 700; color: white;
        }
        .person-info { flex: 1; }
        .person-name { font-size: 15px; font-weight: 700; }
        .person-role { font-size: 12px; color: var(--text-muted); }
        .capacity-bar-wrap { margin-bottom: 14px; }
        .capacity-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .capacity-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .capacity-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .person-tasks { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
        .person-task-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 10px;
            border-radius: 6px; background: var(--bg); font-size: 12px; transition: all 0.15s;
            cursor: pointer;
        }
        .person-task-item:hover { background: var(--accent-soft); }

        /* ===== MY TASKS VIEW ===== */
        .my-tasks-view { display: flex; flex-direction: column; gap: 20px; }
        .my-tasks-group { display: flex; flex-direction: column; gap: 6px; }
        .my-tasks-group-title {
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 4px 0; display: flex; align-items: center; gap: 8px;
        }
        .my-task-item {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
            box-shadow: var(--shadow-card);
        }
        .my-task-item:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .my-task-item.overdue-item { background: var(--red-bg); border-color: var(--red); }
        .my-task-project { font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 120px; }
        .my-task-title { font-size: 13px; font-weight: 600; flex: 1; }
        .quick-status-btn {
            padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--surface); font-size: 11px; font-weight: 600;
            cursor: pointer; font-family: var(--font); transition: all 0.15s;
        }
        .quick-status-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== SUMMARY VIEW ===== */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .summary-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 22px;
            box-shadow: var(--shadow-card); transition: all 0.2s;
        }
        .summary-card:hover { box-shadow: var(--shadow-md); }
        .summary-card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.2px; }
        .donut-chart { display: flex; justify-content: center; align-items: center; gap: 24px; }
        .donut-legend { display: flex; flex-direction: column; gap: 6px; }
        .donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .donut-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

        /* Dashboard stat cards */
        .dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .dash-stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px;
            text-align: center; transition: all 0.25s ease; box-shadow: var(--shadow-card);
        }
        .dash-stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .dash-stat-value { font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -1.5px; }
        .dash-stat-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
        .dash-progress-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .dash-progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }

        /* ===== GAMIFICATION ===== */
        .xp-bar-wrap {
            display: flex; align-items: center; gap: 10px; padding: 0 8px;
        }
        .xp-level-badge {
            font-size: 11px; font-weight: 800; color: var(--accent);
            background: var(--accent-soft); padding: 3px 10px; border-radius: 12px;
            white-space: nowrap; letter-spacing: 0.3px;
        }
        .xp-bar-track {
            flex: 1; height: 6px; background: var(--border); border-radius: 3px;
            overflow: hidden; max-width: 120px;
        }
        .xp-bar-fill {
            height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--yellow));
            transition: width 0.6s ease;
        }
        .xp-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }

        .streak-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; color: var(--orange);
            background: var(--orange-bg); padding: 3px 10px; border-radius: 12px;
        }

        .health-emoji { font-size: 16px; margin-left: 4px; }

        /* Confetti */
        .confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; width: 10px; height: 10px;
            top: -10px; opacity: 1;
            animation: confetti-fall 2.5s ease-in forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        /* XP popup */
        .xp-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; font-weight: 900; color: var(--accent);
            z-index: 9998; pointer-events: none;
            animation: xp-pop 1.5s ease-out forwards;
            text-shadow: 0 4px 20px rgba(240,101,67,0.4);
            letter-spacing: -2px;
        }
        @keyframes xp-pop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            50% { transform: translate(-50%, -60%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(0.8); opacity: 0; }
        }

        /* Level up */
        .levelup-overlay {
            position: fixed; inset: 0; z-index: 9997;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            animation: levelup-flash 2s ease-out forwards;
        }
        .levelup-text {
            font-size: 56px; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), var(--yellow), var(--green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: levelup-bounce 2s ease-out forwards;
        }
        @keyframes levelup-flash {
            0% { background: rgba(240,101,67,0.15); }
            100% { background: transparent; }
        }
        @keyframes levelup-bounce {
            0% { transform: scale(0); opacity: 0; }
            30% { transform: scale(1.4); opacity: 1; }
            60% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }
        .dash-section { margin-bottom: 14px; }
        .dash-section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.2px; }
        .dash-list { display: flex; flex-direction: column; gap: 6px; }
        .dash-list-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            background: var(--bg); border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: all 0.15s;
        }
        .dash-list-item:hover { background: var(--accent-soft); }
        .activity-log { display: flex; flex-direction: column; gap: 4px; }
        .activity-item { font-size: 12px; color: var(--text-secondary); padding: 4px 0; display: flex; gap: 8px; }
        .activity-time { font-size: 11px; color: var(--text-muted); min-width: 60px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--modal-backdrop);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface); border-radius: var(--radius-lg);
            width: 90%; max-width: 640px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 8px 20px rgba(0,0,0,0.08);
            transform: translateY(20px); transition: transform 0.25s;
            padding: 32px;
        }
        .modal-overlay.open .modal { transform: translateY(0); }
        /* Status/Priority chip selectors */
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip-option {
            padding: 6px 14px; border-radius: 20px; font-size: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.15s;
            border: 2px solid transparent; user-select: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .chip-option:hover { transform: scale(1.04); filter: brightness(0.95); }
        .chip-option.selected { border-color: currentColor; box-shadow: 0 0 0 1px currentColor; font-weight: 700; }
        .chip-option::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            display: inline-block; background: currentColor;
        }
        .modal-section-toggle {
            display: flex; align-items: center; gap: 6px; padding: 8px 0;
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            cursor: pointer; border: none; background: none; font-family: var(--font);
            transition: color 0.15s; margin-top: 10px;
        }
        .modal-section-toggle:hover { color: var(--accent); }
        .modal-section-toggle .toggle-arrow { transition: transform 0.2s; font-size: 10px; }
        .modal-section-toggle .toggle-arrow.open { transform: rotate(90deg); }
        .modal-extra { overflow: hidden; transition: max-height 0.3s ease; }
        .modal-extra.collapsed { max-height: 0 !important; }
        .assignee-chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
            border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
            border: 2px solid var(--border); background: var(--surface);
            transition: all 0.15s; user-select: none; color: var(--text);
        }
        .assignee-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
        .assignee-chip.selected {
            border-color: var(--accent); background: var(--accent-soft);
            color: var(--text); box-shadow: 0 0 0 1px var(--accent);
        }
        .assignee-chip.selected .avatar-xs { box-shadow: 0 0 0 2px var(--accent-soft); }

        .modal-close-bar {
            display: flex; justify-content: flex-end; margin: -4px -4px 8px 0;
        }
        .modal-close-x {
            width: 36px; height: 36px; border-radius: 8px; border: none;
            background: var(--surface-hover); color: var(--text-muted); font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; font-family: var(--font); line-height: 1;
        }
        .modal-close-x:hover { background: var(--border); color: var(--text); }
        .modal-title-input {
            width: 100%; font-size: 22px; font-weight: 800; border: none;
            background: none; color: var(--text); font-family: var(--font);
            outline: none; padding: 0 0 14px; border-bottom: 2px solid var(--border-light);
            letter-spacing: -0.3px;
        }
        .modal-title-input:focus { border-bottom-color: var(--accent); }
        .modal-row { display: flex; gap: 12px; margin-top: 14px; }
        .modal-field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .modal-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .modal-select, .modal-input {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 13px;
            font-family: var(--font); outline: none; width: 100%; transition: border-color 0.2s;
        }
        .modal-select:focus, .modal-input:focus { border-color: var(--accent); }
        .modal-textarea {
            padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 13px;
            font-family: var(--font); outline: none; width: 100%;
            resize: vertical; min-height: 60px; transition: border-color 0.2s;
        }
        .modal-textarea:focus { border-color: var(--accent); }
        .tags-input-wrap {
            display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 8px; min-height: 36px;
            align-items: center; cursor: text;
        }
        .tags-input-wrap:focus-within { border-color: var(--accent); }
        .tag-pill {
            display: flex; align-items: center; gap: 3px; font-size: 11px;
            font-weight: 600; padding: 2px 8px; border-radius: 6px;
            background: var(--accent-soft); color: var(--accent);
        }
        .tag-pill-x { cursor: pointer; font-size: 13px; font-weight: 700; opacity: 0.7; }
        .tag-pill-x:hover { opacity: 1; }
        .tags-input {
            border: none; background: none; outline: none; font-size: 12px;
            font-family: var(--font); color: var(--text); flex: 1; min-width: 80px;
        }
        .deps-list { display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
        .dep-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .dep-item input[type="checkbox"] { accent-color: var(--accent); }
        .comments-section { margin-top: 16px; border-top: 1px solid var(--border-light); padding-top: 14px; }
        .comments-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
        .comment-item {
            padding: 8px 12px; background: var(--bg); border-radius: 8px;
            margin-bottom: 6px; font-size: 12px;
        }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .comment-author { font-weight: 700; color: var(--text); }
        .comment-time { font-size: 11px; color: var(--text-muted); }
        .comment-text { color: var(--text-secondary); line-height: 1.5; }
        .comment-add { display: flex; gap: 8px; margin-top: 10px; }
        .comment-add textarea {
            flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 12px;
            font-family: var(--font); outline: none; resize: none; min-height: 36px;
        }
        .comment-add-btn {
            padding: 8px 14px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-size: 12px;
            font-weight: 600; cursor: pointer; font-family: var(--font);
            transition: background 0.2s; align-self: flex-end;
        }
        .comment-add-btn:hover { background: var(--accent-strong); }
        .modal-actions {
            display: flex; justify-content: space-between; margin-top: 20px;
            padding-top: 14px; border-top: 1px solid var(--border-light);
        }
        .btn-delete {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--red);
            background: var(--red-bg); color: var(--red); font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.2s;
        }
        .btn-delete:hover { background: var(--red); color: white; }
        .btn-cancel {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-secondary); font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.2s;
        }
        .btn-cancel:hover { background: var(--bg); }
        .btn-save {
            padding: 9px 22px; border-radius: 10px; border: none;
            background: var(--accent); color: white; font-size: 13px;
            font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(240,101,67,0.3);
        }
        .btn-save:hover { background: var(--accent-strong); box-shadow: 0 4px 14px rgba(240,101,67,0.35); transform: translateY(-1px); }
        .modal-actions-right { display: flex; gap: 8px; }

        /* Backup modal */
        .backup-section { margin-bottom: 16px; }
        .backup-btn {
            padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: var(--font);
            transition: all 0.2s; width: 100%;
        }
        .backup-btn:hover { border-color: var(--accent); color: var(--accent); }
        .backup-info { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

        /* Project modal */

        /* Dark mode refinements */
        .dark .modal { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.3), 0 0 0 1px var(--border); }
        .dark .assignee-chip { border-color: var(--border); }
        .dark .assignee-chip.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
        .dark .task-card { border-color: var(--border); }
        .dark .project-card { border-color: var(--border); }
        .dark .add-btn { box-shadow: 0 2px 8px rgba(240,101,67,0.2); }
        .dark .btn-save { box-shadow: 0 2px 8px rgba(240,101,67,0.2); }
        .dark .kanban-column { border-color: var(--border); }

        .hidden { display: none !important; }

        /* Speed bar */
        .speed-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .speed-label { font-size: 12px; color: var(--text-secondary); min-width: 120px; }
        .speed-value { font-size: 14px; font-weight: 700; }

        /* scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ===== RESPONSIVE — TABLET & MOBILE ===== */
        @media (max-width: 768px) {
            body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }

            /* Header */
            .header {
                flex-wrap: wrap; padding: 12px 16px; gap: 8px;
            }
            .header-left { min-width: 0; flex: 1 1 100%; }
            .header { padding: 8px 16px; gap: 6px; }
            .header-title { font-size: 16px; max-width: 100%; white-space: normal; }
            .header-desc { max-width: 100%; font-size: 12px; }
            .breadcrumb { font-size: 11px; margin-bottom: 0; }
            .header-right { flex-wrap: wrap; gap: 6px; justify-content: flex-start; flex: 1 1 100%; }
            .header-right .add-btn { padding: 8px 16px; font-size: 13px; min-height: 40px; }
            .header-right .icon-btn { width: 36px; height: 36px; font-size: 15px; }
            .copy-data-btn { font-size: 12px !important; padding: 8px 12px !important; }

            /* Global dashboard */
            .global-view { padding: 16px; gap: 12px; }
            .top-controls-row { flex-direction: column; gap: 8px; }
            .global-stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .global-stat-value { font-size: 28px; }
            .global-stat-label { font-size: 13px; }

            /* Action bar */
            .action-bar { gap: 8px; flex-direction: column; }
            .action-card { min-width: 0; padding: 12px 16px; flex: 1 1 100%; }
            .action-card-num { font-size: 20px; }
            .action-card-label { font-size: 13px; }
            .action-card-icon { font-size: 20px; }

            /* Stats line */
            .stats-line { font-size: 13px; gap: 4px 10px; }

            /* Projects grid */
            .projects-grid { grid-template-columns: 1fr; }

            /* Tabs bar — STICKY + compact */
            .tabs-bar {
                padding: 0 12px; overflow-x: auto; -webkit-overflow-scrolling: touch;
                scrollbar-width: none; -ms-overflow-style: none;
                position: sticky; top: 0; z-index: 50; background: var(--surface);
                border-bottom: 1px solid var(--border);
            }
            .tabs-bar::-webkit-scrollbar { display: none; }
            .tab-btn { padding: 10px 10px; font-size: 13px; white-space: nowrap; }

            /* Filters bar */
            .filters-bar { padding: 10px 16px; gap: 8px; flex-wrap: wrap; }
            .filter-input { min-width: 0; width: 100%; flex: 1 1 100%; font-size: 14px; }
            .filter-select { min-width: 0; flex: 1 1 calc(50% - 4px); font-size: 14px; }

            /* View content */
            .view-content { padding: 12px 16px; }

            /* ====== KANBAN BOARD — VERTICAL STACK on mobile ====== */
            .kanban-board {
                flex-direction: column; overflow-x: visible; gap: 12px;
            }
            .kanban-column {
                min-width: 100% !important; max-width: 100% !important; flex-shrink: 1;
            }
            .kanban-col-body { max-height: none; }
            .kanban-empty { display: none; }
            .kanban-add-btn { font-size: 14px; padding: 10px; min-height: 40px; }

            /* ====== LIST TABLE — CARD LAYOUT on mobile ====== */
            .list-table { display: block; border: none; }
            .list-table thead { display: none; }
            .list-table tbody { display: flex; flex-direction: column; gap: 8px; }
            .list-table tr {
                display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
                gap: 4px 10px; align-items: center;
                padding: 14px 16px; border: 1px solid var(--border);
                border-radius: 10px; background: var(--surface);
                cursor: pointer;
            }
            .list-table tr:hover { background: var(--surface-hover); }
            .list-table td { padding: 0; border: none; white-space: normal; font-size: 14px; }
            .list-table td.td-check { grid-row: 1 / 3; grid-column: 1; align-self: center; }
            .list-table td.td-title { grid-row: 1; grid-column: 2; font-size: 15px; font-weight: 700; }
            .list-table td.td-assignee { display: none; }
            .list-table td.td-status { grid-row: 2; grid-column: 2; justify-self: start; }
            .list-table td.td-due { grid-row: 2; grid-column: 2; justify-self: end; }
            .list-table .status-chip { font-size: 12px; }
            .list-add-row { font-size: 15px; padding: 12px; min-height: 44px; }

            /* ====== TASK CARDS — bigger text, comfy tap ====== */
            .task-card { padding: 14px 16px; gap: 10px; }
            .task-card-title { font-size: 15px; }
            .task-card-status-dot { width: 14px; height: 14px; }
            .task-card-meta { font-size: 13px; }
            .task-card-due { font-size: 12px; }
            .task-card-assignee { font-size: 12px; }
            .task-card-tags .tag-chip { font-size: 11px; }

            /* Calendar nav */
            .calendar-nav {
                flex-wrap: wrap; gap: 8px;
            }
            .calendar-month-label { font-size: 17px; flex: 1 1 auto; min-width: 0; }
            .calendar-nav-btn { width: 36px; height: 36px; flex-shrink: 0; font-size: 16px; }
            .cal-mode-toggle { gap: 3px; flex-wrap: nowrap; }
            .cal-mode-btn { font-size: 12px; padding: 6px 10px; white-space: nowrap; min-height: 34px; }

            /* Calendar month grid */
            .calendar-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
            .calendar-day { min-height: 50px; padding: 3px; }
            .calendar-day-num { font-size: 11px; }
            .calendar-day-header { font-size: 10px; padding: 4px 2px; }
            .calendar-task-pill { font-size: 9px; padding: 2px 4px; }

            /* Calendar week grid — vertical stack on mobile */
            .cal-week-grid {
                grid-template-columns: 1fr !important;
                gap: 0;
            }
            .cal-week-day {
                min-height: auto; padding: 12px 14px;
                border-bottom: 1px solid var(--border-light);
            }
            .cal-week-day-header {
                padding-bottom: 8px; margin-bottom: 8px;
            }
            .cal-week-day-name { font-size: 13px; }
            .cal-week-day-num { font-size: 18px; width: 32px; height: 32px; }
            .cal-week-task-card { padding: 8px 10px; }
            .cal-week-task-title { font-size: 14px; white-space: normal; }
            .cal-week-task-meta { font-size: 12px; }

            /* Calendar year grid — 2 columns on tablet */

            .cal-year-month-name { font-size: 13px; }

            /* People grid */
            .people-grid { grid-template-columns: 1fr; }
            .person-name { font-size: 16px; }
            .person-role { font-size: 13px; }
            .person-task-item { font-size: 14px; padding: 8px 0; min-height: 36px; }

            /* Summary grid */
            .summary-grid { grid-template-columns: 1fr; }

            /* Dashboard stats */
            .dash-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .dash-stat-value { font-size: 28px; }
            .dash-stat-label { font-size: 12px; }

            /* Modal — full screen on mobile */
            .modal { width: 100%; max-width: 100%; max-height: 100vh; height: 100vh;
                padding: 16px 16px 24px; border-radius: 0; margin: 0;
                overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .modal-overlay.open { align-items: flex-start; }
            .modal-title-input { font-size: 18px; }
            .modal-close-bar { position: sticky; top: 0; z-index: 10;
                background: var(--surface); padding: 4px 0 8px; margin: -4px 0 8px; }
            .modal-close-x { width: 44px; height: 44px; font-size: 26px;
                background: var(--bg); border: 1px solid var(--border); }
            .modal-actions { position: sticky; bottom: 0; background: var(--surface);
                padding: 12px 0 4px; border-top: 1px solid var(--border-light); margin-top: 16px; }
            .modal-label { font-size: 12px; }
            .modal-select, .modal-input { font-size: 15px; padding: 10px 14px; min-height: 44px; }
            .modal-textarea { font-size: 16px; padding: 10px 14px; }

            /* Chips — wrap nicely */
            .chip-row { gap: 6px; }
            .chip-option { font-size: 13px; padding: 6px 12px; min-height: 34px; }
            .assignee-chip { font-size: 13px; padding: 6px 12px; min-height: 34px; }

            /* Inbox */
            .inbox-item { flex-wrap: wrap; gap: 8px; font-size: 14px; }
            .inbox-project { min-width: 100%; order: -1; font-size: 12px; }
            .inbox-task-title { flex: 1 1 100%; font-size: 15px; }

            /* My tasks global */
            .my-global-task { flex-wrap: wrap; gap: 8px; font-size: 14px; }

            /* Launch items */
            .launch-item { flex-wrap: wrap; gap: 10px; padding: 14px 16px; }
            .launch-countdown { min-width: 60px; }
            .launch-countdown-num { font-size: 24px; }
            .launch-project-name { font-size: 15px; }

            /* Radar & Analysis */
            .radar-section { padding: 14px; }
            .analysis-section { padding: 14px 16px; }
            .radar-item { font-size: 14px; flex-wrap: wrap; }

            /* Mini timeline */
            .mini-timeline { height: 22px; }

            /* XP bar */
            .xp-bar-wrap { flex-wrap: wrap; gap: 6px; }

            /* Main content scroll */
            .main-content { overflow-y: auto; overflow-x: hidden; }

            /* Touch-friendly: bigger tap targets */

            .breadcrumb { font-size: 13px; }

        /* ===== RESPONSIVE — SMALL PHONES (iPhone SE, etc.) ===== */
        @media (max-width: 480px) {

            .cal-week-task-title { font-size: 15px; }
            .cal-week-task-meta { font-size: 12px; }

        /* ===== NEXT CHECK ALERT ===== */
        /* ===== CEO DASHBOARD STYLES ===== */

        .ceo-projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

        .next-check-badge { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 6px; }

// ========== STORAGE SAFETY (WhatsApp in-app browser) ==========
var _storageAvailable = (function() {
    try { var k = '__test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch(e) { return false; }
})();
var _memoryStore = {};
function safeGetItem(key) {
    if (_storageAvailable) { try { return localStorage.getItem(key); } catch(e) { return _memoryStore[key] || null; } }
    return _memoryStore[key] || null;
}
function safeSetItem(key, val) {
    if (_storageAvailable) { try { localStorage.setItem(key, val); } catch(e) { _memoryStore[key] = val; } }
    else { _memoryStore[key] = val; }
}
function safeSessionGet(key) {
    try { return sessionStorage.getItem(key); } catch(e) { return _memoryStore['s_'+key] || null; }
}

}

// ========== PM ANALYSIS (generata dinamicamente) ==========
function generatePMAnalysis() {
    const projects = getProjects().filter(p => p.status !== 'completato');
    const todayStr = today();
    const analyzed = [];

    projects.forEach(p => {
        const tasks = p.tasks || [];
        const total = tasks.length;
        if (total === 0) return;
        const doneCount = tasks.filter(t => t.status === 'done').length;
        const pct = Math.round(doneCount / total * 100);
        const blocked = tasks.filter(t => t.status === 'blocked');
        const overdue = tasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < todayStr);
        const dueSoon = tasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate >= todayStr && daysDiff(t.dueDate) <= 3);
        const remaining = tasks.filter(t => t.status !== 'done');

        // Calcola punteggio rischio (piu alto = peggio)
        let risk = 0;
        risk += blocked.length * 25;
        risk += overdue.length * 15;
        risk += dueSoon.length * 5;
        if (p.launchDate && daysDiff(p.launchDate) <= 7 && pct < 60) risk += 30;
        if (p.launchDate && daysDiff(p.launchDate) <= 14 && pct < 30) risk += 20;
        if (p.status === 'in-pausa') risk = Math.max(risk - 30, 0);

        // Classifica: critico / attenzione / in linea
        let level = 'ok';
        if (risk >= 40 || (blocked.length >= 2 && overdue.length >= 2)) level = 'critical';
        else if (risk >= 15 || blocked.length > 0 || overdue.length >= 2) level = 'warning';

        // Genera contesto e azione suggerita
        let context = '';
        let action = '';

        if (blocked.length > 0) {
            const b = blocked[0];
            const lastComment = (b.comments || []).slice(-1)[0];
            const reason = lastComment ? lastComment.text : 'Motivo non specificato';
            context = 'Bloccata: ' + esc(reason).substring(0, 80);
            action = 'Sbloccare "' + esc(b.title).substring(0, 40) + '"' + (b.assignee ? ' — contattare ' + b.assignee : '');
        }
        if (overdue.length > 0 && !action) {
            const o = overdue.sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0];
            const days = Math.abs(daysDiff(o.dueDate));
            context = overdue.length + ' task scadut' + (overdue.length > 1 ? 'e' : 'a') + ', la piu vecchia da ' + days + 'gg';
            action = 'Recuperare "' + esc(o.title).substring(0, 40) + '"' + (o.assignee ? ' (' + o.assignee + ')' : '');
        }
        if (dueSoon.length > 0 && !context) {
            context = dueSoon.length + ' task in scadenza entro 3gg';
            const ds = dueSoon[0];
            action = 'Priorita: "' + esc(ds.title).substring(0, 40) + '"' + (ds.assignee ? ' (' + ds.assignee + ')' : '');
        }
        if (!context) {
            context = remaining.length + ' task rimanenti';
            action = 'Proseguire come pianificato';
        }

        // Se ci sono blocchi E scadenze, arricchisci l'azione
        if (blocked.length > 0 && overdue.length > 0 && action.startsWith('Sbloccare')) {
            action += ' + recuperare ' + overdue.length + ' scadut' + (overdue.length > 1 ? 'e' : 'a');
        }

        analyzed.push({
            name: p.name,
            pct,
            level,
            context,
            action,
            blocked: blocked.length,
            overdue: overdue.length,
            isPaused: p.status === 'in-pausa',
            launchDate: p.launchDate,
            tasks
        });
    });

    // Ordina: critici prima, poi attenzione, poi ok
    const order = { critical: 0, warning: 1, ok: 2 };
    analyzed.sort((a,b) => order[a.level] - order[b.level]);

    return analyzed;
}

function _cooFetchCeoActionsForBacheca() {
    var ghToken = getGHToken();
    if (!ghToken) return;
    fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_CEO_FILE + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + ghToken }, cache: 'no-store'
    }).then(function(r) { return r.ok ? r.json() : null; })
    .then(function(fileData) {
        if (!fileData || !fileData.content) return;
        var decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
        var ceoActs = JSON.parse(decoded);
        var ress = getResources();
        ress.forEach(function(r) {
            var ra = (ceoActs.resourceActions && ceoActs.resourceActions[r.id]) || {};
            var badgeEl = document.getElementById('cooResModalBadge_' + r.id);
            if (badgeEl) {
                if (ra.read) { badgeEl.style.color = 'var(--green)'; badgeEl.style.background = 'var(--green-bg,#F0FDF4)'; badgeEl.textContent = 'LETTO'; }
                else { badgeEl.style.color = 'var(--orange)'; badgeEl.style.background = 'var(--orange-bg,#FFF7ED)'; badgeEl.textContent = 'NON LETTO'; }
            }
            var feedEl = document.getElementById('cooResModalFeedback_' + r.id);
            var feedback = ra.feedback || [];
            if (feedEl && feedback.length > 0) {
                var fHtml = '<div style="margin-top:6px">';
                feedback.slice(-3).forEach(function(fb) {
                    var fDate = new Date(fb.at).toLocaleDateString('it-IT', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                    fHtml += '<div style="font-size:11px;padding:4px 8px;background:var(--surface);border-radius:6px;margin-bottom:3px"><span style="font-weight:700;color:var(--blue)">Alberto:</span> <span style="color:var(--text-secondary)">' + esc(fb.note) + '</span> <span style="color:var(--text-muted);font-size:10px">' + fDate + '</span></div>';
                });
                fHtml += '</div>';
                feedEl.innerHTML = fHtml;
            }
        });
    }).catch(function() {});
}

function saveResource(id, isNew) {
    var resources = getResources();
    var url = document.getElementById('resUrl').value.trim();
    var content = document.getElementById('resContent').value;
    var type = url && !content.trim() ? 'link' : content.trim() && !url ? 'note' : url && content.trim() ? 'note' : 'note';
    var data = {
        id: id,
        title: document.getElementById('resTitle').value.trim(),
        type: type,
        url: url,
        content: content,
        createdAt: isNew ? new Date().toISOString() : (resources.find(function(r) { return r.id === id; }) || {}).createdAt || new Date().toISOString()
    };
    if (!data.title) { alert('Inserisci un titolo'); return; }
    if (isNew) { resources.unshift(data); } else {
        var idx = resources.findIndex(function(r) { return r.id === id; });
        if (idx >= 0) {
            // Preserva cooReplies e archived dalla versione precedente
            var prev = resources[idx];
            if (prev.cooReplies) data.cooReplies = prev.cooReplies;
            if (prev.archived) { data.archived = prev.archived; data.archivedAt = prev.archivedAt; }
            resources[idx] = data;
        }
    }
    saveResources(resources);
    closeTaskModal();
    render();
}

function deleteResource(id) {
    if (!confirm('Eliminare questa risorsa?')) return;
    saveResources(getResources().filter(function(r) { return r.id !== id; }));
    closeTaskModal();
    render();
}

function cooReplyToResource(resId) {
    var input = document.getElementById('cooReplyInput_' + resId);
    if (!input) return;
    var note = input.value.trim();
    if (!note) { input.focus(); return; }
    var resources = getResources();
    var r = resources.find(function(res) { return res.id === resId; });
    if (!r) return;

function simpleMarkdown(text) {
    if (!text) return '';
    return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^### (.+)$/gm, '<h4 style="margin:8px 0 4px;font-size:14px;font-weight:700">$1</h4>')
        .replace(/^## (.+)$/gm, '<h3 style="margin:10px 0 4px;font-size:16px;font-weight:700">$1</h3>')
        .replace(/^# (.+)$/gm, '<h2 style="margin:12px 0 6px;font-size:18px;font-weight:800">$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^- (.+)$/gm, '<li style="margin-left:16px">$1</li>')
        .replace(/\n/g, '<br>');
}
